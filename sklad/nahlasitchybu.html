<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nahlásit chybu | Sklad</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing:border-box; }
        body { display:none; margin:0; min-height:100vh; background:linear-gradient(145deg,#edf3fa 0%,#f8fafc 55%,#e9f1fa 100%); color:#172b45; font-family:Arial,Helvetica,sans-serif; }
        header { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:22px clamp(18px,5vw,72px); background:#fff; border-bottom:1px solid #dce5ef; }
        .brand { display:flex; align-items:center; gap:14px; }
        .brand-icon { width:48px; height:48px; border-radius:14px; background:#fff0eb; color:#dc5635; display:grid; place-items:center; }
        .brand-icon svg { width:29px; height:29px; }
        h1 { margin:0; font-size:clamp(21px,3vw,29px); font-weight:850; }
        .back { display:inline-flex; align-items:center; padding:12px 18px; border:1px solid #d7e0eb; border-radius:11px; background:white; color:#24364b; font-weight:800; text-decoration:none; white-space:nowrap; }
        .back:hover { background:#f2f6fb; }
        main { min-height:calc(100vh - 96px); display:flex; justify-content:center; align-items:center; padding:32px 18px 75px; }
        .placeholder { width:min(100%,660px); padding:clamp(30px,6vw,60px); border:1px solid #e0e8f1; border-radius:24px; background:#fff; box-shadow:0 20px 55px rgba(30,54,83,.08); text-align:center; }
        .symbol { width:90px; height:90px; display:grid; place-items:center; margin:0 auto 24px; border-radius:24px; background:#fff0eb; color:#db5535; }
        .symbol svg { width:48px; height:48px; }
        .eyebrow { color:#b14c33; font-size:13px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
        .soon { margin:13px 0 17px; font-size:clamp(39px,8vw,72px); line-height:1.08; font-weight:900; letter-spacing:-1.5px; color:#172b45; }
        .description { margin:0 auto; max-width:420px; color:#62738a; font-size:17px; line-height:1.6; }
        @media(max-width:480px) { header {padding:16px;} .brand-icon {width:40px;height:40px;} .back {padding:10px 12px;} }

        .report { width:min(100%,650px); background:#fff; border:1px solid #e0e8f1; border-radius:22px; box-shadow:0 20px 55px rgba(30,54,83,.08); padding:clamp(24px,5vw,42px); }
        .report h2 { margin:0 0 10px; font-size:27px; }
        .report p { color:#62738a; line-height:1.55; margin:0 0 24px; }
        .report label { display:block; margin:18px 0 7px; font-weight:800; }
        .report input,.report textarea { box-sizing:border-box; width:100%; padding:14px; border:1px solid #b9c8d8; border-radius:11px; font:inherit; }
        .report textarea { min-height:150px; resize:vertical; }
        .report button { margin-top:22px; padding:15px 24px; border:0; border-radius:11px; background:#d65c37; color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
        .report button:disabled { opacity:.6; cursor:wait; }
        .feedback { margin-top:17px; font-weight:700; white-space:pre-wrap; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
            <h1>Nahlásit chybu</h1>
        </div>
        <a class="back" href="material.html">← ZPĚT</a>
    </header>
    <main id="obsah"></main>
    <script>
        const SUPABASE_URL = "https://gmawlmsizglrnjmjegmx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        function otevriDatabaziProhlizece() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("kovohladil-prohlizec", 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains("klice")) {
                        db.createObjectStore("klice");
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function nactiExistujiciKlic() {
            if (!window.isSecureContext || !crypto.subtle || !window.indexedDB) {
                throw new Error("Prohlížeč nepodporuje bezpečné ověření.");
            }
            const db = await otevriDatabaziProhlizece();
            try {
                const par = await new Promise((resolve, reject) => {
                    const tx = db.transaction("klice", "readonly");
                    const request = tx.objectStore("klice").get("identita");
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                });
                if (!par?.privateKey || !par?.publicKey) {
                    throw new Error("V tomto prohlížeči není uložen schválený klíč.");
                }
                const jwk = await crypto.subtle.exportKey("jwk", par.publicKey);
                return {
                    par,
                    verejnyKlic: { kty: "EC", crv: "P-256", x: jwk.x, y: jwk.y }
                };
            } finally {
                db.close();
            }
        }

        function kodujBase64url(buffer) {
            let text = "";
            for (const byte of new Uint8Array(buffer)) text += String.fromCharCode(byte);
            return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        async function zavolejSchvalovani(body) {
            const { data, error } = await supabaseClient.functions.invoke(
                "schvalovani-prohlizecu", { body }
            );
            if (error) throw error;
            if (data?.chyba) throw new Error(data.chyba);
            return data;
        }

        async function overSchvalenyProhlizec() {
            const { par, verejnyKlic } = await nactiExistujiciKlic();
            const vyzva = await zavolejSchvalovani({
                akce: "vyzva",
                verejny_klic: verejnyKlic
            });
            if (typeof vyzva?.vyzva !== "string" || !vyzva?.vyzva_id) {
                throw new Error("Server nevrátil platnou výzvu.");
            }
            const podpis = await crypto.subtle.sign(
                { name: "ECDSA", hash: "SHA-256" },
                par.privateKey,
                new TextEncoder().encode(vyzva.vyzva)
            );
            const vysledek = await zavolejSchvalovani({
                akce: "overit",
                verejny_klic: verejnyKlic,
                vyzva_id: vyzva.vyzva_id,
                podpis: kodujBase64url(podpis)
            });
            if (vysledek?.overeno !== true) {
                throw new Error("Prohlížeč není schválený.");
            }
        }




        async function odeslatHlaseni(event) {
            event.preventDefault();
            const tlacitko = document.getElementById("odeslat");
            const zprava = document.getElementById("zprava");
            const materialId = Number(document.getElementById("materialId").value);
            const poznamka = document.getElementById("poznamka").value.trim();
            if (!Number.isSafeInteger(materialId) || materialId < 1 || poznamka.length < 5 || poznamka.length > 2000) {
                zprava.textContent = "Zkontroluj ID materiálu a popis chyby (5 až 2000 znaků).";
                return;
            }
            tlacitko.disabled = true;
            zprava.textContent = "Odesílám hlášení...";
            try {
                const { data, error } = await supabaseClient.from("hlaseni_chyb_skladu")
                    .insert({ material_id: materialId, poznamka }).select("id").single();
                if (error) throw error;
                zprava.textContent = "Hlášení č. " + data.id + " bylo úspěšně odesláno vedení.";
                document.getElementById("formularHlaseni").reset();
            } catch (error) {
                zprava.textContent = error.code === "23503" ? "Materiál s tímto ID neexistuje." : "Odeslání se nepodařilo: " + error.message;
            } finally {
                tlacitko.disabled = false;
            }
        }

        async function spustit() {
            try {
                const { data: prihlaseni, error: chybaPrihlaseni } = await supabaseClient.auth.getSession();
                if (chybaPrihlaseni || !prihlaseni.session) {
                    window.location.replace("../login.html");
                    return;
                }
                // Ověřit platnost tokenu přímo u Supabase Auth, nestačí lokální session.
                const { data: overeny, error: chybaOvereni } = await supabaseClient.auth.getUser();
                if (chybaOvereni || !overeny?.user || overeny.user.id !== prihlaseni.session.user.id) {
                    window.location.replace("../login.html");
                    return;
                }
                await overSchvalenyProhlizec();
                const { data: uzivatel, error: chybaRole } = await supabaseClient.from("uzivatele")
                    .select("role").eq("user_id", prihlaseni.session.user.id).maybeSingle();
                if (chybaRole || !["pracovnik", "vedeni"].includes(uzivatel?.role)) {
                    window.location.replace("material.html");
                    return;
                }
                document.getElementById("obsah").innerHTML = `
                    <section class="report">
                        <h2>Nahlásit chybu ve skladu</h2>
                        <p>Zadej ID materiálu a popiš, co je špatně. Hlášení se odešle vedení, které může opravit příjem nebo historii.</p>
                        <form id="formularHlaseni">
                            <label for="materialId">ID materiálu</label>
                            <input id="materialId" type="number" min="1" step="1" required placeholder="Např. 235">
                            <label for="poznamka">Popis chyby</label>
                            <textarea id="poznamka" minlength="5" maxlength="2000" required placeholder="Co je špatně a jaká hodnota má být správně?"></textarea>
                            <button id="odeslat" type="submit">ODESLAT HLÁŠENÍ</button>
                            <div id="zprava" class="feedback" role="status" aria-live="polite"></div>
                        </form>
                    </section>`;
                document.getElementById("formularHlaseni").addEventListener("submit", odeslatHlaseni);
                document.body.style.display = "block";
            } catch (chyba) {
                console.warn("Přístup k hlášení chyb zamítnut:", chyba);
                window.location.replace("../login.html");
            }
        }
        spustit();
    </script>
</body>
</html>
