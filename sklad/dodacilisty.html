<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dodací listy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{display:none;margin:0;padding:24px 28px 45px;background:#f3f6fa;color:#071b3a;font-family:Arial,Helvetica,sans-serif}
.hlavicka,.obsah{max-width:1440px;margin:0 auto}.hlavicka{display:flex;justify-content:space-between;align-items:center;gap:15px;min-height:75px;border-bottom:1px solid #dbe4ee;margin-bottom:25px}h1{font-size:32px;margin:0}.zpet{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:43px;padding:0 18px;background:#f7f9fb;border:1px solid #d7e0e9;border-radius:7px;color:#14223a;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 7px rgba(18,38,63,.05);transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}.zpet:hover{background:#edf3f8;border-color:#b9c8d7;transform:translateY(-1px);box-shadow:0 4px 12px rgba(18,38,63,.09)}.zpet:active{transform:translateY(0)}.back-arrow{color:#14223a;font-size:17px;line-height:1;font-weight:700}
.filtr-datum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}.filtr-datum label{font-size:14px;font-weight:800}.filtr-datum input{height:43px;padding:0 12px;border:1px solid #d5e0ec;border-radius:7px;background:white;color:#071b3a;font:inherit}.filtr-datum button{height:43px;padding:0 14px;border:1px solid #d5e0ec;border-radius:7px;background:white;color:#071b3a;font-weight:700;cursor:pointer}.stav{padding:20px;border:1px solid #dbe4ee;border-radius:12px;background:white;line-height:1.5}.mrizka{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:17px}.karta{border:1px solid #dbe4ee;background:white;border-radius:12px;overflow:hidden;box-shadow:0 5px 16px rgba(20,45,75,.05);cursor:pointer;text-align:left;padding:0;color:inherit}.karta:hover{border-color:#1688ef}.karta img{width:100%;height:260px;object-fit:contain;background:#f5f7fa;display:block}.info{padding:12px 14px}.datum{font-weight:700;font-size:14px}.soubor{color:#71819a;font-size:12px;margin-top:5px;overflow-wrap:anywhere}.nahled{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:65px 15px 20px}.nahled.otevreno{display:flex}.nahled img{max-width:100%;max-height:100%;object-fit:contain}.zavrit{position:absolute;right:20px;top:15px;color:white;background:transparent;border:0;font-size:36px;cursor:pointer}.pocet{font-size:13px;color:#71819a;margin-bottom:14px}
@media(max-width:700px){body{padding:12px 10px 30px}h1{font-size:23px}.zpet{height:36px;padding:0 11px;font-size:10px}.back-arrow{font-size:15px}.mrizka{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.karta img{height:180px}}
</style>
</head>
<body>
<header class="hlavicka"><h1>Dodací listy</h1><a class="zpet" href="material.html"><span class="back-arrow">←</span> ZPĚT</a></header>
<main class="obsah"><div class="filtr-datum" id="filtrDatumObal" hidden><label for="filtrDatum">Vyhledat podle data nahrání:</label><input type="date" id="filtrDatum"><button type="button" id="vymazatDatum">Zrušit filtr</button></div><div id="pocet" class="pocet"></div><div id="vysledek" class="stav">Ověřuji přístup…</div></main>
<div id="nahled" class="nahled" role="dialog" aria-modal="true" aria-label="Náhled dodacího listu"><button id="zavrit" class="zavrit" type="button" aria-label="Zavřít">×</button><img id="velkaFotka" alt="Fotografie dodacího listu"></div>
<script>
const supabaseClient=window.supabase.createClient("https://gmawlmsizglrnjmjegmx.supabase.co","sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i");
const bucket=supabaseClient.storage.from("dodaci-listy");
const vysledek=document.getElementById("vysledek");
const nahled=document.getElementById("nahled");
const filtrDatum=document.getElementById("filtrDatum");
function filtrujPodleData(){
    const karty=document.querySelectorAll(".mrizka .karta");let pocet=0;
    karty.forEach(karta=>{const zobrazit=!filtrDatum.value||karta.dataset.datum===filtrDatum.value;karta.hidden=!zobrazit;if(zobrazit)pocet++});
    document.getElementById("pocet").textContent=pocet+" z "+karty.length+" fotografií";
    document.getElementById("bezVysledku").hidden=pocet!==0;
}
filtrDatum.addEventListener("change",filtrujPodleData);
document.getElementById("vymazatDatum").addEventListener("click",()=>{filtrDatum.value="";filtrujPodleData()});
function zavriNahled(){nahled.classList.remove("otevreno");document.getElementById("velkaFotka").removeAttribute("src")}
document.getElementById("zavrit").addEventListener("click",zavriNahled);
nahled.addEventListener("click",e=>{if(e.target===nahled)zavriNahled()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")zavriNahled()});
async function nactiSoubory(cesta){
    const vse=[];let offset=0;
    while(true){
        const {data,error}=await bucket.list(cesta,{limit:100,offset,sortBy:{column:"name",order:"asc"}});
        if(error)throw error;
        const polozky=data||[];
        for(const soubor of polozky){
            const cestaSouboru=cesta?cesta+"/"+soubor.name:soubor.name;
            if(soubor.id){if((soubor.metadata?.mimetype||"").startsWith("image/")||/\.(jpe?g|png|webp|heic|gif)$/i.test(soubor.name))vse.push({cesta:cestaSouboru,datum:soubor.created_at||soubor.updated_at||""})}
            else{vse.push(...await nactiSoubory(cestaSouboru))}
        }
        if(polozky.length<100)break;
        offset+=polozky.length;
    }
    return vse;
}
async function spustit(){
    try{
        const {data:prihlaseni,error:chybaPrihlaseni}=await supabaseClient.auth.getSession();
        if(chybaPrihlaseni||!prihlaseni.session){location.replace("../login.html");return}
        document.body.style.display="block";
        const {data:uzivatel,error:chybaRole}=await supabaseClient.from("uzivatele").select("role").eq("user_id",prihlaseni.session.user.id).maybeSingle();
        if(chybaRole||uzivatel?.role!=="vedeni"){vysledek.textContent="Přístup zamítnut. Dodací listy jsou dostupné pouze vedení.";return}
        document.getElementById("filtrDatumObal").hidden=false;
        vysledek.textContent="Načítám fotografie…";
        const soubory=await nactiSoubory("");
        soubory.sort((a,b)=>String(b.datum).localeCompare(String(a.datum)));
        document.getElementById("pocet").textContent=soubory.length+" fotografií";
        if(!soubory.length){vysledek.textContent="Zatím nejsou uložené žádné fotografie.";return}
        const mrizka=document.createElement("div");mrizka.className="mrizka";
        for(const soubor of soubory){
            const {data,error}=await bucket.createSignedUrl(soubor.cesta,3600);
            if(error||!data?.signedUrl){console.error("Náhled dodacího listu:",error);continue}
            const karta=document.createElement("button");karta.type="button";karta.className="karta";karta.dataset.datum=soubor.datum?new Date(soubor.datum).toLocaleDateString("sv-SE",{year:"numeric",month:"2-digit",day:"2-digit"}):"";
            const img=document.createElement("img");img.src=data.signedUrl;img.alt="Dodací list";img.loading="lazy";
            const info=document.createElement("div");info.className="info";
            const datum=document.createElement("div");datum.className="datum";datum.textContent=soubor.datum?new Date(soubor.datum).toLocaleString("cs-CZ"):"Bez data";
            const nazev=document.createElement("div");nazev.className="soubor";nazev.textContent=soubor.cesta.split("/").pop();
            info.append(datum,nazev);karta.append(img,info);
            karta.addEventListener("click",()=>{document.getElementById("velkaFotka").src=data.signedUrl;nahled.classList.add("otevreno")});
            mrizka.appendChild(karta);
        }
        vysledek.replaceWith(mrizka);
        const bezVysledku=document.createElement("div");bezVysledku.id="bezVysledku";bezVysledku.className="stav";bezVysledku.textContent="Pro zvolené datum nebyly nalezeny žádné fotografie.";bezVysledku.hidden=true;mrizka.after(bezVysledku);
        filtrujPodleData();
    }catch(chyba){document.body.style.display="block";vysledek.textContent="Fotografie se nepodařilo načíst: "+(chyba?.message||String(chyba));console.error(chyba)}
}
spustit();
</script>
</body>
</html>
