<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historie skladu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * { box-sizing: border-box; }

        :root {
            --bg:#f4f7fb;
            --card:#fff;
            --line:#dfe7f0;
            --text:#071a38;
            --muted:#6f8097;
            --blue:#1688f5;
            --green:#08aa43;
            --red:#ef3737;
            --orange:#f28a00;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 24px 28px 38px;
            color: var(--text);
            display: none;
        }

        .hlavicka, .filtry, .obsah {
            width: min(1450px, 100%);
            margin-left: auto;
            margin-right: auto;
        }

        .hlavicka {
            min-height: 74px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            border-bottom:1px solid var(--line);
            margin-bottom:18px;
        }

        .hlavicka h1 {
            margin:0;
            font-size:36px;
            line-height:1;
            font-weight:800;
            letter-spacing:-.6px;
        }

        .zpet {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-width:118px;
            height:48px;
            padding:0 20px;
            border:1px solid #d6e0eb;
            border-radius:10px;
            background:#fff;
            color:var(--text);
            text-decoration:none;
            font-size:15px;
            font-weight:800;
            box-shadow:0 3px 12px rgba(20,45,75,.05);
        }

        .filtry {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
            margin-bottom:18px;
        }

        .filtry input {
            width:100%;
            height:48px;
            padding:0 15px;
            border:1px solid #d6e0eb;
            border-radius:9px;
            background:#fff;
            color:var(--text);
            font-size:14px;
            font-weight:600;
            outline:none;
        }

        .filtry input::placeholder { color:#8796aa; }
        .filtry input:focus {
            border-color:var(--blue);
            box-shadow:0 0 0 3px rgba(22,136,245,.08);
        }

        #seznam {
            background:#fff;
            border:1px solid var(--line);
            border-top:0;
            border-radius:0 0 10px 10px;
            overflow:hidden;
            box-shadow:0 4px 14px rgba(20,45,75,.04);
        }

        #seznam::before {
            content:"";
            display:none;
        }

        .tabulka-hlavicka {
            display:grid;
            grid-template-columns:170px 145px minmax(270px,1fr) 170px 120px 90px 190px;
            align-items:center;
            column-gap:16px;
            padding:11px 18px 11px 23px;
            background:#edf2f7;
            color:#667991;
            border:1px solid var(--line);
            border-bottom:0;
            border-radius:10px 10px 0 0;
            font-size:11px;
            font-weight:800;
        }

        .zaznam {
            display:grid;
            grid-template-columns: 170px 145px minmax(270px,1fr) 170px 120px 90px 190px;
            align-items:center;
            min-height:52px;
            padding:0 18px;
            margin:0;
            background:#fff;
            border:0;
            border-left:5px solid #999;
            border-bottom:1px solid var(--line);
            border-radius:0;
            box-shadow:none;
            text-align:left;
            column-gap:16px;
        }

        .zaznam:last-child { border-bottom:0; }
        .zaznam.pridano { border-left-color:var(--green); }
        .zaznam.odebrano { border-left-color:var(--red); }

        .datum, .akce, .detail, .objednavka {
            margin:0;
            font-size:13px;
            line-height:1.25;
        }

        .datum { color:#53667f; font-weight:700; }
        .akce { font-weight:900; }
        .akce.pridano { color:var(--green); }
        .akce.odebrano { color:var(--red); }

        .material-cell { color:var(--text); font-weight:700; }
        .cislo-tavby { color:#0877e8; font-weight:800; }
        .pocet { font-weight:900; }
        .pocet.pridano { color:var(--green); }
        .pocet.odebrano { color:var(--red); }
        .osobni { color:#334760; font-weight:700; }
        .objednavka { color:#334760; font-weight:700; }
        .cislo-objednavky { color:var(--orange); font-weight:900; }

        #seznam > p {
            margin:0;
            padding:20px;
            background:#fff;
        }

        @media (max-width: 900px) {
            body { padding:12px 10px 28px; }

            .hlavicka {
                min-height:58px;
                margin-bottom:12px;
            }

            .hlavicka h1 { font-size:24px; }

            .zpet {
                min-width:82px;
                height:40px;
                padding:0 12px;
                font-size:13px;
            }

            .filtry {
                grid-template-columns:1fr;
                gap:8px;
                margin-bottom:12px;
            }

            .filtry input { height:44px; }

            #seznam {
                background:transparent;
                border:0;
                box-shadow:none;
                overflow:visible;
            }

            #seznam::before { display:none; }
            .tabulka-hlavicka { display:none; }

            .zaznam {
                grid-template-columns:1fr auto;
                gap:7px 12px;
                min-height:0;
                padding:14px 14px;
                margin-bottom:8px;
                border:1px solid var(--line);
                border-left-width:5px;
                border-radius:9px;
                box-shadow:0 3px 10px rgba(20,45,75,.04);
            }

            .datum { grid-column:1; grid-row:1; }
            .akce { grid-column:2; grid-row:1; text-align:right; }
            .material-cell { grid-column:1 / -1; grid-row:2; }
            .tavba-cell { grid-column:1; grid-row:3; }
            .pocet { grid-column:2; grid-row:3; text-align:right; }
            .osobni { grid-column:1; grid-row:4; }
            .objednavka { grid-column:2; grid-row:4; text-align:right; }
        }

    </style>
</head>

<body>

    <div class="hlavicka">

        <h1>Historie skladu</h1>

        <a class="zpet" href="material.html">
            ← ZPĚT
        </a>

    </div>


    <div class="filtry">

        <input
            type="text"
            id="hledatTavbu"
            placeholder="🔎 Hledat tavbu..."
            oninput="zobrazHistorii()"
        >

        <input
            type="text"
            id="hledatObjednavku"
            placeholder="🔎 Hledat objednávku..."
            oninput="zobrazHistorii()"
        >

    </div>


    <div class="obsah">

        <div class="tabulka-hlavicka">
            <div>DATUM</div>
            <div>OPERACE</div>
            <div>MATERIÁL</div>
            <div>TAVBA</div>
            <div>POČET</div>
            <div>OS. Č.</div>
            <div>OBJEDNÁVKA</div>
        </div>

        <div id="seznam">
            Načítám historii...
        </div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let historieData = [];


        /*
            KONTROLA PŘIHLÁŠENÍ
        */

        async function zkontrolujPrihlaseni() {

            const { data, error } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "../login.html"
                );

                return;
            }


            document.body.style.display =
                "block";


            nactiHistorii();
        }


        /*
            NAČTENÍ HISTORIE
        */

        async function nactiHistorii() {

            const seznam =
                document.getElementById("seznam");


            const { data, error } =
                await supabaseClient
                    .from("web_historie")
                    .select("datum, osobni_cislo, akce, material, druh, rozmer, tavba, pocet, objednavka")
                    .order("datum", { ascending: false })
                    .order("id", { ascending: false });


            if (error) {

                seznam.innerHTML =
                    "<p>Chyba při načítání historie:<br>" +
                    error.message +
                    "</p>";

                return;
            }


            historieData = data || [];


            zobrazHistorii();
        }


        /*
            ZOBRAZENÍ HISTORIE
        */

        function escapeHtml(hodnota) {
            return String(hodnota ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        function zobrazHistorii() {

            const seznam =
                document.getElementById("seznam");

            const hledanaTavba =
                document
                    .getElementById("hledatTavbu")
                    .value
                    .trim()
                    .toLowerCase();

            const hledanaObjednavka =
                document
                    .getElementById("hledatObjednavku")
                    .value
                    .trim()
                    .toLowerCase();

            let filtrovanaData = historieData;

            if (hledanaTavba !== "") {
                filtrovanaData =
                    filtrovanaData.filter(zaznam =>
                        String(zaznam.tavba || "")
                            .toLowerCase()
                            .includes(hledanaTavba)
                    );
            }

            if (hledanaObjednavka !== "") {
                filtrovanaData =
                    filtrovanaData.filter(zaznam =>
                        String(zaznam.objednavka || "")
                            .toLowerCase()
                            .includes(hledanaObjednavka)
                    );
            }

            /*
                Nová historie pracuje pouze s přesným počtem kusů.
                Staré technické záznamy ZPŘESNĚNO zaměstnanci
                ve skladu nepotřebují, proto je nezobrazujeme.
            */
            filtrovanaData =
                filtrovanaData.filter(zaznam =>
                    zaznam.akce === "PŘIDÁNO" ||
                    zaznam.akce === "ODEBRÁNO"
                );

            if (filtrovanaData.length === 0) {
                seznam.innerHTML =
                    "<p>Žádné záznamy nebyly nalezeny.</p>";
                return;
            }

            seznam.innerHTML = "";

            filtrovanaData.forEach(zaznam => {

                const jePrijem =
                    zaznam.akce === "PŘIDÁNO";

                const trida =
                    jePrijem ? "pridano" : "odebrano";

                const pocet =
                    Number(zaznam.pocet || 0);

                const pocetHTML =
                    (jePrijem ? "+" : "-") +
                    pocet +
                    " ks";

                let objednavkaHTML = "";

                if (
                    zaznam.objednavka &&
                    String(zaznam.objednavka).trim() !== ""
                ) {
                    objednavkaHTML = `
                        <div class="objednavka">
                            <span class="cislo-objednavky">
                                ${escapeHtml(zaznam.objednavka)}
                            </span>
                        </div>
                    `;
                }

                const osobniCislo =
                    zaznam.osobni_cislo != null &&
                    String(zaznam.osobni_cislo).trim() !== ""
                        ? ` | Os. č. ${escapeHtml(zaznam.osobni_cislo)}`
                        : "";

                seznam.innerHTML += `
                    <div class="zaznam ${trida}">
                        <div class="datum">
                            ${escapeHtml(formatDatum(zaznam.datum))}
                        </div>

                        <div class="akce ${trida}">
                            ${escapeHtml(zaznam.akce)}
                        </div>

                        <div class="material-cell">
                            ${escapeHtml(zaznam.material)} |
                            ${escapeHtml(zaznam.druh)} |
                            ${escapeHtml(zaznam.rozmer)}
                        </div>

                        <div class="tavba-cell">
                            <span class="cislo-tavby">
                                ${escapeHtml(zaznam.tavba)}
                            </span>
                        </div>

                        <div class="pocet ${trida}">
                            ${pocetHTML}
                        </div>

                        <div class="osobni">
                            ${osobniCislo ? osobniCislo.replace(" | Os. č. ", "") : ""}
                        </div>

                        ${objednavkaHTML || '<div class="objednavka"></div>'}
                    </div>
                `;
            });
        }


        /*
            FORMÁT DATA
        */

        function formatDatum(datum) {

            if (!datum) {
                return "";
            }

            const textDatum =
                String(datum).trim();

            /*
                Supabase může vrátit:
                2026-09-20
                2026-09-20T12:34:56...
                případně jiný řetězec data.

                Nejdřív bezpečně přečteme YYYY-MM-DD.
                Tím nevznikne NaN ani v případě času za datem.
            */
            const shoda =
                textDatum.match(/^(\d{4})-(\d{2})-(\d{2})/);

            if (shoda) {

                const rok = Number(shoda[1]);
                const mesic = Number(shoda[2]);
                const den = Number(shoda[3]);

                if (
                    Number.isInteger(rok) &&
                    Number.isInteger(mesic) &&
                    Number.isInteger(den) &&
                    mesic >= 1 &&
                    mesic <= 12 &&
                    den >= 1 &&
                    den <= 31
                ) {
                    return den + ". " + mesic + ". " + rok;
                }
            }

            /*
                Záložní varianta pro jiné validní datumové formáty.
            */
            const parsed =
                new Date(textDatum);

            if (!Number.isNaN(parsed.getTime())) {

                return (
                    parsed.getDate() +
                    ". " +
                    (parsed.getMonth() + 1) +
                    ". " +
                    parsed.getFullYear()
                );
            }

            /*
                Když datum nejde bezpečně rozpoznat,
                zobrazíme původní hodnotu místo "NaN".
            */
            return textDatum;
        }


        /*
            SPUŠTĚNÍ STRÁNKY
        */

        zkontrolujPrihlaseni();

    </script>

</body>
</html>
