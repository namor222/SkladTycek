<!DOCTYPE html>
<html lang="cs">
<head>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=3">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historie skladu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * { box-sizing: border-box; }

        :root {
            --bg:#f4f7fb;
            --card:#fff;
            --line:#dfe7f0;
            --text:#071a38;
            --muted:#6f8097;
            --blue:#1688f5;
            --green:#08aa43;
            --red:#ef3737;
            --orange:#f28a00;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 24px 28px 38px;
            color: var(--text);
            display: none;
        }

        .hlavicka, .filtry, .obsah {
            width: min(1450px, 100%);
            margin-left: auto;
            margin-right: auto;
        }

        .hlavicka {
            min-height: 74px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            border-bottom:1px solid var(--line);
            margin-bottom:18px;
        }

        .hlavicka h1 {
            margin:0;
            font-size:36px;
            line-height:1;
            font-weight:800;
            letter-spacing:-.6px;
        }

        .zpet {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-width:118px;
            height:48px;
            padding:0 20px;
            border:1px solid #d6e0eb;
            border-radius:10px;
            background:#fff;
            color:var(--text);
            text-decoration:none;
            font-size:15px;
            font-weight:800;
            box-shadow:0 3px 12px rgba(20,45,75,.05);
        }

        .tlacitka-hlavicky { display:flex; align-items:center; gap:8px; }
        #podrobnejsi { display:none; }

        .filtry {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
            margin-bottom:18px;
        }

        .filtry input {
            width:100%;
            height:48px;
            padding:0 15px;
            border:1px solid #d6e0eb;
            border-radius:9px;
            background:#fff;
            color:var(--text);
            font-size:14px;
            font-weight:600;
            outline:none;
        }

        .filtry input::placeholder { color:#8796aa; }
        .filtry input:focus {
            border-color:var(--blue);
            box-shadow:0 0 0 3px rgba(22,136,245,.08);
        }

        #seznam {
            background:#fff;
            border:1px solid var(--line);
            border-top:0;
            border-radius:0 0 10px 10px;
            overflow:hidden;
            box-shadow:0 4px 14px rgba(20,45,75,.04);
        }

        #seznam::before {
            content:"";
            display:none;
        }

        .tabulka-hlavicka {
            display:grid;
            grid-template-columns:145px 115px minmax(220px,1fr) 130px 95px 75px 145px 105px;
            align-items:center;
            column-gap:16px;
            padding:11px 18px 11px 23px;
            background:#edf2f7;
            color:#667991;
            border:1px solid var(--line);
            border-bottom:0;
            border-radius:10px 10px 0 0;
            font-size:11px;
            font-weight:800;
        }

        .zaznam {
            display:grid;
            grid-template-columns: 135px 105px minmax(180px,1fr) 115px 85px 65px 110px 75px 92px;
            align-items:center;
            min-height:52px;
            padding:0 18px;
            margin:0;
            background:#fff;
            border:0;
            border-left:5px solid #999;
            border-bottom:1px solid var(--line);
            border-radius:0;
            box-shadow:none;
            text-align:left;
            column-gap:16px;
        }

        .zaznam:last-child { border-bottom:0; }
        .zaznam.pridano { border-left-color:var(--green); }
        .zaznam.odebrano { border-left-color:var(--red); }

        .datum, .akce, .detail, .pruvodka {
            margin:0;
            font-size:13px;
            line-height:1.25;
        }

        .datum { color:#53667f; font-weight:700; }
        .akce { font-weight:900; }
        .akce.pridano { color:var(--green); }
        .akce.odebrano { color:var(--red); }

        .material-cell { color:var(--text); font-weight:700; }
        .material-id { color:#334760; font-weight:800; font-size:13px; }
        .stitky-bunka{display:flex;justify-content:flex-end}
        .tisk-stitku{border:1px solid #1688f5;background:#edf6ff;color:#0877e8;border-radius:7px;padding:8px 10px;font-weight:900;font-size:12px;cursor:pointer}
        .cislo-tavby { color:#0877e8; font-weight:800; }
        .pocet { font-weight:900; }
        .pocet.pridano { color:var(--green); }
        .pocet.odebrano { color:var(--red); }
        .osobni { color:#334760; font-weight:700; }
        .pruvodka { color:#334760; font-weight:700; }
        .cislo-objednavky { color:var(--orange); font-weight:900; }

        #seznam > p {
            margin:0;
            padding:20px;
            background:#fff;
        }

        @media (max-width: 900px) {
            body { padding:12px 10px 28px; }

            .hlavicka {
                min-height:58px;
                margin-bottom:12px;
            }

            .hlavicka h1 { font-size:24px; }

            .zpet {
                min-width:82px;
                height:40px;
                padding:0 12px;
                font-size:13px;
            }

            .filtry {
                grid-template-columns:1fr;
                gap:8px;
                margin-bottom:12px;
            }

            .filtry input { height:44px; }

            #seznam {
                background:transparent;
                border:0;
                box-shadow:none;
                overflow:visible;
            }

            #seznam::before { display:none; }
            .tabulka-hlavicka { display:none; }

            .zaznam {
                grid-template-columns:1fr auto;
                gap:7px 12px;
                min-height:0;
                padding:14px 14px;
                margin-bottom:8px;
                border:1px solid var(--line);
                border-left-width:5px;
                border-radius:9px;
                box-shadow:0 3px 10px rgba(20,45,75,.04);
            }

            .stitky-bunka{grid-column:1 / -1;justify-content:flex-start}
            .datum { grid-column:1; grid-row:1; }
            .akce { grid-column:2; grid-row:1; text-align:right; }
            .material-cell { grid-column:1 / -1; grid-row:2; }
            .tavba-cell { grid-column:1; grid-row:3; }
            .pocet { grid-column:2; grid-row:3; text-align:right; }
            .osobni { grid-column:1; grid-row:4; }
            .pruvodka { grid-column:2; grid-row:4; text-align:right; }
            .material-id { grid-column:1 / -1; grid-row:5; }
        }

    </style>
</head>

<body>

    <div class="hlavicka">

        <h1>Historie skladu</h1>

        <div class="tlacitka-hlavicky">
            <a class="zpet" id="podrobnejsi" href="historiepodrobnější.html">PODROBNĚJŠÍ</a>
            <a class="zpet" href="material.html">
                ← ZPĚT
            </a>
        </div>

    </div>


    <div class="obsah">

        <div class="tabulka-hlavicka">
            <div>DATUM</div>
            <div>OPERACE</div>
            <div>MATERIÁL</div>
            <div>TAVBA</div>
            <div>POČET</div>
            <div>OS. Č.</div>
            <div>PRŮVODKA</div>
            <div>ID MATERIÁLU</div>
            <div>ŠTÍTEK</div>
        </div>

        <div id="seznam">
            Načítám historii...
        </div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let historieData = [];


        /*
            KONTROLA PŘIHLÁŠENÍ
        */

        function otevriDatabaziProhlizece() {
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open("kovohladil-prohlizec", 1);
                        request.onupgradeneeded = () => {
                            const db = request.result;
                            if (!db.objectStoreNames.contains("klice")) {
                                db.createObjectStore("klice");
                            }
                        };
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                }
        
                async function nactiExistujiciKlic() {
                    if (!window.isSecureContext || !crypto.subtle || !window.indexedDB) {
                        throw new Error("Prohlížeč nepodporuje bezpečné ověření.");
                    }
                    const db = await otevriDatabaziProhlizece();
                    try {
                        const par = await new Promise((resolve, reject) => {
                            const tx = db.transaction("klice", "readonly");
                            const request = tx.objectStore("klice").get("identita");
                            request.onsuccess = () => resolve(request.result || null);
                            request.onerror = () => reject(request.error);
                        });
                        if (!par?.privateKey || !par?.publicKey) {
                            throw new Error("V tomto prohlížeči není uložen schválený klíč.");
                        }
                        const jwk = await crypto.subtle.exportKey("jwk", par.publicKey);
                        return {
                            par,
                            verejnyKlic: { kty: "EC", crv: "P-256", x: jwk.x, y: jwk.y }
                        };
                    } finally {
                        db.close();
                    }
                }
        
                function kodujBase64url(buffer) {
                    let text = "";
                    for (const byte of new Uint8Array(buffer)) text += String.fromCharCode(byte);
                    return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
                }
        
                async function zavolejSchvalovani(body) {
                    const { data, error } = await supabaseClient.functions.invoke(
                        "schvalovani-prohlizecu", { body }
                    );
                    if (error) throw error;
                    if (data?.chyba) throw new Error(data.chyba);
                    return data;
                }
        
                async function overSchvalenyProhlizec() {
                    const { par, verejnyKlic } = await nactiExistujiciKlic();
                    const vyzva = await zavolejSchvalovani({
                        akce: "vyzva",
                        verejny_klic: verejnyKlic
                    });
                    if (typeof vyzva?.vyzva !== "string" || !vyzva?.vyzva_id) {
                        throw new Error("Server nevrátil platnou výzvu.");
                    }
                    const podpis = await crypto.subtle.sign(
                        { name: "ECDSA", hash: "SHA-256" },
                        par.privateKey,
                        new TextEncoder().encode(vyzva.vyzva)
                    );
                    const vysledek = await zavolejSchvalovani({
                        akce: "overit",
                        verejny_klic: verejnyKlic,
                        vyzva_id: vyzva.vyzva_id,
                        podpis: kodujBase64url(podpis)
                    });
                    if (vysledek?.overeno !== true) {
                        throw new Error("Prohlížeč není schválený.");
                    }
                }


        async function zkontrolujPrihlaseni() {

            const { data, error } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "../login.html"
                );

                return;
            }


            try {
                await overSchvalenyProhlizec();
            } catch (chyba) {
                console.error("Ověření prohlížeče:", chyba);
                window.location.replace("../login.html");
                return;
            }

            document.body.style.display =
                "block";


            nactiHistorii();
            zobrazTlacitkoVedeni(data.session.user.id);
        }


        async function zobrazTlacitkoVedeni(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from("uzivatele")
                    .select("role")
                    .eq("user_id", userId)
                    .maybeSingle();
                if (!error && data?.role === "vedeni") {
                    document.getElementById("podrobnejsi").style.display = "inline-flex";
                }
            } catch (e) {
                console.warn("Nepodařilo se ověřit roli pro tlačítko.", e);
            }
        }

        // Podepsané čtení historie přes sklad-bezpecny (verze 4).
        async function nactiHistoriiBezpecne() {
            const { data: { session }, error: chybaSession } =
                await supabaseClient.auth.getSession();
            if (chybaSession || !session) throw new Error("Nejdřív se přihlas.");

            const { par, verejnyKlic } = await nactiExistujiciKlic();
            const headers = {
                Authorization: `Bearer ${session.access_token}`,
                apikey: SUPABASE_KEY,
                "Content-Type": "application/json"
            };
            const base = `${SUPABASE_URL}/functions/v1/`;
            const vyzvaResponse = await fetch(base + "schvalovani-prohlizecu", {
                method: "POST", headers,
                body: JSON.stringify({ akce: "vyzva", verejny_klic: verejnyKlic })
            });
            const vyzva = await vyzvaResponse.json();
            if (!vyzvaResponse.ok || !vyzva.vyzva || !vyzva.vyzva_id) {
                throw new Error(vyzva.chyba || "Nepodařilo se získat bezpečnostní výzvu.");
            }

            const prikaz = {
                akce: "cteni-historie",
                metoda: "POST",
                cesta: "/functions/v1/sklad-bezpecny",
                parametry: null
            };
            const digest = await crypto.subtle.digest(
                "SHA-256", new TextEncoder().encode(JSON.stringify(prikaz))
            );
            const otisk = [...new Uint8Array(digest)]
                .map(b => b.toString(16).padStart(2, "0")).join("");
            const zprava = `${vyzva.vyzva}:sklad-bezpecny:v2:${otisk}`;
            const podpis = await crypto.subtle.sign(
                { name: "ECDSA", hash: "SHA-256" }, par.privateKey,
                new TextEncoder().encode(zprava)
            );
            const response = await fetch(base + "sklad-bezpecny", {
                method: "POST", headers,
                body: JSON.stringify({
                    ...prikaz,
                    verejny_klic: verejnyKlic,
                    vyzva_id: vyzva.vyzva_id,
                    podpis: kodujBase64url(podpis)
                })
            });
            const vysledek = await response.json();
            if (!response.ok || vysledek.overeno !== true || !Array.isArray(vysledek.data)) {
                throw new Error(vysledek.chyba || vysledek.detail || "Načtení historie selhalo.");
            }
            return vysledek.data;
        }

        /*
            NAČTENÍ HISTORIE
        */

        async function nactiHistorii() {

            const seznam =
                document.getElementById("seznam");


            let data;
            let error = null;
            try {
                data = await nactiHistoriiBezpecne();
            } catch (chyba) {
                error = chyba;
            }


            if (error) {

                seznam.innerHTML =
                    "<p>Chyba při načítání historie:<br>" +
                    error.message +
                    "</p>";

                return;
            }


            historieData = data || [];


            zobrazHistorii();
        }


        /*
            ZOBRAZENÍ HISTORIE
        */

        function escapeHtml(hodnota) {
            return String(hodnota ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        function zobrazHistorii() {

            const seznam =
                document.getElementById("seznam");

            let filtrovanaData = historieData;

            /*
                Nová historie pracuje pouze s přesným počtem kusů.
                Staré technické záznamy ZPŘESNĚNO zaměstnanci
                ve skladu nepotřebují, proto je nezobrazujeme.
            */
            filtrovanaData =
                filtrovanaData.filter(zaznam =>
                    zaznam.akce === "PŘIDÁNO" ||
                    zaznam.akce === "ODEBRÁNO"
                );

            if (filtrovanaData.length === 0) {
                seznam.innerHTML =
                    "<p>Žádné záznamy nebyly nalezeny.</p>";
                return;
            }

            seznam.innerHTML = "";

            filtrovanaData.forEach(zaznam => {

                const jePrijem =
                    zaznam.akce === "PŘIDÁNO";

                const trida =
                    jePrijem ? "pridano" : "odebrano";

                const pocet =
                    Number(zaznam.pocet || 0);

                const pocetHTML =
                    (jePrijem ? "+" : "-") +
                    pocet +
                    " ks";

                let pruvodkaHTML = "";

                if (
                    zaznam.pruvodka &&
                    String(zaznam.pruvodka).trim() !== ""
                ) {
                    pruvodkaHTML = `
                        <div class="pruvodka">
                            <span class="cislo-objednavky">
                                ${escapeHtml(zaznam.pruvodka)}
                            </span>
                        </div>
                    `;
                }

                const osobniCislo =
                    zaznam.osobni_cislo != null &&
                    String(zaznam.osobni_cislo).trim() !== ""
                        ? ` | Os. č. ${escapeHtml(zaznam.osobni_cislo)}`
                        : "";

                seznam.innerHTML += `
                    <div class="zaznam ${trida}">
                        <div class="datum">
                            ${escapeHtml(formatDatum(zaznam.datum))}
                        </div>

                        <div class="akce ${trida}">
                            ${escapeHtml(zaznam.akce)}
                        </div>

                                                <div class="material-cell">
                            ${escapeHtml(zaznam.material)} |
                            ${escapeHtml(zaznam.druh)} |
                            ${escapeHtml(zaznam.rozmer)}
                        </div>

                        <div class="tavba-cell">
                            <span class="cislo-tavby">
                                ${escapeHtml(zaznam.tavba)}
                            </span>
                        </div>

                        <div class="pocet ${trida}">
                            ${pocetHTML}
                        </div>

                        <div class="osobni">
                            ${osobniCislo ? osobniCislo.replace(" | Os. č. ", "") : ""}
                        </div>

                        ${pruvodkaHTML || '<div class="pruvodka"></div>'}

                        <div class="material-id">${zaznam.id == null ? "—" : escapeHtml(zaznam.id)}</div>
                        <div class="stitky-bunka">${jePrijem && Number.isSafeInteger(Number(zaznam.id)) && Number(zaznam.id)>0 ? `<button type="button" class="tisk-stitku" data-id="${escapeHtml(zaznam.id)}">ŠTÍTEK</button>` : ""}</div>
                    </div>
                `;
            });
        }


        /*
            FORMÁT DATA
        */

        document.getElementById("seznam").addEventListener("click",event=>{
            const tlacitko=event.target.closest(".tisk-stitku");
            if(!tlacitko)return;
            const id=Number(tlacitko.dataset.id);
            const prijem=historieData.find(z=>z.akce==="PŘIDÁNO" && Number(z.id)===id);
            if(!prijem)return;
            const okno=window.open("","_blank");
            if(!okno){alert("Povol otevírání nových oken pro tisk štítku.");return;}
            const odkaz=new URL("odebrat.html",location.href);
            odkaz.searchParams.set("id",String(id));
            const kod=escapeHtml(prijem.smkh||"NEPŘIŘAZENO");
            const tavba=escapeHtml(prijem.tavba||"NEUVEDENO");
            okno.document.open();
            okno.document.write(`<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Štítek ${id}</title>
<style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;background:#eaf0f6;font-family:Arial;color:#071a38}.ovladani{text-align:center;padding:15px}.ovladani button{padding:12px 24px;background:#1688f5;color:white;border:0;border-radius:8px;font-weight:900;cursor:pointer}.list{width:210mm;height:297mm;margin:auto;padding:13mm;background:#fff;display:flex;flex-direction:column;border:2px solid #14253b}.horni{display:flex;justify-content:space-between;align-items:center;gap:12mm;border-bottom:3px solid #14253b;padding-bottom:12mm}.logo{font-size:26pt;font-weight:900;letter-spacing:-1px}.logo span{color:#777}.logo small{display:block;font-size:8pt;letter-spacing:1px;margin-top:3mm}.id{border:2px solid #14253b;border-radius:8px;text-align:center;padding:5mm 8mm;font-size:15pt;font-weight:900}.id strong{display:block;font-size:42pt}.smkv{text-align:center;padding:16mm 0;border-bottom:3px solid #14253b}.smkv b{display:block;font-size:32pt}.smkv strong{display:block;font-size:64pt;overflow-wrap:anywhere}.tavba{margin-top:16mm;border:2px solid #14253b;border-radius:10px;text-align:center}.tavba b{display:block;background:#eaf0f6;font-size:30pt;padding:5mm}.tavba strong{display:block;font-size:54pt;padding:8mm;overflow-wrap:anywhere}.qr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7mm}.qr small{font-weight:900;font-size:15pt}#qrcode img,#qrcode canvas{width:75mm!important;height:75mm!important}@media print{body{background:white}.ovladani{display:none}.list{border:0}}</style></head>
<body><div class="ovladani"><button onclick="window.print()">VYTISKNOUT ŠTÍTEK A4</button></div><main class="list"><header class="horni"><div class="logo"><img src="${new URL("logo.png",location.href).href}" alt="KovoHladil" style="display:block;width:100%;max-width:100mm;max-height:34mm;object-fit:contain;object-position:left center"></div><div class="id">ID MATERIÁLU<strong>${id}</strong></div></header><section class="smkv"><b>SMKV</b><strong>${kod}</strong></section><section class="tavba"><b>TAVBA</b><strong>${tavba}</strong></section><section class="qr"><div id="qrcode"></div><small>NAČÍST MATERIÁL</small></section></main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script><script>window.addEventListener("load",function(){if(window.QRCode)new QRCode(document.getElementById("qrcode"),{text:${JSON.stringify(odkaz.href)},width:360,height:360,correctLevel:QRCode.CorrectLevel.M});else document.getElementById("qrcode").textContent="QR kód se nepodařilo načíst."});<\/script></body></html>`);
            okno.document.close();
        });

        function formatDatum(datum) {

            if (!datum) {
                return "";
            }

            const textDatum =
                String(datum).trim();

            /*
                Supabase může vrátit:
                2026-09-20
                2026-09-20T12:34:56...
                případně jiný řetězec data.

                Nejdřív bezpečně přečteme YYYY-MM-DD.
                Tím nevznikne NaN ani v případě času za datem.
            */
            const shoda =
                textDatum.match(/^(\d{4})-(\d{2})-(\d{2})/);

            if (shoda) {

                const rok = Number(shoda[1]);
                const mesic = Number(shoda[2]);
                const den = Number(shoda[3]);

                if (
                    Number.isInteger(rok) &&
                    Number.isInteger(mesic) &&
                    Number.isInteger(den) &&
                    mesic >= 1 &&
                    mesic <= 12 &&
                    den >= 1 &&
                    den <= 31
                ) {
                    return den + ". " + mesic + ". " + rok;
                }
            }

            /*
                Záložní varianta pro jiné validní datumové formáty.
            */
            const parsed =
                new Date(textDatum);

            if (!Number.isNaN(parsed.getTime())) {

                return (
                    parsed.getDate() +
                    ". " +
                    (parsed.getMonth() + 1) +
                    ". " +
                    parsed.getFullYear()
                );
            }

            /*
                Když datum nejde bezpečně rozpoznat,
                zobrazíme původní hodnotu místo "NaN".
            */
            return textDatum;
        }


        /*
            SPUŠTĚNÍ STRÁNKY
        */

        zkontrolujPrihlaseni();

    </script>
