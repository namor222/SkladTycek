<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historie skladu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px 15px 30px 15px;
            text-align: center;

            /* STRÁNKA SE UKÁŽE AŽ PO OVĚŘENÍ LOGINU */
            display: none;
        }

        .hlavicka {
            max-width: 800px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .hlavicka h1 {
            margin: 0;
            font-size: 28px;
            text-align: left;
        }

        .zpet {
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: #1976d2;
            white-space: nowrap;
        }

        .zpet:hover {
            text-decoration: underline;
        }

        .filtry {
            max-width: 800px;
            margin: 0 auto 20px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .filtry input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            font-size: 17px;
            border: 1px solid #aaa;
            border-radius: 10px;
            background: white;
        }

        .obsah {
            max-width: 800px;
            margin: auto;
        }

        .zaznam {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            text-align: left;
            border-left: 8px solid #999;
        }

        .zaznam.pridano {
            border-left-color: #28a745;
        }

        .zaznam.odebrano {
            border-left-color: #dc3545;
        }

        .akce {
            font-weight: bold;
            font-size: 18px;
            margin-top: 5px;
        }

        .akce.pridano {
            color: #28a745;
        }

        .akce.odebrano {
            color: #dc3545;
        }

        .datum {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .detail {
            margin-top: 8px;
            line-height: 1.5;
        }

        .cislo-tavby {
            color: #1976d2;
            font-weight: bold;
        }

        .objednavka {
            margin-top: 8px;
            font-weight: bold;
            color: #000000;
        }

        .cislo-objednavky {
            color: #f57c00;
            font-weight: bold;
        }

        @media (max-width: 500px) {

            .hlavicka h1 {
                font-size: 22px;
            }

            .zpet {
                font-size: 16px;
            }

            .filtry {
                grid-template-columns: 1fr;
            }

            .filtry input {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="hlavicka">

        <h1>🕘 Historie skladu</h1>

        <a class="zpet" href="material.html">
            ← ZPĚT
        </a>

    </div>


    <div class="filtry">

        <input
            type="text"
            id="hledatTavbu"
            placeholder="🔎 Hledat tavbu..."
            oninput="zobrazHistorii()"
        >

        <input
            type="text"
            id="hledatObjednavku"
            placeholder="🔎 Hledat objednávku..."
            oninput="zobrazHistorii()"
        >

    </div>


    <div class="obsah">

        <div id="seznam">
            Načítám historii...
        </div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let historieData = [];


        /*
            KONTROLA PŘIHLÁŠENÍ
        */

        async function zkontrolujPrihlaseni() {

            const { data, error } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "../login.html"
                );

                return;
            }


            document.body.style.display =
                "block";


            nactiHistorii();
        }


        /*
            NAČTENÍ HISTORIE
        */

        async function nactiHistorii() {

            const seznam =
                document.getElementById("seznam");


            const { data, error } =
                await supabaseClient
                    .from("web_historie")
                    .select("datum, osobni_cislo, akce, material, druh, rozmer, tavba, pocet, objednavka")
                    .order("datum", { ascending: false })
                    .order("id", { ascending: false });


            if (error) {

                seznam.innerHTML =
                    "<p>Chyba při načítání historie:<br>" +
                    error.message +
                    "</p>";

                return;
            }


            historieData = data || [];


            zobrazHistorii();
        }


        /*
            ZOBRAZENÍ HISTORIE
        */

        function escapeHtml(hodnota) {
            return String(hodnota ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        function zobrazHistorii() {

            const seznam =
                document.getElementById("seznam");

            const hledanaTavba =
                document
                    .getElementById("hledatTavbu")
                    .value
                    .trim()
                    .toLowerCase();

            const hledanaObjednavka =
                document
                    .getElementById("hledatObjednavku")
                    .value
                    .trim()
                    .toLowerCase();

            let filtrovanaData = historieData;

            if (hledanaTavba !== "") {
                filtrovanaData =
                    filtrovanaData.filter(zaznam =>
                        String(zaznam.tavba || "")
                            .toLowerCase()
                            .includes(hledanaTavba)
                    );
            }

            if (hledanaObjednavka !== "") {
                filtrovanaData =
                    filtrovanaData.filter(zaznam =>
                        String(zaznam.objednavka || "")
                            .toLowerCase()
                            .includes(hledanaObjednavka)
                    );
            }

            /*
                Nová historie pracuje pouze s přesným počtem kusů.
                Staré technické záznamy ZPŘESNĚNO zaměstnanci
                ve skladu nepotřebují, proto je nezobrazujeme.
            */
            filtrovanaData =
                filtrovanaData.filter(zaznam =>
                    zaznam.akce === "PŘIDÁNO" ||
                    zaznam.akce === "ODEBRÁNO"
                );

            if (filtrovanaData.length === 0) {
                seznam.innerHTML =
                    "<p>Žádné záznamy nebyly nalezeny.</p>";
                return;
            }

            seznam.innerHTML = "";

            filtrovanaData.forEach(zaznam => {

                const jePrijem =
                    zaznam.akce === "PŘIDÁNO";

                const trida =
                    jePrijem ? "pridano" : "odebrano";

                const pocet =
                    Number(zaznam.pocet || 0);

                const pocetHTML =
                    (jePrijem ? "+" : "-") +
                    pocet +
                    " ks";

                let objednavkaHTML = "";

                if (
                    zaznam.objednavka &&
                    String(zaznam.objednavka).trim() !== ""
                ) {
                    objednavkaHTML = `
                        <div class="objednavka">
                            Objednávka:
                            <span class="cislo-objednavky">
                                ${escapeHtml(zaznam.objednavka)}
                            </span>
                        </div>
                    `;
                }

                const osobniCislo =
                    zaznam.osobni_cislo != null &&
                    String(zaznam.osobni_cislo).trim() !== ""
                        ? ` | Os. č. ${escapeHtml(zaznam.osobni_cislo)}`
                        : "";

                seznam.innerHTML += `
                    <div class="zaznam ${trida}">

                        <div class="datum">
                            ${escapeHtml(formatDatum(zaznam.datum))}
                            ${osobniCislo}
                        </div>

                        <div class="akce ${trida}">
                            ${escapeHtml(zaznam.akce)}
                        </div>

                        <div class="detail">
                            ${escapeHtml(zaznam.material)}
                            |
                            ${escapeHtml(zaznam.druh)}
                            |
                            ${escapeHtml(zaznam.rozmer)}

                            <br>

                            Tavba:
                            <span class="cislo-tavby">
                                ${escapeHtml(zaznam.tavba)}
                            </span>

                            |

                            <strong>
                                ${pocetHTML}
                            </strong>

                            ${objednavkaHTML}
                        </div>

                    </div>
                `;
            });
        }


        /*
            FORMÁT DATA
        */

        function formatDatum(datum) {

            if (!datum) {
                return "";
            }

            const textDatum =
                String(datum).trim();

            /*
                Supabase může vrátit:
                2026-09-20
                2026-09-20T12:34:56...
                případně jiný řetězec data.

                Nejdřív bezpečně přečteme YYYY-MM-DD.
                Tím nevznikne NaN ani v případě času za datem.
            */
            const shoda =
                textDatum.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);

            if (shoda) {

                const rok = Number(shoda[1]);
                const mesic = Number(shoda[2]);
                const den = Number(shoda[3]);

                if (
                    Number.isInteger(rok) &&
                    Number.isInteger(mesic) &&
                    Number.isInteger(den) &&
                    mesic >= 1 &&
                    mesic <= 12 &&
                    den >= 1 &&
                    den <= 31
                ) {
                    return den + ". " + mesic + ". " + rok;
                }
            }

            /*
                Záložní varianta pro jiné validní datumové formáty.
            */
            const parsed =
                new Date(textDatum);

            if (!Number.isNaN(parsed.getTime())) {

                return (
                    parsed.getDate() +
                    ". " +
                    (parsed.getMonth() + 1) +
                    ". " +
                    parsed.getFullYear()
                );
            }

            /*
                Když datum nejde bezpečně rozpoznat,
                zobrazíme původní hodnotu místo "NaN".
            */
            return textDatum;
        }


        /*
            SPUŠTĚNÍ STRÁNKY
        */

        zkontrolujPrihlaseni();

    </script>

</body>
</html>
