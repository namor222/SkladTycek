<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrace | Sklad</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{box-sizing:border-box}
        body{display:none;margin:0;min-height:100vh;background:#f2f6fb;color:#20344e;font-family:Arial,Helvetica,sans-serif}
        header{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(16px,4vw,55px);background:#fff;border-bottom:1px solid #dce4ef;gap:16px}
        h1{margin:0;font-size:27px}
        header a{display:inline-block;padding:12px 18px;border:1px solid #d6e0eb;border-radius:10px;background:white;color:#24364b;font-weight:800;text-decoration:none}
        main{max-width:1250px;margin:0 auto;padding:28px 18px 70px}
        h2{margin:0 0 15px;font-size:22px}
        h3{margin:0 0 12px;font-size:18px}
        .panel{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:22px;margin-bottom:22px;box-shadow:0 7px 24px rgba(30,55,85,.045)}
        .muted{color:#62748a;line-height:1.5}
        .reports{display:grid;gap:10px}
        .report-row{width:100%;text-align:left;border:1px solid #dce5ef;border-radius:12px;background:#f8fbff;padding:14px;cursor:pointer;color:#20344e;font:inherit}
        .report-row:hover{border-color:#578ac8}
        .report-row.active{border-color:#2366af;background:#edf5ff}
        .tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#fff0dc;color:#985c14;font-weight:800;font-size:12px}
        .tag.done{background:#e4f5ea;color:#257143}
        .details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:15px 0}
        .detail{padding:12px;background:#f5f8fc;border-radius:9px;overflow-wrap:anywhere}
        .detail small{display:block;color:#62748a;margin-bottom:5px}
        label{display:block;font-weight:750;font-size:14px;margin-bottom:6px}
        input{width:100%;padding:11px;border:1px solid #b9c9dc;border-radius:9px;font:inherit}
        input:disabled{background:#f0f2f5;color:#718095}
        .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
        button{font:inherit;cursor:pointer}
        .primary{background:#1763ac;color:#fff;border:0;border-radius:9px;padding:12px 18px;font-weight:800;margin-top:14px}
        .primary:disabled{opacity:.5;cursor:not-allowed}
        .secondary{background:#fff;color:#1763ac;border:1px solid #1763ac;border-radius:9px;padding:12px 18px;font-weight:800}
        .history-card{border-top:1px solid #e0e7ef;padding:18px 0}
        .history-card:first-child{border-top:0}
        .history-meta{margin-bottom:12px;font-weight:800}
        .feedback{margin:12px 0;white-space:pre-wrap;font-weight:750}
        .note{border-left:4px solid #d49a40;background:#fff9eb;padding:12px;margin:14px 0}
        .closed-form{opacity:.48;filter:grayscale(1);cursor:not-allowed}
        .closed-form input,.closed-form button{cursor:not-allowed!important}
        .closed-form input{background:#e8ebef!important;color:#78828e!important}
        .closed-form button{background:#a3aab4!important;color:#fff!important;opacity:1!important}
        @media(max-width:650px){.fields{grid-template-columns:1fr}header{padding:16px}.panel{padding:16px}}
    </style>
</head>
<body>
    <header><h1>Administrace</h1><a href="material.html">← ZPĚT</a></header>
    <main id="obsah"></main>
    <script>
        const SUPABASE_URL = "https://gmawlmsizglrnjmjegmx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        function otevriDatabaziProhlizece() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("kovohladil-prohlizec", 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains("klice")) {
                        db.createObjectStore("klice");
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function nactiExistujiciKlic() {
            if (!window.isSecureContext || !crypto.subtle || !window.indexedDB) {
                throw new Error("Prohlížeč nepodporuje bezpečné ověření.");
            }
            const db = await otevriDatabaziProhlizece();
            try {
                const par = await new Promise((resolve, reject) => {
                    const tx = db.transaction("klice", "readonly");
                    const request = tx.objectStore("klice").get("identita");
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                });
                if (!par?.privateKey || !par?.publicKey) {
                    throw new Error("V tomto prohlížeči není uložen schválený klíč.");
                }
                const jwk = await crypto.subtle.exportKey("jwk", par.publicKey);
                return {
                    par,
                    verejnyKlic: { kty: "EC", crv: "P-256", x: jwk.x, y: jwk.y }
                };
            } finally {
                db.close();
            }
        }

        function kodujBase64url(buffer) {
            let text = "";
            for (const byte of new Uint8Array(buffer)) text += String.fromCharCode(byte);
            return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        async function zavolejSchvalovani(body) {
            const { data, error } = await supabaseClient.functions.invoke(
                "schvalovani-prohlizecu", { body }
            );
            if (error) throw error;
            if (data?.chyba) throw new Error(data.chyba);
            return data;
        }

        async function overSchvalenyProhlizec() {
            const { par, verejnyKlic } = await nactiExistujiciKlic();
            const vyzva = await zavolejSchvalovani({
                akce: "vyzva",
                verejny_klic: verejnyKlic
            });
            if (typeof vyzva?.vyzva !== "string" || !vyzva?.vyzva_id) {
                throw new Error("Server nevrátil platnou výzvu.");
            }
            const podpis = await crypto.subtle.sign(
                { name: "ECDSA", hash: "SHA-256" },
                par.privateKey,
                new TextEncoder().encode(vyzva.vyzva)
            );
            const vysledek = await zavolejSchvalovani({
                akce: "overit",
                verejny_klic: verejnyKlic,
                vyzva_id: vyzva.vyzva_id,
                podpis: kodujBase64url(podpis)
            });
            if (vysledek?.overeno !== true) {
                throw new Error("Prohlížeč není schválený.");
            }
        }





        const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
            "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        })[c]);
        const zobraz = value => esc(value == null || value === "" ? "—" : value);
        let vybraneHlaseni = null;
        let seznamHlaseni = [];
        let detailHlaseni = null;
        const datum = value => value ? new Date(value).toLocaleString("cs-CZ") : "—";
        async function rpc(nazev, parametry) {
            const { data, error } = await supabaseClient.rpc(nazev, parametry);
            if (error) throw error;
            return data;
        }
        async function nactiHlaseni(vybratId = null) {
            const obsah = document.getElementById("obsah");
            try {
                seznamHlaseni = await rpc("admin_prehled_hlaseni", {});
                obsah.innerHTML = '<section class="panel"><h2>Hlášení chyb od pracovníků</h2><p class="muted">Vyber hlášení.</p><div id="seznam" class="reports"></div></section><div id="detail"></div>';
                vykresliSeznam();
                if (vybratId) await otevriHlaseni(vybratId);
            } catch (e) {
                obsah.textContent = "Hlášení se nepodařilo načíst: " + e.message;
            }
        }
        function vykresliSeznam() {
            const el = document.getElementById("seznam");
            if (!seznamHlaseni.length) { el.textContent = "Zatím nejsou žádná hlášení."; return; }
            el.innerHTML = seznamHlaseni.map(h => '<button type="button" class="report-row ' +
                (h.id === vybraneHlaseni ? 'active' : '') + '" data-report="' + h.id + '">' +
                '<strong>Hlášení #' + h.id + ' · ID materiálu ' + h.material_id + '</strong> ' +
                '<span class="tag ' + (h.stav === "vyreseno" ? 'done' : '') + '">' +
                (h.stav === "vyreseno" ? 'Vyřešeno' : 'Nové') + '</span><br>' +
                '<span class="muted">' + esc(datum(h.vytvoreno)) + ' · Pracovník ' + zobraz(h.osobni_cislo) + '</span><br>' +
                esc(h.poznamka) + '</button>').join("");
            el.querySelectorAll("[data-report]").forEach(b => b.addEventListener("click", () => otevriHlaseni(Number(b.dataset.report))));
        }
        async function otevriHlaseni(id) {
            vybraneHlaseni = id;
            vykresliSeznam();
            const el = document.getElementById("detail");
            el.innerHTML = '<section class="panel">Načítám příjem a historii...</section>';
            try {
                detailHlaseni = await rpc("admin_prehled_hlaseni", {p_id:id});
                if (!detailHlaseni?.prijem) throw Error("Příjem nebyl nalezen.");
                vykresliDetail();
            } catch(e) { el.textContent = "Chyba načítání: " + e.message; }
        }
        function input(name,label,value,type="text",disabled=false) {
            return '<div><label for="' + name + '">' + esc(label) + '</label><input id="' + name +
                '" type="' + type + '" ' + (type === 'number' ? 'min="1" step="1" ' : 'maxlength="150" ') +
                'value="' + esc(value ?? "") + '" ' + (disabled ? 'disabled ' : '') + '></div>';
        }
        function vykresliDetail() {
            const {hlaseni:h,prijem:p,historie:hist} = detailHlaseni;
            const hotovo = h.stav === "vyreseno";
            const el = document.getElementById("detail");
            el.innerHTML = '<section class="panel"><h2>Hlášení #' + h.id + ' · Materiál ID ' + p.id + '</h2>' +
                '<p><strong>Popis chyby:</strong> ' + esc(h.poznamka) + '</p>' +
                '<div class="details">' +
                '<div class="detail"><small>Materiál</small>' + zobraz(p.material) + ' · ' + zobraz(p.jakost) + '</div>' +
                '<div class="detail"><small>Druh / rozměr</small>' + zobraz(p.druh) + ' / ' + zobraz(p.rozmer) + '</div>' +
                '<div class="detail"><small>Počet zbývá</small>' + zobraz(p.pocet_zbyva) + '</div>' +
                '<div class="detail"><small>Stav hlášení</small>' + esc(h.stav) + '</div></div>' +
                (hotovo ? '<p class="note">Hlášení je uzavřené. Úpravy jsou zablokované.</p>' : '') +
                '<h3>Oprava příjmu materiálu</h3>' +
                '' +
                '<form id="prijemForm" class="' + (hotovo ? 'closed-form' : '') + '"><fieldset ' + (hotovo ? 'disabled' : '') + ' style="border:0;padding:0;margin:0;min-width:0"><div class="fields">' +
                input('pt','TAVBA',p.tavba) + input('pp','POČET PŘIJATO',p.pocet_prijato,'number') +
                input('pz','POČET ZBÝVÁ',p.pocet_zbyva,'number') +
                '</div><button class="primary" type="submit" ' + (hotovo ? 'disabled' : '') + '>ULOŽIT OPRAVU PŘÍJMU</button>' +
                '<div class="feedback" id="prijemZprava" role="status"></div></fieldset></form></section>' +
                '<section class="panel"><h2>Historie tohoto materiálu (' + hist.length + ' záznamů)</h2>' +
                '' +
                hist.map(z => '<div class="history-card"><div class="history-meta">Záznam #' + z.id + ' · ' + zobraz(z.akce) + ' · ' + esc(datum(z.datum)) + '</div>' +
                '<form class="historieForm ' + (hotovo ? 'closed-form' : '') + '" data-id="' + z.id + '"><fieldset ' + (hotovo ? 'disabled' : '') + ' style="border:0;padding:0;margin:0;min-width:0"><div class="fields">' +
                input('ht'+z.id,'TAVBA',z.tavba) +
                input('hp'+z.id,'POČET',z.pocet,'number',z.akce !== 'ODEBRÁNO') +
                input('hr'+z.id,'PRŮVODKA',z.pruvodka) +
                '</div><button class="primary" type="submit" ' + (hotovo ? 'disabled' : '') + '>ULOŽIT OPRAVU ZÁZNAMU #' + z.id + '</button>' +
                '<div class="feedback" id="hz'+z.id+'" role="status"></div></fieldset></form></div>').join('') +
                '</section><section class="panel"><h2>Dokončení hlášení</h2><p class="muted">Po dokončení všech oprav označ hlášení jako vyřešené.</p>' +
                '<button class="secondary ' + (hotovo ? 'closed-form' : '') + '" id="uzavrit" ' + (hotovo ? 'disabled' : '') + '>OZNAČIT JAKO VYŘEŠENÉ</button>' +
                '<p class="muted">Počet zaznamenaných oprav: ' + (h.opravy?.length || 0) + '</p></section>';
            document.getElementById("prijemForm").addEventListener("submit", ulozPrijem);
            el.querySelectorAll(".historieForm").forEach(f => f.addEventListener("submit", ulozHistorii));
            document.getElementById("uzavrit").addEventListener("click", uzavriHlaseni);
        }
        function zmenaText(id, puvodni) {
            const nova = document.getElementById(id).value.trim();
            return nova !== String(puvodni ?? "") ? nova : null;
        }
        function zmenaPocet(id, puvodni) {
            const nova = Number(document.getElementById(id).value);
            if (!Number.isSafeInteger(nova) || nova < 1) throw Error("Počet musí být kladné celé číslo.");
            return nova !== Number(puvodni) ? nova : null;
        }
        function zmenaZbyva(id, puvodni) {
            const nova = Number(document.getElementById(id).value);
            if (!Number.isSafeInteger(nova) || nova < 0) throw Error("Počet zbývá musí být nezáporné celé číslo.");
            return nova !== Number(puvodni) ? nova : null;
        }
        async function ulozPrijem(event) {
            event.preventDefault();
            const p = detailHlaseni.prijem, h = detailHlaseni.hlaseni;
            const btn = event.currentTarget.querySelector("button");
            const msg = document.getElementById("prijemZprava");
            try {
                const t=zmenaText("pt",p.tavba), poc=zmenaPocet("pp",p.pocet_prijato), zbyva=zmenaZbyva("pz",p.pocet_zbyva);
                if ([t,poc,zbyva].every(v => v===null)) throw Error("Žádná hodnota nebyla změněna.");
                if (t!==null && !t) throw Error("Nová hodnota nesmí být prázdná.");
                if (!confirm("Opravdu uložit změny příjmu materiálu ID " + p.id + "?")) return;
                btn.disabled=true;msg.textContent="Ukládám...";
                await rpc("admin_opravit_prijem_v2",{p_hlaseni_id:h.id,p_tavba:t,p_pocet:poc,p_zbyva:zbyva});
                await nactiHlaseni(h.id);
            } catch(e) { msg.textContent="Oprava selhala: "+e.message; } finally { btn.disabled=false; }
        }
        async function ulozHistorii(event) {
            event.preventDefault();
            const form=event.currentTarget, id=Number(form.dataset.id), z=detailHlaseni.historie.find(x=>x.id===id), h=detailHlaseni.hlaseni;
            const btn=form.querySelector("button"), msg=document.getElementById("hz"+id);
            try {
                const t=zmenaText("ht"+id,z.tavba),poc=z.akce==='ODEBRÁNO'?zmenaPocet("hp"+id,z.pocet):null,pr=zmenaText("hr"+id,z.pruvodka);
                if ([t,poc,pr].every(v=>v===null)) throw Error("Žádná hodnota nebyla změněna.");
                if ((t!==null&&!t)||(pr!==null&&!pr)) throw Error("Nová hodnota nesmí být prázdná.");
                if (!confirm("Opravdu změnit záznam historie #"+id+"?")) return;
                btn.disabled=true;msg.textContent="Ukládám...";
                await rpc("admin_opravit_historii",{p_hlaseni_id:h.id,p_historie_id:id,p_tavba:t,p_pocet:poc,p_pruvodka:pr});
                await nactiHlaseni(h.id);
            } catch(e) { msg.textContent="Oprava selhala: "+e.message; } finally {btn.disabled=false;}
        }
        async function uzavriHlaseni() {
            if (!confirm("Označit hlášení jako vyřešené? Další úpravy v něm už nepůjdou.")) return;
            const btn=document.getElementById("uzavrit");btn.disabled=true;
            try {await rpc("admin_uzavrit_hlaseni",{p_hlaseni_id:detailHlaseni.hlaseni.id});await nactiHlaseni(detailHlaseni.hlaseni.id);}
            catch(e){alert("Uzavření selhalo: "+e.message);btn.disabled=false;}
        }

        async function spustit() {
            try {
                const { data: prihlaseni, error: chybaPrihlaseni } = await supabaseClient.auth.getSession();
                if (chybaPrihlaseni || !prihlaseni.session) {
                    window.location.replace("../login.html");
                    return;
                }
                // Ověřit platnost tokenu přímo u Supabase Auth, nestačí lokální session.
                const { data: overeny, error: chybaOvereni } = await supabaseClient.auth.getUser();
                if (chybaOvereni || !overeny?.user || overeny.user.id !== prihlaseni.session.user.id) {
                    window.location.replace("../login.html");
                    return;
                }
                await overSchvalenyProhlizec();
                const { data: uzivatel, error: chybaRole } = await supabaseClient.from("uzivatele")
                    .select("role").eq("user_id", prihlaseni.session.user.id).maybeSingle();
                if (chybaRole || uzivatel?.role !== "vedeni") {
                    window.location.replace("material.html");
                    return;
                }
                document.body.style.display = "block";
                await nactiHlaseni();
                document.body.style.display = "block";
            } catch (chyba) {
                console.warn("Přístup do administrace zamítnut:", chyba);
                window.location.replace("../login.html");
            }
        }
        spustit();
    </script>
</body>
</html>
