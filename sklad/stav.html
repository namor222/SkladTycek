<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stav skladu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --modra: #22aaff;
            --modra-svetla: #75d0ff;

            --oranzova: #ff7a00;
            --oranzova-svetla: #ffb05c;

            --zelena: #39e56f;
            --cervena: #ff4d4d;
            --zluta: #ffae22;

            --text: #ffffff;
            --text-slaby: rgba(255, 255, 255, 0.72);

            --panel: rgba(5, 15, 24, 0.72);
            --panel-svetly: rgba(255, 255, 255, 0.08);
        }

        html {
            min-height: 100%;
            background: #06101a;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            margin: 0;
            padding: 0;

            min-height: 100vh;

            color: var(--text);

            display: none;

            background:
                linear-gradient(
                    rgba(2, 10, 17, 0.63),
                    rgba(2, 10, 17, 0.78)
                ),
                url("stavpc.png") center center / cover fixed no-repeat;

            overflow-x: hidden;
        }


        /* ==========================================================
           TMAVÁ VRSTVA PRO LEPŠÍ ČITELNOST
        ========================================================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: 0;

            background:
                radial-gradient(
                    circle at 15% 30%,
                    rgba(0, 157, 255, 0.14),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 88% 30%,
                    rgba(255, 105, 0, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 119, 255, 0.04),
                    transparent 45%,
                    rgba(255, 102, 0, 0.04)
                );
        }

        body > * {
            position: relative;
            z-index: 1;
        }


        /* ==========================================================
           HLAVNÍ OBAL
        ========================================================== */

        .obal {
            width: min(1180px, calc(100% - 40px));

            margin: 0 auto;

            padding:
                24px 0
                55px;
        }


        /* ==========================================================
           HLAVIČKA
        ========================================================== */

        .hlavicka {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 18px;
        }


        .logo-nadpis {
            display: flex;
            align-items: center;

            gap: 17px;

            min-width: 0;
        }


        /* malé KH logo vytvořené přímo v kódu */

        .kh-logo {
            display: flex;
            align-items: center;

            height: 52px;

            padding-right: 18px;

            border-right:
                2px solid rgba(255, 255, 255, 0.55);

            font-size: 34px;
            line-height: 1;

            font-weight: 900;
            font-style: italic;

            letter-spacing: -5px;

            color: #e8eef2;

            text-shadow:
                0 2px 2px rgba(0, 0, 0, 0.8),
                0 0 12px rgba(255, 255, 255, 0.22);
        }


        .hlavicka h1 {
            margin: 0;

            font-size: clamp(27px, 3vw, 39px);
            line-height: 1;

            font-weight: 900;

            white-space: nowrap;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.85),
                0 0 15px rgba(0, 0, 0, 0.55);
        }


        /* ==========================================================
           ZPĚT
        ========================================================== */

        .zpet {
            flex-shrink: 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 52px;
            padding: 0 24px;

            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 12px;

            text-decoration: none;

            font-size: 17px;
            font-weight: 900;

            color: #ffffff;

            background: rgba(255, 255, 255, 0.10);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 7px 20px rgba(0, 0, 0, 0.28);

            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(13px);

            transition:
                transform 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }


        .zpet:hover {
            transform: translateY(-2px);

            color: #ffffff;
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.90);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 10px 25px rgba(0, 0, 0, 0.35);
        }


        /* ==========================================================
           HLEDÁNÍ
        ========================================================== */

        .hledani {
            width: 100%;

            margin-bottom: 30px;
        }


        .hledani input {
            width: 100%;
            height: 58px;

            padding: 0 22px;

            border:
                1px solid rgba(255, 255, 255, 0.55);

            border-radius: 13px;

            outline: none;

            font-family: inherit;
            font-size: 17px;
            font-weight: 700;

            color: white;

            background:
                linear-gradient(
                    90deg,
                    rgba(10, 104, 160, 0.44),
                    rgba(12, 23, 32, 0.74) 50%,
                    rgba(111, 54, 19, 0.48)
                );

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.13),
                0 7px 24px rgba(0, 0, 0, 0.28),
                -3px 0 12px rgba(0, 157, 255, 0.10),
                3px 0 12px rgba(255, 112, 0, 0.10);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .hledani input::placeholder {
            color: rgba(255, 255, 255, 0.73);
        }


        .hledani input:focus {
            border-color: rgba(102, 207, 255, 0.95);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 0 0 3px rgba(0, 166, 255, 0.13),
                -5px 0 18px rgba(0, 157, 255, 0.15),
                5px 0 18px rgba(255, 112, 0, 0.12),
                0 8px 25px rgba(0, 0, 0, 0.35);
        }


        /* ==========================================================
           SEKCE MATERIÁLU
        ========================================================== */

        .sekce-materialu {
            width: 100%;

            margin:
                31px 0
                43px;
        }


        .nazev-materialu {
            position: relative;

            display: flex;
            align-items: center;

            gap: 14px;

            margin-bottom: 13px;

            padding:
                0 0
                10px 27px;

            border-bottom:
                2px solid rgba(255, 255, 255, 0.62);

            font-size: 29px;
            line-height: 1;

            font-weight: 900;

            text-align: left;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.9);
        }


        .nazev-materialu::before {
            content: "";

            position: absolute;

            left: 0;
            top: -4px;

            width: 9px;
            height: 34px;

            border-radius: 8px;

            background:
                linear-gradient(
                    180deg,
                    #53c9ff,
                    #0099ff
                );

            box-shadow:
                0 0 13px rgba(0, 166, 255, 0.72);
        }


        /* NEREZ + MOSAZ dostanou oranžový akcent */

        .sekce-materialu:nth-of-type(even)
        .nazev-materialu::before {
            background:
                linear-gradient(
                    180deg,
                    #ffad42,
                    #ff7200
                );

            box-shadow:
                0 0 13px rgba(255, 112, 0, 0.72);
        }


        /* ==========================================================
           KARTA MATERIÁLU
        ========================================================== */

        details.polozka {
            width: 100%;

            margin: 0 0 3px;

            border:
                1px solid rgba(255, 255, 255, 0.55);

            border-radius: 13px;

            overflow: hidden;

            background:
                linear-gradient(
                    105deg,
                    rgba(8, 100, 158, 0.50),
                    rgba(8, 20, 30, 0.80) 48%,
                    rgba(115, 56, 20, 0.53)
                );

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.11),
                0 5px 17px rgba(0, 0, 0, 0.30);

            backdrop-filter: blur(17px);
            -webkit-backdrop-filter: blur(17px);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }


        details.polozka:hover {
            border-color: rgba(255, 255, 255, 0.78);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                -3px 0 14px rgba(0, 157, 255, 0.14),
                3px 0 14px rgba(255, 112, 0, 0.14),
                0 7px 20px rgba(0, 0, 0, 0.36);
        }


        details.polozka > summary {
            position: relative;

            list-style: none;

            cursor: pointer;

            padding:
                13px 58px
                13px 20px;

            user-select: none;
        }


        details.polozka > summary::-webkit-details-marker {
            display: none;
        }


        /* vlastní šipka */

        details.polozka > summary::after {
            content: "›";

            position: absolute;

            right: 20px;
            top: 50%;

            transform:
                translateY(-50%)
                rotate(0deg);

            font-size: 36px;
            line-height: 1;

            font-weight: 300;

            color: rgba(255, 255, 255, 0.92);

            transition:
                transform 0.2s ease;
        }


        details.polozka[open] > summary::after {
            transform:
                translateY(-50%)
                rotate(90deg);
        }


        /* ==========================================================
           HLAVNÍ INFORMACE KARTY
        ========================================================== */

        .hlavni-info {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;
        }


        .info-vlevo {
            min-width: 0;

            text-align: left;
        }


        .info-vlevo h2 {
            margin: 0 0 3px;

            font-size: 21px;
            line-height: 1.05;

            font-weight: 900;

            color: white;

            text-shadow:
                0 2px 3px rgba(0, 0, 0, 0.75);
        }


        .info-vlevo h3 {
            margin: 0;

            font-size: 17px;
            line-height: 1.1;

            font-weight: 700;

            color: rgba(255, 255, 255, 0.82);
        }


        .info-vpravo {
            min-width: 115px;

            text-align: left;

            flex-shrink: 0;
        }


        .popisek-celkem {
            display: block;

            margin-bottom: 2px;

            font-size: 11px;
            line-height: 1;

            font-weight: 900;

            color: rgba(255, 255, 255, 0.65);
        }


        .hodnota-celkem {
            display: block;

            font-size: 19px;
            line-height: 1.05;

            font-weight: 900;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.75);
        }


        /* starý text "zobrazit tavby" už nepotřebujeme,
           šipka je napravo */

        .rozbalit {
            display: none;
        }


        /* ==========================================================
           ROZBALENÉ TAVBY
        ========================================================== */

        .obsah-taveb {
            margin:
                0 12px
                12px;

            padding:
                10px 19px
                12px;

            border:
                1px solid rgba(255, 255, 255, 0.13);

            border-radius: 11px;

            background:
                linear-gradient(
                    100deg,
                    rgba(0, 38, 61, 0.70),
                    rgba(7, 13, 19, 0.83) 52%,
                    rgba(73, 32, 13, 0.68)
                );

            box-shadow:
                inset 0 5px 15px rgba(0, 0, 0, 0.30);

            animation:
                otevritObsah 0.18s ease-out;
        }


        @keyframes otevritObsah {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .tavba {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding:
                9px 3px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);

            font-size: 16px;
        }


        .tavba:last-child {
            border-bottom: none;
        }


        .tavba-vlevo {
            text-align: left;

            color: rgba(255, 255, 255, 0.80);
        }


        .tavba-vpravo {
            text-align: right;

            white-space: nowrap;
        }


        .cislo-tavby {
            color: #28adff;

            font-weight: 900;

            text-shadow:
                0 0 8px rgba(0, 157, 255, 0.24);
        }


        /* ==========================================================
           BARVY POČTU
        ========================================================== */

        .pocet-malo {
            color: var(--cervena);

            font-weight: 900;
        }


        .pocet-stred {
            color: var(--zluta);

            font-weight: 900;
        }


        .pocet-ok {
            color: var(--zelena);

            font-weight: 900;
        }


        /* ==========================================================
           CELKOVÝ SOUČET
        ========================================================== */

        .celkem-vsechno {
            width: 100%;

            margin:
                38px auto
                0;

            padding:
                17px 22px;

            border:
                1px solid rgba(255, 255, 255, 0.50);

            border-radius: 13px;

            background:
                linear-gradient(
                    100deg,
                    rgba(0, 114, 183, 0.47),
                    rgba(7, 17, 25, 0.82) 50%,
                    rgba(145, 67, 16, 0.52)
                );

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 8px 24px rgba(0, 0, 0, 0.32);

            backdrop-filter: blur(17px);
            -webkit-backdrop-filter: blur(17px);

            text-align: center;

            font-size: 18px;
            font-weight: 800;
        }


        .celkem-vsechno strong {
            margin-left: 7px;

            color: #2bb4ff;

            font-size: 25px;

            font-weight: 900;

            text-shadow:
                0 0 10px rgba(0, 166, 255, 0.28);
        }


        /* ==========================================================
           CHYBA / PRÁZDNÝ SKLAD
        ========================================================== */

        .zprava {
            width: 100%;

            margin: 35px auto;

            padding: 30px;

            border:
                1px solid rgba(255, 255, 255, 0.4);

            border-radius: 14px;

            background:
                rgba(5, 15, 24, 0.80);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            font-size: 17px;
        }


        /* ==========================================================
           TABLET
        ========================================================== */

        @media (max-width: 850px) {

            .obal {
                width:
                    min(
                        100% - 26px,
                        760px
                    );

                padding-top: 15px;
            }

            .kh-logo {
                font-size: 28px;

                height: 43px;

                padding-right: 13px;
            }

            .logo-nadpis {
                gap: 12px;
            }

            .hlavicka h1 {
                font-size: 28px;
            }

            .zpet {
                min-height: 46px;

                padding:
                    0 18px;

                font-size: 15px;
            }
        }


        /* ==========================================================
           MOBIL
        ========================================================== */

        @media (max-width: 600px) {

            body {
                background:
                    linear-gradient(
                        rgba(2, 9, 15, 0.56),
                        rgba(2, 9, 15, 0.74)
                    ),
                    url("stavmobil.png")
                    center top / cover fixed no-repeat;
            }


            body::before {
                background:
                    linear-gradient(
                        90deg,
                        rgba(0, 136, 255, 0.06),
                        rgba(0, 0, 0, 0.06),
                        rgba(255, 103, 0, 0.06)
                    );
            }


            .obal {
                width: calc(100% - 18px);

                padding:
                    10px 0
                    30px;
            }


            /* HLAVIČKA */

            .hlavicka {
                gap: 8px;

                margin-bottom: 12px;
            }


            .logo-nadpis {
                gap: 9px;
            }


            .kh-logo {
                height: 37px;

                padding-right: 10px;

                font-size: 24px;

                letter-spacing: -4px;
            }


            .hlavicka h1 {
                font-size:
                    clamp(
                        20px,
                        6vw,
                        27px
                    );
            }


            .zpet {
                min-height: 42px;

                padding:
                    0 13px;

                border-radius: 10px;

                font-size: 13px;
            }


            /* HLEDÁNÍ */

            .hledani {
                margin-bottom: 21px;
            }


            .hledani input {
                height: 48px;

                padding:
                    0 14px;

                border-radius: 10px;

                font-size: 15px;

                text-align: left;
            }


            /* MATERIÁLY */

            .sekce-materialu {
                margin:
                    23px 0
                    30px;
            }


            .nazev-materialu {
                margin-bottom: 8px;

                padding:
                    0 0
                    8px 23px;

                font-size: 25px;
            }


            .nazev-materialu::before {
                width: 8px;
                height: 30px;

                top: -4px;
            }


            /* KARTY */

            details.polozka {
                margin-bottom: 2px;

                border-radius: 10px;
            }


            details.polozka > summary {
                padding:
                    10px 45px
                    10px 14px;
            }


            details.polozka > summary::after {
                right: 13px;

                font-size: 31px;
            }


            .hlavni-info {
                gap: 10px;
            }


            .info-vlevo h2 {
                margin-bottom: 2px;

                font-size: 18px;
            }


            .info-vlevo h3 {
                font-size: 14px;
            }


            .info-vpravo {
                min-width: 91px;
            }


            .popisek-celkem {
                font-size: 9px;
            }


            .hodnota-celkem {
                font-size: 17px;
            }


            /* TAVBY */

            .obsah-taveb {
                margin:
                    0 8px
                    8px;

                padding:
                    7px 12px
                    9px;

                border-radius: 9px;
            }


            .tavba {
                gap: 8px;

                padding:
                    7px 1px;

                font-size: 14px;
            }


            /* CELKEM */

            .celkem-vsechno {
                margin-top: 25px;

                padding:
                    13px 10px;

                border-radius: 10px;

                font-size: 14px;
            }


            .celkem-vsechno strong {
                margin-left: 4px;

                font-size: 21px;
            }


            .zprava {
                padding: 20px;

                font-size: 15px;
            }
        }


        /* ==========================================================
           EXTRA MALÝ MOBIL
        ========================================================== */

        @media (max-width: 390px) {

            .kh-logo {
                font-size: 21px;

                padding-right: 8px;
            }

            .hlavicka h1 {
                font-size: 19px;
            }

            .zpet {
                padding:
                    0 10px;

                font-size: 12px;
            }

            .info-vlevo h2 {
                font-size: 17px;
            }

            .info-vpravo {
                min-width: 82px;
            }
        }
    </style>
</head>


<body>

    <main class="obal">


        <!-- ======================================================
             HLAVIČKA
        ======================================================= -->

        <div class="hlavicka">

            <div class="logo-nadpis">

                <div class="kh-logo">
                    KH
                </div>

                <h1>Stav skladu</h1>

            </div>


            <a
                class="zpet"
                href="material.html"
            >
                ← ZPĚT
            </a>

        </div>


        <!-- ======================================================
             HLEDÁNÍ TAVBY
        ======================================================= -->

        <div class="hledani">

            <input
                type="text"
                id="hledatTavbu"
                placeholder="⌕  Hledat podle tavby..."
                oninput="zobrazSklad()"
                autocomplete="off"
            >

        </div>


        <!-- ======================================================
             OBSAH SKLADU
        ======================================================= -->

        <div id="seznam">
            Načítám sklad...
        </div>


    </main>


    <script>

        /* ==========================================================
           SUPABASE
        ========================================================== */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let skladData = [];


        /* ==========================================================
           POŘADÍ MATERIÁLŮ
        ========================================================== */

        const PORADI_MATERIALU = [
            "OCEL",
            "NEREZ",
            "HLINIK",
            "HLINÍK",
            "MOSAZ"
        ];


        /* ==========================================================
           KONTROLA PŘIHLÁŠENÍ
        ========================================================== */

        async function zkontrolujPrihlaseni() {

            const { data, error } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "../login.html"
                );

                return;
            }


            document.body.style.display =
                "block";


            nactiSklad();
        }


        /* ==========================================================
           NAČTENÍ SKLADU
        ========================================================== */

        async function nactiSklad() {

            const seznam =
                document.getElementById(
                    "seznam"
                );


            const { data, error } =
                await supabaseClient

                    .from(
                        "web_stav_skladu"
                    )

                    .select(
                        "material, druh, rozmer, tavba, pocet"
                    );


            if (error) {

                seznam.innerHTML = `

                    <div class="zprava">

                        Chyba při načítání skladu:

                        <br><br>

                        ${escapeHtml(error.message)}

                    </div>

                `;

                return;
            }


            skladData =
                (data || [])

                    .map(polozka => ({

                        material:
                            String(
                                polozka.material ?? ""
                            ).trim(),

                        druh:
                            String(
                                polozka.druh ?? ""
                            ).trim(),

                        rozmer:
                            polozka.rozmer,

                        tavba:
                            String(
                                polozka.tavba ?? ""
                            ).trim(),

                        pocet:
                            Number(
                                polozka.pocet || 0
                            )

                    }))

                    .filter(
                        polozka =>
                            polozka.pocet > 0
                    );


            zobrazSklad();
        }


        /* ==========================================================
           NORMALIZACE MATERIÁLU
        ========================================================== */

        function normalizujMaterial(material) {

            const hodnota =
                String(material || "")
                    .trim()
                    .toUpperCase();


            if (
                hodnota === "HLINIK" ||
                hodnota === "HLINÍK"
            ) {

                return "HLINÍK";
            }


            return hodnota;
        }


        /* ==========================================================
           POŘADÍ MATERIÁLU
        ========================================================== */

        function poradiMaterialu(material) {

            const hodnota =
                normalizujMaterial(material);


            switch (hodnota) {

                case "OCEL":
                    return 1;

                case "NEREZ":
                    return 2;

                case "HLINÍK":
                    return 3;

                case "MOSAZ":
                    return 4;

                default:
                    return 999;
            }
        }


        /* ==========================================================
           PŘEVOD ROZMĚRU NA ČÍSLO
        ========================================================== */

        function cisloRozmeru(rozmer) {

            if (
                rozmer === null ||
                rozmer === undefined ||
                rozmer === ""
            ) {

                return Number.MAX_SAFE_INTEGER;
            }


            const cislo =
                parseFloat(
                    String(rozmer)
                        .replace(",", ".")
                );


            if (
                Number.isNaN(cislo)
            ) {

                return Number.MAX_SAFE_INTEGER;
            }


            return cislo;
        }


        /* ==========================================================
           BARVA PODLE POČTU
        ========================================================== */

        function tridaPoctu(pocet) {

            const cislo =
                Number(pocet);


            if (cislo < 10) {

                return "pocet-malo";
            }


            if (cislo <= 20) {

                return "pocet-stred";
            }


            return "pocet-ok";
        }


        /* ==========================================================
           BEZPEČNÉ ZOBRAZENÍ TEXTU
        ========================================================== */

        function escapeHtml(text) {

            return String(
                text ?? ""
            )

            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }


        /* ==========================================================
           VYTVOŘENÍ SKUPIN

           materiál
              ↓
           druh + rozměr
              ↓
           tavba
              ↓
           součet kusů

           Stejná tavba se tedy spojí.
        ========================================================== */

        function vytvorSkupiny(data) {

            const skupiny = {};


            data.forEach(polozka => {

                const material =
                    normalizujMaterial(
                        polozka.material
                    ) || "NEUVEDENO";


                const druh =
                    String(
                        polozka.druh ||
                        "Neuvedeno"
                    ).trim();


                const rozmer =
                    polozka.rozmer ??
                    "Neuvedeno";


                const tavba =
                    String(
                        polozka.tavba ||
                        "Neuvedeno"
                    ).trim();


                const pocet =
                    Number(
                        polozka.pocet || 0
                    );


                const klicSkupiny =

                    material +
                    "|" +

                    druh +
                    "|" +

                    String(rozmer);


                if (
                    !skupiny[klicSkupiny]
                ) {

                    skupiny[klicSkupiny] = {

                        material,

                        druh,

                        rozmer,

                        tavby: {},

                        celkem: 0

                    };
                }


                /* STEJNÁ TAVBA SE SLOUČÍ */

                if (
                    !skupiny[klicSkupiny]
                        .tavby[tavba]
                ) {

                    skupiny[klicSkupiny]
                        .tavby[tavba] = 0;
                }


                skupiny[klicSkupiny]
                    .tavby[tavba] += pocet;


                skupiny[klicSkupiny]
                    .celkem += pocet;
            });


            return Object.values(
                skupiny
            );
        }


        /* ==========================================================
           ZOBRAZENÍ SKLADU
        ========================================================== */

        function zobrazSklad() {

            const seznam =
                document.getElementById(
                    "seznam"
                );


            const hledanaTavba =
                document

                    .getElementById(
                        "hledatTavbu"
                    )

                    .value

                    .trim()

                    .toLowerCase();


            /* ======================================================
               FILTR PODLE TAVBY
            ====================================================== */

            let filtrovanaData =
                skladData;


            if (
                hledanaTavba !== ""
            ) {

                filtrovanaData =
                    skladData.filter(

                        polozka =>

                            String(
                                polozka.tavba || ""
                            )

                            .toLowerCase()

                            .includes(
                                hledanaTavba
                            )

                    );
            }


            if (
                filtrovanaData.length === 0
            ) {

                seznam.innerHTML = `

                    <div class="zprava">

                        Žádný materiál nebyl nalezen.

                    </div>

                `;

                return;
            }


            /* ======================================================
               SESKUPENÍ
            ====================================================== */

            const skupiny =
                vytvorSkupiny(
                    filtrovanaData
                );


            /* ======================================================
               ŘAZENÍ

               1. materiál
               2. druh
               3. rozměr
            ====================================================== */

            skupiny.sort(
                (a, b) => {

                    const poradiA =
                        poradiMaterialu(
                            a.material
                        );


                    const poradiB =
                        poradiMaterialu(
                            b.material
                        );


                    if (
                        poradiA !== poradiB
                    ) {

                        return (
                            poradiA -
                            poradiB
                        );
                    }


                    if (
                        poradiA === 999 &&
                        poradiB === 999
                    ) {

                        const porovnaniMaterialu =

                            String(a.material)
                                .localeCompare(
                                    String(b.material),
                                    "cs"
                                );


                        if (
                            porovnaniMaterialu !== 0
                        ) {

                            return porovnaniMaterialu;
                        }
                    }


                    const porovnaniDruhu =

                        String(a.druh)
                            .localeCompare(
                                String(b.druh),
                                "cs"
                            );


                    if (
                        porovnaniDruhu !== 0
                    ) {

                        return porovnaniDruhu;
                    }


                    return (

                        cisloRozmeru(
                            a.rozmer
                        )

                        -

                        cisloRozmeru(
                            b.rozmer
                        )

                    );
                }
            );


            /* ======================================================
               ROZDĚLENÍ PODLE MATERIÁLU
            ====================================================== */

            const podleMaterialu = {};


            skupiny.forEach(
                skupina => {

                    const material =
                        skupina.material;


                    if (
                        !podleMaterialu[
                            material
                        ]
                    ) {

                        podleMaterialu[
                            material
                        ] = [];
                    }


                    podleMaterialu[
                        material
                    ].push(
                        skupina
                    );
                }
            );


            /* ======================================================
               GENEROVÁNÍ HTML
            ====================================================== */

            let html = "";

            let celkemVsechno = 0;


            const materialy =
                Object.keys(
                    podleMaterialu
                )

                .sort(
                    (a, b) => {

                        const rozdil =
                            poradiMaterialu(a)
                            -
                            poradiMaterialu(b);


                        if (
                            rozdil !== 0
                        ) {

                            return rozdil;
                        }


                        return a.localeCompare(
                            b,
                            "cs"
                        );
                    }
                );


            materialy.forEach(
                material => {

                    html += `

                        <section class="sekce-materialu">

                            <div class="nazev-materialu">

                                ${escapeHtml(material)}

                            </div>

                    `;


                    podleMaterialu[
                        material
                    ]

                    .forEach(
                        skupina => {

                            celkemVsechno +=
                                skupina.celkem;


                            /* ======================================
                               TAVBY
                            ====================================== */

                            const tavby =

                                Object.entries(
                                    skupina.tavby
                                )

                                .map(
                                    ([tavba, pocet]) => ({

                                        tavba,

                                        pocet:
                                            Number(pocet)

                                    })
                                )

                                .filter(
                                    tavba =>
                                        tavba.pocet > 0
                                )

                                .sort(
                                    (a, b) =>

                                        String(
                                            a.tavba
                                        )

                                        .localeCompare(
                                            String(
                                                b.tavba
                                            ),
                                            "cs",
                                            {
                                                numeric: true
                                            }
                                        )
                                );


                            let tavbyHTML = "";


                            tavby.forEach(
                                tavba => {

                                    const trida =

                                        tridaPoctu(
                                            tavba.pocet
                                        );


                                    tavbyHTML += `

                                        <div class="tavba">

                                            <div class="tavba-vlevo">

                                                Tavba:

                                                <span class="cislo-tavby">

                                                    ${escapeHtml(
                                                        tavba.tavba
                                                    )}

                                                </span>

                                            </div>


                                            <div class="tavba-vpravo">

                                                <span class="${trida}">

                                                    ${tavba.pocet} ks

                                                </span>

                                            </div>

                                        </div>

                                    `;
                                }
                            );


                            /* ======================================
                               ROZMĚR
                            ====================================== */

                            const rozmerText =

                                skupina.rozmer ===
                                "Neuvedeno"

                                ?

                                "Neuvedeno"

                                :

                                escapeHtml(
                                    skupina.rozmer
                                ) + " mm";


                            const tridaCelkem =

                                tridaPoctu(
                                    skupina.celkem
                                );


                            /* při hledání automaticky otevřeme kartu */

                            const otevrit =

                                hledanaTavba !== ""

                                ?

                                "open"

                                :

                                "";


                            html += `

                                <details
                                    class="polozka"
                                    ${otevrit}
                                >

                                    <summary>

                                        <div class="hlavni-info">


                                            <div class="info-vlevo">

                                                <h2>

                                                    ${escapeHtml(
                                                        skupina.druh
                                                    )}

                                                </h2>

                                                <h3>

                                                    Ø ${rozmerText}

                                                </h3>

                                            </div>


                                            <div class="info-vpravo">

                                                <span class="popisek-celkem">

                                                    CELKEM

                                                </span>

                                                <span class="
                                                    hodnota-celkem
                                                    ${tridaCelkem}
                                                ">

                                                    ${skupina.celkem} ks

                                                </span>

                                            </div>


                                        </div>

                                    </summary>


                                    <div class="obsah-taveb">

                                        ${tavbyHTML}

                                    </div>

                                </details>

                            `;
                        }
                    );


                    html += `

                        </section>

                    `;
                }
            );


            /* ======================================================
               CELKOVÝ SOUČET
            ====================================================== */

            html += `

                <div class="celkem-vsechno">

                    Celkem zobrazených tyček:

                    <strong>
                        ${celkemVsechno.toLocaleString("cs-CZ")} ks
                    </strong>

                </div>

            `;


            seznam.innerHTML =
                html;
        }


        /* ==========================================================
           START
        ========================================================== */

        zkontrolujPrihlaseni();

    </script>

</body>
