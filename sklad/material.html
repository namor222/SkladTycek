<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sklad materiálu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
            padding: 30px 15px;
            display: none;
        }

        .hlavicka {
            max-width: 500px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .hlavicka h1 {
            margin: 0;
            font-size: 28px;
            text-align: left;
        }

        .zpet {
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            color: #1976d2;
            white-space: nowrap;
        }

        .menu {
            max-width: 500px;
            margin: auto;
        }

        .menu a {
            display: block;
            text-decoration: none;
        }

        .menu button {
            width: 100%;
            padding: 25px;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        @media (max-width: 500px) {

            .hlavicka h1 {
                font-size: 22px;
            }

            .zpet {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="hlavicka">

        <h1>📦 Sklad materiálu</h1>

        <a class="zpet" href="../index.html">
            ← HLAVNÍ MENU
        </a>

    </div>


    <div class="menu">

        <a href="stav.html">
            <button>📊 STAV</button>
        </a>

        <a href="pridat.html">
            <button>➕ PŘIDAT</button>
        </a>

        <a href="odebrat.html">
            <button>➖ ODEBRAT</button>
        </a>

        <a href="historie.html">
            <button>🕘 HISTORIE</button>
        </a>

    </div>


    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function zkontrolujPrihlaseni() {

            const { data, error } =
                await supabaseClient
                    .auth
                    .getSession();

            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "../login.html"
                );

                return;
            }

            document.body.style.display =
                "block";
        }


        zkontrolujPrihlaseni();

    </script>

</body>
</html>
