<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sklad materiálu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            display: none;
            font-family: Arial, Helvetica, sans-serif;

            width: 100%;
            min-height: 100vh;

            background-image: url("materialpc.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;

            overflow: hidden;
        }


        /* =====================================================
           HLAVNÍ STRÁNKA
        ===================================================== */

        .stranka {
            position: relative;

            width: 100vw;
            height: 100vh;
            min-height: 650px;
        }


        /* =====================================================
           ZPĚT
           Decentnější než původní verze
        ===================================================== */

        .zpet {
            position: fixed;

            top: 22px;
            right: 24px;

            z-index: 100;

            min-width: 105px;
            height: 40px;

            padding: 0 17px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;

            text-decoration: none;

            color: rgba(255, 255, 255, .90);

            font-size: 13px;
            font-weight: 800;
            letter-spacing: .2px;

            border: 1px solid rgba(255, 255, 255, .65);
            border-radius: 10px;

            background:
                linear-gradient(
                    110deg,
                    rgba(220, 220, 220, .50) 0%,
                    rgba(100, 100, 100, .52) 35%,
                    rgba(30, 30, 30, .70) 70%,
                    rgba(5, 5, 5, .78) 100%
                );

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            box-shadow:
                0 4px 12px rgba(0, 0, 0, .30),
                inset 0 1px 0 rgba(255, 255, 255, .40);

            text-shadow:
                0 1px 2px rgba(0, 0, 0, .9);

            opacity: .82;

            transition:
                transform .18s ease,
                opacity .18s ease,
                filter .18s ease,
                box-shadow .18s ease;
        }

        .zpet:hover {
            opacity: 1;
            transform: translateY(-2px);

            filter: brightness(1.12);

            box-shadow:
                0 6px 17px rgba(0, 0, 0, .45),
                inset 0 1px 0 rgba(255, 255, 255, .55);
        }

        .zpet:active {
            transform: scale(.97);
        }


        /* =====================================================
           MENU

           Skleněný panel JE SOUČÁSTÍ obrázku.
           Tady vytváříme pouze tlačítka.
        ===================================================== */

        .menu {
            position: absolute;

            left: 50%;
            top: 50.5%;

            transform: translate(-50%, -50%);

            width: min(46vw, 790px);

            display: flex;
            flex-direction: column;

            gap: 14px;

            z-index: 10;
        }

        .menu a {
            display: block;
            width: 100%;

            text-decoration: none;
        }


        /* =====================================================
           TLAČÍTKA
        ===================================================== */

        .menu button {
            position: relative;

            width: 100%;
            height: 68px;

            padding: 0 25px;

            border: 1.5px solid rgba(255, 255, 255, .92);
            border-radius: 11px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 18px;

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 21px;
            font-weight: 900;

            letter-spacing: .3px;

            /*
             * Stříbrná -> šedá -> černá
             */
            background:
                linear-gradient(
                    105deg,
                    #f4f4f4 0%,
                    #dddddd 14%,
                    #a9a9a9 28%,
                    #686868 42%,
                    #343434 55%,
                    #181818 72%,
                    #080808 88%,
                    #030303 100%
                );

            box-shadow:
                0 6px 15px rgba(0, 0, 0, .45),
                inset 0 1px 1px rgba(255, 255, 255, .95);

            text-shadow:
                0 2px 4px #000;

            overflow: hidden;

            transition:
                transform .17s ease,
                filter .17s ease,
                box-shadow .17s ease;
        }


        /* kovový odlesk */

        .menu button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -45%;

            width: 32%;
            height: 100%;

            transform: skewX(-25deg);

            background:
                linear-gradient(
                    100deg,
                    transparent,
                    rgba(255, 255, 255, .38),
                    transparent
                );

            transition: left .45s ease;

            pointer-events: none;
        }


        .menu button:hover {
            transform: translateY(-3px);

            filter: brightness(1.12);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, .60),
                inset 0 1px 1px white;
        }

        .menu button:hover::before {
            left: 120%;
        }

        .menu button:active {
            transform: scale(.985);
        }


        /* =====================================================
           IKONY
        ===================================================== */

        .ikona {
            position: relative;
            z-index: 2;

            width: 42px;
            min-width: 42px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 29px;

            filter:
                drop-shadow(0 3px 3px rgba(0, 0, 0, .75));
        }

        .text {
            position: relative;
            z-index: 2;
        }


        /* =====================================================
           BARVY / VZHLED IKON
        ===================================================== */

        .stav .ikona {
            color: #35a7ff;
        }

        .pridat .ikona {
            color: #299cff;
        }

        .odebrat .ikona {
            color: #ff8700;
        }

        .historie .ikona {
            color: white;
        }


        /* =====================================================
           NOTEBOOK / MENŠÍ PC
        ===================================================== */

        @media (max-width: 1200px) {

            .menu {
                width: min(52vw, 700px);
            }

            .menu button {
                height: 62px;
                font-size: 19px;
            }
        }


        /* =====================================================
           MOBIL
        ===================================================== */

        @media (max-width: 600px) {

            body {
                min-height: 100svh;

                background-image: url("materialmobil.png");
                background-repeat: no-repeat;

                /*
                 * Fotku necháme přes celý displej.
                 */
                background-position: center top;
                background-size: cover;

                overflow: hidden;
            }

            .stranka {
                width: 100%;
                height: 100svh;

                min-height: 600px;
            }


            /* =============================================
               ZPĚT - MOBIL
            ============================================= */

            .zpet {
                top: 10px;
                right: 10px;

                min-width: 68px;
                height: 30px;

                padding: 0 9px;

                font-size: 9px;
                font-weight: 800;

                border-radius: 7px;

                border:
                    1px solid rgba(255, 255, 255, .52);

                background:
                    linear-gradient(
                        110deg,
                        rgba(200, 200, 200, .32),
                        rgba(50, 50, 50, .50),
                        rgba(5, 5, 5, .65)
                    );

                box-shadow:
                    0 3px 8px rgba(0, 0, 0, .25);

                opacity: .68;

                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
            }

            .zpet:hover {
                opacity: 1;
            }


            /* =============================================
               MENU - MOBIL

               Pozice odpovídá skleněnému panelu
               na materialmobil.png.
            ============================================= */

            .menu {
                left: 50%;

                /*
                 * lehce níž než původní verze
                 */
                top: 45%;

                transform:
                    translate(-50%, -50%);

                width: 72%;

                gap: 10px;
            }


            /* =============================================
               TLAČÍTKA - MOBIL
            ============================================= */

            .menu button {
                height: 57px;

                padding: 0 12px;

                gap: 10px;

                font-size: 16px;

                border-radius: 9px;

                border:
                    1.3px solid rgba(255, 255, 255, .9);

                box-shadow:
                    0 5px 12px rgba(0, 0, 0, .42),
                    inset 0 1px 1px rgba(255, 255, 255, .9);
            }


            .ikona {
                width: 33px;
                min-width: 33px;

                font-size: 24px;
            }
        }


        /* =====================================================
           MENŠÍ MOBILY
        ===================================================== */

        @media (max-width: 390px) {

            .menu {
                top: 45%;

                width: 74%;

                gap: 8px;
            }

            .menu button {
                height: 52px;

                font-size: 14px;

                gap: 8px;
            }

            .ikona {
                width: 29px;
                min-width: 29px;

                font-size: 21px;
            }

            .zpet {
                min-width: 62px;
                height: 28px;

                font-size: 8px;
            }
        }


        /* =====================================================
           NÍZKÝ DISPLEJ MOBILU
        ===================================================== */

        @media (max-width: 600px) and (max-height: 700px) {

            .menu {
                top: 46%;
            }

            .menu button {
                height: 48px;
            }
        }

    </style>
</head>

<body>

<main class="stranka">


    <!-- ==========================================
         ZPĚT
    =========================================== -->

    <a
        href="../index.html"
        class="zpet"
    >
        ← ZPĚT
    </a>



    <!-- ==========================================
         MENU
    =========================================== -->

    <nav class="menu">


        <!-- STAV -->

        <a href="stav.html">

            <button
                type="button"
                class="stav"
            >
                <span class="ikona">📊</span>

                <span class="text">
                    STAV
                </span>
            </button>

        </a>



        <!-- PŘIDAT -->

        <a href="pridat.html">

            <button
                type="button"
                class="pridat"
            >
                <span class="ikona">➕</span>

                <span class="text">
                    PŘIDAT
                </span>
            </button>

        </a>



        <!-- ODEBRAT -->

        <a href="odebrat.html">

            <button
                type="button"
                class="odebrat"
            >
                <span class="ikona">➖</span>

                <span class="text">
                    ODEBRAT
                </span>
            </button>

        </a>



        <!-- HISTORIE -->

        <a href="historie.html">

            <button
                type="button"
                class="historie"
            >
                <span class="ikona">🕘</span>

                <span class="text">
                    HISTORIE
                </span>
            </button>

        </a>


    </nav>

</main>



<script>

    /* =====================================================
       SUPABASE
       FUNKČNOST ZACHOVÁNA
    ===================================================== */

    const SUPABASE_URL =
        "https://gmawlmsizglrnjmjegmx.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =====================================================
       KONTROLA PŘIHLÁŠENÍ
    ===================================================== */

    async function zkontrolujPrihlaseni() {

        const { data, error } =
            await supabaseClient
                .auth
                .getSession();


        if (
            error ||
            !data.session
        ) {

            window.location.replace(
                "../login.html"
            );

            return;
        }


        /*
         * Stránku zobrazíme až po ověření
         * přihlášení.
         */

        document.body.style.display =
            "block";
    }


    zkontrolujPrihlaseni();

</script>

</body>
</html>
