<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Sklad materiálu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================================================
           ZÁKLAD
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        html {
            background: #071018;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            display: none;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            margin: 0;
            padding: 0;

            overflow-x: hidden;

            color: white;

            /* =====================================================
               PC POZADÍ
               ===================================================== */

            background-image: url("materialpc.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            background-color: #071018;
        }


        /* =========================================================
           HLAVNÍ STRÁNKA
        ========================================================= */

        .page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 170px 20px 90px;
        }


        /* =========================================================
           TLAČÍTKO ZPĚT
        ========================================================= */

        .zpet {
            position: fixed;

            top: 28px;
            right: 30px;

            z-index: 100;

            min-width: 105px;

            padding: 12px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: rgba(255, 255, 255, 0.82);

            font-size: 15px;
            font-weight: 800;

            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.30);

            background:
                linear-gradient(
                    110deg,
                    rgba(255, 255, 255, 0.16),
                    rgba(35, 35, 35, 0.58) 45%,
                    rgba(10, 10, 10, 0.68)
                );

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.20);

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }


        .zpet:hover {
            transform: translateY(-2px);

            color: #ffffff;

            background:
                linear-gradient(
                    110deg,
                    rgba(255, 255, 255, 0.25),
                    rgba(45, 45, 45, 0.72) 45%,
                    rgba(15, 15, 15, 0.82)
                );

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.30);
        }


        /* =========================================================
           SKLENĚNÝ PANEL
        ========================================================= */

        .panel {
            width: min(860px, 76vw);

            padding: 55px 65px;

            border-radius: 22px;

            border: 1px solid rgba(255, 255, 255, 0.30);

            /*
                Panel je schválně hodně průhledný,
                protože skleněný panel už máme
                zakomponovaný také v obrázku.
            */

            background:
                linear-gradient(
                    110deg,
                    rgba(15, 95, 150, 0.08),
                    rgba(20, 25, 30, 0.12) 50%,
                    rgba(170, 75, 15, 0.08)
                );

            box-shadow:
                -4px 0 18px rgba(20, 150, 255, 0.15),
                4px 0 18px rgba(255, 120, 20, 0.13),
                0 14px 35px rgba(0, 0, 0, 0.20);
        }


        /* =========================================================
           MENU
        ========================================================= */

        .menu {
            width: 100%;
            margin: 0 auto;
        }

        .menu a {
            display: block;

            width: 100%;

            margin-bottom: 16px;

            text-decoration: none;
        }

        .menu a:last-child {
            margin-bottom: 0;
        }


        /* =========================================================
           TLAČÍTKA
        ========================================================= */

        .menu button {
            position: relative;

            width: 100%;
            height: 78px;

            padding: 0 30px;

            border-radius: 13px;

            border:
                1.5px solid
                rgba(220, 235, 245, 0.68);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 20px;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 23px;
            font-weight: 900;

            letter-spacing: 0.4px;

            /*
                MODRO - KOVOVĚ - ORANŽOVÝ VZHLED
            */

            background:
                linear-gradient(
                    105deg,

                    rgba(45, 135, 195, 0.86) 0%,

                    rgba(55, 100, 130, 0.90) 17%,

                    rgba(60, 68, 75, 0.94) 38%,

                    rgba(35, 37, 40, 0.97) 58%,

                    rgba(67, 49, 39, 0.96) 79%,

                    rgba(145, 72, 26, 0.88) 100%
                );

            box-shadow:
                0 7px 18px rgba(0, 0, 0, 0.48),

                inset 0 1px 0
                rgba(255, 255, 255, 0.50),

                inset 0 -1px 0
                rgba(0, 0, 0, 0.65);

            text-shadow:
                0 2px 4px
                rgba(0, 0, 0, 0.95);

            overflow: hidden;

            transition:
                transform 0.17s ease,
                filter 0.17s ease,
                box-shadow 0.17s ease,
                border-color 0.17s ease;
        }


        /* =========================================================
           KOVOVÝ ODLESK
        ========================================================= */

        .menu button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -30%;

            width: 45%;
            height: 100%;

            transform: skewX(-22deg);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.11),
                    transparent
                );

            pointer-events: none;

            transition: left 0.45s ease;
        }


        /* =========================================================
           HOVER
        ========================================================= */

        .menu button:hover {
            transform: translateY(-3px);

            filter:
                brightness(1.15)
                saturate(1.12);

            border-color:
                rgba(255, 255, 255, 0.85);

            box-shadow:
                0 11px 26px
                rgba(0, 0, 0, 0.55),

                -4px 0 15px
                rgba(25, 155, 255, 0.32),

                4px 0 15px
                rgba(255, 120, 25, 0.28),

                inset 0 1px 1px
                rgba(255, 255, 255, 0.60);
        }

        .menu button:hover::before {
            left: 90%;
        }


        /* =========================================================
           KLIKNUTÍ
        ========================================================= */

        .menu button:active {
            transform:
                translateY(0)
                scale(0.99);

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.45),

                inset 0 2px 5px
                rgba(0, 0, 0, 0.35);
        }


        /* =========================================================
           IKONY
        ========================================================= */

        .ikona {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 42px;

            font-size: 32px;
            line-height: 1;

            filter:
                drop-shadow(
                    0 3px 3px
                    rgba(0, 0, 0, 0.65)
                );
        }


        /* STAV */

        .stav {
            filter:
                drop-shadow(
                    0 3px 3px
                    rgba(0, 0, 0, 0.65)
                )
                saturate(1.2);
        }


        /* PŘIDAT */

        .pridat {
            color: #32aaff;

            font-size: 46px;
            font-weight: bold;

            text-shadow:
                0 0 10px
                rgba(40, 160, 255, 0.50);
        }


        /* ODEBRAT */

        .odebrat {
            color: #ff8618;

            font-size: 46px;
            font-weight: bold;

            text-shadow:
                0 0 10px
                rgba(255, 125, 20, 0.45);
        }


        /* HISTORIE */

        .historie {
            font-size: 33px;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 900px) {

            .panel {
                width: min(720px, 86vw);

                padding:
                    45px
                    45px;
            }

            .menu button {
                height: 72px;

                font-size: 21px;
            }
        }


        /* =========================================================
           MOBIL
        ========================================================= */

        @media (max-width: 600px) {

            body {

                /*
                    MOBILNÍ OBRÁZEK
                */

                background-image:
                    url("materialmobil.png");

                background-size: cover;

                background-position:
                    center top;

                background-repeat:
                    no-repeat;

                background-attachment:
                    scroll;
            }


            .page {
                width: 100%;

                min-height: 100vh;
                min-height: 100dvh;

                padding:
                    205px
                    18px
                    50px;

                align-items:
                    flex-start;
            }


            /* =====================================================
               ZPĚT NA MOBILU
            ===================================================== */

            .zpet {
                top:
                    calc(
                        14px +
                        env(safe-area-inset-top)
                    );

                right: 14px;

                min-width: auto;

                padding:
                    8px
                    13px;

                font-size:
                    12px;

                border-radius:
                    8px;

                color:
                    rgba(
                        255,
                        255,
                        255,
                        0.68
                    );

                background:
                    rgba(
                        15,
                        18,
                        22,
                        0.35
                    );

                border:
                    1px solid
                    rgba(
                        255,
                        255,
                        255,
                        0.22
                    );

                backdrop-filter:
                    blur(5px);

                -webkit-backdrop-filter:
                    blur(5px);

                box-shadow:
                    0 3px 10px
                    rgba(
                        0,
                        0,
                        0,
                        0.20
                    );
            }


            /* =====================================================
               PANEL MOBIL
            ===================================================== */

            .panel {
                width: 92vw;

                margin:
                    0 auto;

                padding:
                    32px
                    22px;

                border-radius:
                    18px;

                background:
                    linear-gradient(
                        120deg,

                        rgba(
                            20,
                            90,
                            140,
                            0.10
                        ),

                        rgba(
                            20,
                            25,
                            30,
                            0.16
                        )
                        50%,

                        rgba(
                            150,
                            70,
                            20,
                            0.10
                        )
                    );

                border:
                    1px solid
                    rgba(
                        255,
                        255,
                        255,
                        0.28
                    );

                box-shadow:
                    -3px 0 14px
                    rgba(
                        20,
                        150,
                        255,
                        0.14
                    ),

                    3px 0 14px
                    rgba(
                        255,
                        120,
                        20,
                        0.12
                    ),

                    0 10px 25px
                    rgba(
                        0,
                        0,
                        0,
                        0.20
                    );
            }


            .menu a {
                margin-bottom:
                    13px;
            }


            /* =====================================================
               MOBILNÍ TLAČÍTKA
            ===================================================== */

            .menu button {
                height:
                    68px;

                padding:
                    0
                    15px;

                border-radius:
                    11px;

                font-size:
                    18px;

                gap:
                    13px;

                background:
                    linear-gradient(
                        105deg,

                        rgba(
                            40,
                            125,
                            180,
                            0.88
                        )
                        0%,

                        rgba(
                            52,
                            82,
                            102,
                            0.94
                        )
                        25%,

                        rgba(
                            35,
                            36,
                            39,
                            0.97
                        )
                        57%,

                        rgba(
                            92,
                            54,
                            31,
                            0.95
                        )
                        82%,

                        rgba(
                            160,
                            78,
                            24,
                            0.88
                        )
                        100%
                    );
            }


            .ikona {
                width:
                    34px;

                font-size:
                    27px;
            }

            .pridat,
            .odebrat {
                font-size:
                    38px;
            }

            .historie {
                font-size:
                    28px;
            }
        }


        /* =========================================================
           MALÉ MOBILY
        ========================================================= */

        @media (max-width: 380px) {

            .page {
                padding-left:
                    12px;

                padding-right:
                    12px;

                padding-top:
                    190px;
            }

            .panel {
                width:
                    94vw;

                padding:
                    25px
                    14px;
            }

            .menu button {
                height:
                    62px;

                font-size:
                    16px;

                gap:
                    10px;
            }

            .ikona {
                width:
                    30px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         ZPĚT
    ========================================================== -->

    <a
        class="zpet"
        href="../index.html"
    >
        ← ZPĚT
    </a>



    <!-- =========================================================
         HLAVNÍ OBSAH
    ========================================================== -->

    <main class="page">


        <div class="panel">


            <div class="menu">


                <!-- STAV -->

                <a href="stav.html">

                    <button type="button">

                        <span class="ikona stav">
                            📊
                        </span>

                        <span>
                            STAV
                        </span>

                    </button>

                </a>



                <!-- PŘIDAT -->

                <a href="pridat.html">

                    <button type="button">

                        <span class="ikona pridat">
                            +
                        </span>

                        <span>
                            PŘIDAT
                        </span>

                    </button>

                </a>



                <!-- ODEBRAT -->

                <a href="odebrat.html">

                    <button type="button">

                        <span class="ikona odebrat">
                            −
                        </span>

                        <span>
                            ODEBRAT
                        </span>

                    </button>

                </a>



                <!-- HISTORIE -->

                <a href="historie.html">

                    <button type="button">

                        <span class="ikona historie">
                            🕘
                        </span>

                        <span>
                            HISTORIE
                        </span>

                    </button>

                </a>


            </div>


        </div>


    </main>



    <!-- =========================================================
         SUPABASE
    ========================================================== -->

    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function zkontrolujPrihlaseni() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "../login.html"
                );

                return;
            }


            /*
                Stránku zobrazíme až po
                úspěšné kontrole přihlášení.
            */

            document.body.style.display =
                "block";
        }


        zkontrolujPrihlaseni();

    </script>


</body>

</html>
