<!DOCTYPE html>
<html lang="cs">
<head>
    <link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/x-icon" href="./favicon.ico?v=3">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Odebrat ze skladu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

*{box-sizing:border-box}
:root{
  --bg:#f4f7fb;--card:#fff;--line:#dce5ef;--text:#071a38;
  --muted:#718198;--blue:#1688f5;--green:#00a63c;--orange:#ff7600;
  --red:#e53935;--shadow:0 5px 18px rgba(20,45,75,.06)
}
body{
  font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);
  margin:0;padding:24px 28px 44px;display:none;text-align:left
}
.hlavicka,.hledani,.obsah{width:min(1180px,100%);margin-left:auto;margin-right:auto}
.hlavicka{
  min-height:74px;display:flex;align-items:center;justify-content:space-between;
  gap:20px;border-bottom:1px solid var(--line);margin-bottom:18px
}
.hlavicka h1{margin:0;font-size:38px;line-height:1;font-weight:800;letter-spacing:-.7px}
.zpet{
  display:inline-flex;align-items:center;justify-content:center;min-width:116px;height:48px;
  padding:0 20px;border:1px solid #d6e0ea;border-radius:10px;background:#fff;
  box-shadow:0 4px 14px rgba(16,42,67,.05);color:var(--text);text-decoration:none;
  font-size:15px;font-weight:800
}
.hledani{margin-bottom:24px}
.hledani input{
  width:100%;max-width:none;height:52px;padding:0 18px;border:1px solid #d5e0eb;
  border-radius:10px;background:#fff;color:var(--text);font-size:15px;font-weight:600;
  text-align:left;outline:none;box-shadow:0 3px 10px rgba(16,42,67,.03)
}
.hledani input:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,136,245,.09)}
#seznam>p{padding:18px;background:#fff;border:1px solid var(--line);border-radius:12px}
.skupina{
  position:relative;background:var(--card);margin-bottom:14px;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);overflow:hidden
}
.skupina::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue);z-index:3
}
.skupina summary{
  list-style:none;cursor:pointer;min-height:56px;padding:12px 50px 12px 20px;
  display:grid;grid-template-columns:minmax(145px,.8fr) minmax(180px,1.2fr) auto;
  gap:16px;align-items:center;position:relative;border-bottom:1px solid #e7edf4
}
.skupina summary::-webkit-details-marker{display:none}
.skupina summary::after{
  content:"›";position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-size:27px;color:#425a78;font-weight:400
}
.skupina[open] summary{background:#edf6ff}
.skupina[open] summary::after{content:"⌄";font-size:20px;color:#0877e8}
.nazev{margin:0;font-size:16px;font-weight:800}
.parametry{margin:0;color:#42536c;font-size:15px;font-weight:700}
.celkem{margin:0;text-align:right;color:var(--green);font-size:16px;font-weight:800;white-space:nowrap}
.skupina summary>div:last-child{display:none}

/* Expanded batch/removal area */
.atest{
  margin:0;padding:16px 20px 18px;background:#fff;border-bottom:1px solid #e5ecf3;
  display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,1fr);
  column-gap:28px;align-items:end
}
.atest:last-child{border-bottom:0}
.atest h3{
  grid-column:1;margin:0 0 8px;font-size:14px;color:#667991;font-weight:700
}
.cislo-tavby{color:#0877e8;font-size:17px;font-weight:800}
.atest p{
  grid-column:1;margin:0 0 10px;font-size:14px;color:#667991
}
.atest p span{display:inline-block;margin-left:6px;font-size:19px}
.fifo{font-size:13px;color:var(--muted);margin-top:6px}
.pocet-malo{color:var(--red);font-weight:800}
.pocet-stred{color:#f57c00;font-weight:800}
.pocet-ok{color:var(--green);font-weight:800}
.atest label{
  grid-column:2;display:block;margin:0 0 7px;color:var(--text);font-size:14px;font-weight:800
}
.atest br{display:none}
.atest input{
  grid-column:2;width:100%;max-width:none;height:44px;padding:0 12px;border:1px solid #ccd7e3;
  border-radius:7px;background:#fff;color:var(--text);font-size:15px;text-align:left;outline:none;
  margin-bottom:10px
}
.atest button{
  grid-column:2;width:100%;max-width:none;min-height:48px;margin-top:4px;padding:12px 16px;
  border:0;border-radius:8px;background:var(--orange);color:#fff;font-size:14px;font-weight:800;
  cursor:pointer;box-shadow:0 5px 14px rgba(255,118,0,.17)
}
.atest button:hover{filter:brightness(.97)}
.atest button:disabled{opacity:.6;cursor:not-allowed}
.chyba{grid-column:2;color:#d32f2f;font-size:13px;font-weight:700;margin-top:8px}

@media(max-width:700px){
  body{padding:13px 11px 28px}
  .hlavicka{min-height:58px;margin-bottom:12px}
  .hlavicka h1{font-size:24px;letter-spacing:-.3px}
  .zpet{min-width:84px;height:40px;padding:0 13px;font-size:13px}
  .hledani{margin-bottom:13px}
  .hledani input{height:44px;font-size:13px}
  .skupina{margin-bottom:9px}
  .skupina summary{
    min-height:57px;padding:10px 38px 10px 15px;
    grid-template-columns:1fr auto;gap:3px 10px
  }
  .nazev{font-size:14px}
  .parametry{grid-column:1;font-size:12px}
  .celkem{grid-column:2;grid-row:1/span 2;font-size:14px}
  .skupina summary::after{right:11px;font-size:22px}
  .atest{padding:14px 15px 16px;grid-template-columns:1fr;column-gap:0}
  .atest h3,.atest p,.atest label,.atest input,.atest button,.chyba{grid-column:1}
  .atest label{margin-top:8px}
  .atest input{height:43px;font-size:14px}
  .atest button{margin-top:3px}
}


/* Samostatné obsazené objednávky */
.obsazeno-seznam{grid-column:1;margin:0 0 12px;font-size:14px}
.obsazeno-nadpis{color:#667991;font-weight:700;margin-bottom:5px}
.obsazeno-radek{display:flex;gap:12px;justify-content:space-between;max-width:300px;padding:3px 0;color:#ff7600;font-weight:800}
.obsazeno-radek strong{color:#ff7600;white-space:nowrap}
@media(max-width:700px){.obsazeno-seznam{grid-column:1}}

</style>

</head>

<body>

    <div class="hlavicka">

        <h1>Odebrat ze skladu</h1>

        <a class="zpet" href="material.html">
            ← ZPĚT
        </a>

    </div>


    <div class="hledani">

        <input
            type="text"
            id="hledatTavbu"
            placeholder="🔎 Hledat podle tavby..."
            oninput="zobrazSklad()"
        >

    </div>


    <div class="obsah">

        <div id="seznam">
            Načítám sklad...
        </div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let ulozenySklad = [];
        let ulozeneObjednavky = [];
        let zobrazeneTavby = [];


        /*
            KONTROLA PŘIHLÁŠENÍ
        */

        function otevriDatabaziProhlizece() {
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open("kovohladil-prohlizec", 1);
                        request.onupgradeneeded = () => {
                            const db = request.result;
                            if (!db.objectStoreNames.contains("klice")) {
                                db.createObjectStore("klice");
                            }
                        };
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                }
        
                async function nactiExistujiciKlic() {
                    if (!window.isSecureContext || !crypto.subtle || !window.indexedDB) {
                        throw new Error("Prohlížeč nepodporuje bezpečné ověření.");
                    }
                    const db = await otevriDatabaziProhlizece();
                    try {
                        const par = await new Promise((resolve, reject) => {
                            const tx = db.transaction("klice", "readonly");
                            const request = tx.objectStore("klice").get("identita");
                            request.onsuccess = () => resolve(request.result || null);
                            request.onerror = () => reject(request.error);
                        });
                        if (!par?.privateKey || !par?.publicKey) {
                            throw new Error("V tomto prohlížeči není uložen schválený klíč.");
                        }
                        const jwk = await crypto.subtle.exportKey("jwk", par.publicKey);
                        return {
                            par,
                            verejnyKlic: { kty: "EC", crv: "P-256", x: jwk.x, y: jwk.y }
                        };
                    } finally {
                        db.close();
                    }
                }
        
                function kodujBase64url(buffer) {
                    let text = "";
                    for (const byte of new Uint8Array(buffer)) text += String.fromCharCode(byte);
                    return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
                }
        
                async function zavolejSchvalovani(body) {
                    const { data, error } = await supabaseClient.functions.invoke(
                        "schvalovani-prohlizecu", { body }
                    );
                    if (error) throw error;
                    if (data?.chyba) throw new Error(data.chyba);
                    return data;
                }
        
                async function overSchvalenyProhlizec() {
                    const { par, verejnyKlic } = await nactiExistujiciKlic();
                    const vyzva = await zavolejSchvalovani({
                        akce: "vyzva",
                        verejny_klic: verejnyKlic
                    });
                    if (typeof vyzva?.vyzva !== "string" || !vyzva?.vyzva_id) {
                        throw new Error("Server nevrátil platnou výzvu.");
                    }
                    const podpis = await crypto.subtle.sign(
                        { name: "ECDSA", hash: "SHA-256" },
                        par.privateKey,
                        new TextEncoder().encode(vyzva.vyzva)
                    );
                    const vysledek = await zavolejSchvalovani({
                        akce: "overit",
                        verejny_klic: verejnyKlic,
                        vyzva_id: vyzva.vyzva_id,
                        podpis: kodujBase64url(podpis)
                    });
                    if (vysledek?.overeno !== true) {
                        throw new Error("Prohlížeč není schválený.");
                    }
                }


        async function zkontrolujPrihlaseni() {
            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (error || !data.session) {
                    window.location.replace("../login.html");
                    return;
                }

                // Před zobrazením výdeje ověříme podpis schváleného prohlížeče.
                await overSchvalenyProhlizec();
                document.body.style.display = "block";
                nactiSklad();
            } catch (chyba) {
                console.error("Ověření prohlížeče:", chyba);
                window.location.replace("../login.html");
            }
        }


        function escapeHtml(text) {

            return String(
                text ?? ""
            )
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

        }


        /*
            BARVA PODLE POČTU
        */

        function tridaPoctu(pocet) {

            const cislo =
                Number(pocet);


            if (cislo < 10) {
                return "pocet-malo";
            }


            if (cislo <= 20) {
                return "pocet-stred";
            }


            return "pocet-ok";

        }


        /*
            NAČTENÍ SKLADU – pouze přesný počet kusů
        */

        // Jen cteni skladu a rezervaci. FIFO vydej zustava na puvodnim RPC.
        async function nactiVydejBezpecne() {
            const {data:{session},error:sessionError} = await supabaseClient.auth.getSession();
            if (sessionError || !session) throw new Error("Nejdřív se přihlas.");
            const {par, verejnyKlic} = await nactiExistujiciKlic();
            const headers = {
                Authorization: `Bearer ${session.access_token}`,
                apikey: SUPABASE_KEY,
                "Content-Type": "application/json"
            };
            const base = `${SUPABASE_URL}/functions/v1/`;
            const vr = await fetch(base + "schvalovani-prohlizecu", {
                method:"POST", headers,
                body:JSON.stringify({akce:"vyzva",verejny_klic:verejnyKlic})
            });
            const vyzva = await vr.json();
            if (!vr.ok || !vyzva?.vyzva || !vyzva?.vyzva_id)
                throw new Error(vyzva?.chyba || "Nepodařilo se získat bezpečnostní výzvu.");
            const prikaz = {
                akce:"cteni-vydeje", metoda:"POST",
                cesta:"/functions/v1/sklad-bezpecny", parametry:null
            };
            const digest = await crypto.subtle.digest(
                "SHA-256", new TextEncoder().encode(JSON.stringify(prikaz))
            );
            const otisk = [...new Uint8Array(digest)]
                .map(b => b.toString(16).padStart(2,"0")).join("");
            const podpis = await crypto.subtle.sign(
                {name:"ECDSA",hash:"SHA-256"}, par.privateKey,
                new TextEncoder().encode(`${vyzva.vyzva}:sklad-bezpecny:v2:${otisk}`)
            );
            const response = await fetch(base + "sklad-bezpecny", {
                method:"POST", headers,
                body:JSON.stringify({
                    ...prikaz, verejny_klic:verejnyKlic,
                    vyzva_id:vyzva.vyzva_id, podpis:kodujBase64url(podpis)
                })
            });
            const vysledek = await response.json();
            if (!response.ok || vysledek?.overeno !== true ||
                !Array.isArray(vysledek?.data?.stav) ||
                !Array.isArray(vysledek?.data?.rezervace))
                throw new Error(vysledek?.chyba || vysledek?.detail || "Načtení výdeje selhalo.");
            return vysledek.data;
        }

        async function nactiSklad() {

            const seznam =
                document.getElementById("seznam");

            let data, objednavkyData;
            try {
                const vysledek = await nactiVydejBezpecne();
                data = vysledek.stav;
                objednavkyData = vysledek.rezervace;
            } catch (error) {
                seznam.innerHTML =
                    "<p>Chyba při načítání skladu a rezervací:<br>" +
                    escapeHtml(error?.message || String(error)) + "</p>";
                return;
            }
            ulozeneObjednavky = objednavkyData || [];

            /*
                Pracujeme už pouze s přesným počtem kusů.
                Staré MIN/MAX sloupce se ve výdeji nepoužívají.
            */
            ulozenySklad =
                (data || []).filter(
                    polozka =>
                        Number(polozka.pocet || 0) > 0
                );

            zobrazSklad();
        }


        /*
            ZOBRAZENÍ SKLADU
        */

        function zobrazSklad() {

            const seznam =
                document.getElementById("seznam");

            const hledanaTavba =
                document
                    .getElementById("hledatTavbu")
                    .value
                    .trim()
                    .toLowerCase();

            let filtrovanySklad = ulozenySklad;

            if (hledanaTavba !== "") {

                filtrovanySklad =
                    ulozenySklad.filter(
                        polozka =>
                            String(polozka.tavba || "")
                                .toLowerCase()
                                .includes(hledanaTavba)
                    );
            }

            if (filtrovanySklad.length === 0) {

                seznam.innerHTML =
                    "<p>Žádný materiál nebyl nalezen.</p>";

                zobrazeneTavby = [];
                return;
            }

            /*
                Hlavní skupina:
                materiál + druh + rozměr.

                Jednotlivé příjmy stejné tavby zůstávají
                v databázi samostatně kvůli FIFO, ale na
                obrazovce se jejich přesné zůstatky sečtou.
            */
            const skupiny = {};

            filtrovanySklad.forEach(
                polozka => {

                    const material =
                        String(polozka.material || "Neuvedeno");

                    const druh =
                        String(polozka.druh || "Neuvedeno");

                    const rozmer = polozka.rozmer;

                    const delkaMm = Number(polozka.delka_mm);

                    const hlavniKlic =
                        material + "|" +
                        druh + "|" +
                        String(rozmer) + "|" +
                        String(delkaMm);

                    if (!skupiny[hlavniKlic]) {

                        skupiny[hlavniKlic] = {
                            material: material,
                            druh: druh,
                            rozmer: rozmer,
                            delka_mm: delkaMm,
                            celkem: 0,
                            tavby: {}
                        };
                    }

                    const tavba =
                        String(polozka.tavba || "");

                    if (!skupiny[hlavniKlic].tavby[tavba]) {

                        skupiny[hlavniKlic].tavby[tavba] = {
                            material: material,
                            druh: druh,
                            rozmer: rozmer,
                            tavba: tavba,
                            delka_mm: delkaMm,
                            pocet: 0,
                            objednavky: []
                        };
                    }

                    const tavbaObj =
                        skupiny[hlavniKlic].tavby[tavba];

                    const radekPocet =
                        Number(polozka.pocet || 0);

                    if (radekPocet <= 0) {
                        return;
                    }

                    tavbaObj.pocet += radekPocet;
                    skupiny[hlavniKlic].celkem += radekPocet;


                }
            );

             // Rezervace přiřadíme přesně k materiálu, druhu, rozměru,
             // délce a tavbě; každá objednávka zůstává samostatná.
             const normalizuj = hodnota => String(hodnota ?? "").trim().toLocaleUpperCase("cs");
             const stejnyRozmer = (a, b) => Number(a) === Number(b);
             ulozeneObjednavky.forEach(obj => {
                 Object.values(skupiny).forEach(skupina => {
                     if (normalizuj(skupina.material) !== normalizuj(obj.material) ||
                         normalizuj(skupina.druh) !== normalizuj(obj.druh) ||
                         !stejnyRozmer(skupina.rozmer, obj.rozmer) ||
                         !stejnyRozmer(skupina.delka_mm, obj.delka_mm)) return;
                     Object.values(skupina.tavby).forEach(tavba => {
                         if (normalizuj(tavba.tavba) === normalizuj(obj.tavba) &&
                             Number(obj.obsazeno) > 0) {
                             tavba.objednavky.push(obj);
                         }
                     });
                 });
             });

            const poradiMaterialu = {
                "OCEL": 1,
                "NEREZ": 2,
                "HLINÍK": 3,
                "HLINIK": 3,
                "MOSAZ": 4
            };

            const serazeneSkupiny =
                Object.values(skupiny)
                    .filter(
                        skupina => skupina.celkem > 0
                    )
                    .sort(
                        (a, b) => {

                            const materialA =
                                String(a.material || "")
                                    .trim()
                                    .toUpperCase();

                            const materialB =
                                String(b.material || "")
                                    .trim()
                                    .toUpperCase();

                            const poradiA =
                                poradiMaterialu[materialA] ?? 999;

                            const poradiB =
                                poradiMaterialu[materialB] ?? 999;

                            if (poradiA !== poradiB) {
                                return poradiA - poradiB;
                            }

                            const material =
                                materialA.localeCompare(
                                    materialB,
                                    "cs"
                                );

                            if (material !== 0) {
                                return material;
                            }

                            const druh =
                                String(a.druh)
                                    .localeCompare(
                                        String(b.druh),
                                        "cs"
                                    );

                            if (druh !== 0) {
                                return druh;
                            }

                            return (
                                Number(a.rozmer) -
                                Number(b.rozmer)
                            );
                        }
                    );

            zobrazeneTavby = [];
            seznam.innerHTML = "";

            serazeneSkupiny.forEach(
                skupina => {

                    /*
                        Tavby zobrazujeme v pořadí
                        nejstaršího příjmu.
                    */
                    const tavby =
                        Object.values(skupina.tavby)
                            .filter(tavba => tavba.pocet > 0)
                            .sort((a, b) =>
                                String(a.tavba).localeCompare(String(b.tavba), "cs")
                            );

                    let htmlAtesty = "";

                    tavby.forEach(
                        tavba => {

                            const index =
                                zobrazeneTavby.length;

                            zobrazeneTavby.push(tavba);

                            const trida =
                                tridaPoctu(tavba.pocet);

                             const obsazeneRadky = tavba.objednavky
                                 .sort((a, b) => String(a.objednavka).localeCompare(String(b.objednavka), "cs"))
                                 .map(obj => `<div class="obsazeno-radek"><span>${escapeHtml(obj.objednavka)}</span><strong>${Number(obj.obsazeno)} ks</strong></div>`)
                                 .join("");

                            htmlAtesty += `

                                <div
                                    class="atest"
                                    id="atest${index}"
                                >

                                    <h3>
                                        Tavba:
                                        <span class="cislo-tavby">
                                            ${escapeHtml(tavba.tavba)}
                                        </span>
                                    </h3>

                                    <p>
                                        Na skladě:
                                        <span class="${trida}">
                                            ${tavba.pocet} ks
                                        </span>
                                    </p>

                                    ${obsazeneRadky ? `<div class="obsazeno-seznam"><div class="obsazeno-nadpis">Obsazeno podle objednávek:</div>${obsazeneRadky}</div>` : ""}

                                    <br>

                                    <label>
                                        Kolik kusů odebrat?
                                    </label>

                                    <br><br>

                                    <input
                                        type="number"
                                        id="odebrat${index}"
                                        min="1"
                                        max="${tavba.pocet}"
                                        step="1"
                                        inputmode="numeric"
                                        placeholder="např. 10"
                                    >

                                    <br><br>

                                    <label>
                                        Objednávka
                                    </label>

                                    <br><br>

                                    <input
                                        type="text"
                                        id="objednavka${index}"
                                        placeholder="např. 123/ABC"
                                    >

                                    <br><br>

                                    <label>
                                        Kolik kusů zbývá do konce zakázky?
                                    </label>

                                    <br><br>

                                    <input
                                        type="number"
                                        id="zbyvaZakazka${index}"
                                        min="0"
                                        step="1"
                                        inputmode="numeric"
                                        placeholder="např. 200 nebo 0"
                                    >

                                    <br>

                                    <button
                                        id="tlacitko${index}"
                                        onclick="odebrat(${index})"
                                    >
                                        ➖ ODEBRAT
                                    </button>

                                    <div
                                        class="chyba"
                                        id="chyba${index}"
                                    ></div>

                                </div>
                            `;
                        }
                    );

                    const automatickyOtevrit =
                        hledanaTavba !== ""
                            ? "open"
                            : "";

                    const rozmerText =
                        skupina.rozmer == null
                            ? "Neuvedeno"
                            : escapeHtml(skupina.rozmer) + " mm";

                    seznam.innerHTML += `

                        <details
                            class="skupina"
                            ${automatickyOtevrit}
                        >

                            <summary>

                                <div class="nazev">
                                    ${escapeHtml(skupina.material)}
                                </div>

                                <div class="parametry">
                                    ${escapeHtml(skupina.druh)}
                                    |
                                    ${rozmerText}
                                </div>

                                <div class="celkem">
                                    Celkem:
                                    ${skupina.celkem} ks
                                </div>

                                <div>
                                    ▼ Klikni pro výběr Tavby
                                </div>

                            </summary>

                            ${htmlAtesty}

                        </details>
                    `;
                }
            );

            if (serazeneSkupiny.length === 0) {

                seznam.innerHTML =
                    "<p>Žádný materiál nebyl nalezen.</p>";
            }
        }


        /*
            ODEBRÁNÍ MATERIÁLU
        */

        async function odebrat(index) {

            const tavba =
                zobrazeneTavby[index];


            if (!tavba) {
                return;
            }


            const input =
                document.getElementById(
                    "odebrat" + index
                );


            const objednavkaInput =
                document.getElementById(
                    "objednavka" + index
                );


            const zbyvaInput =
                document.getElementById(
                    "zbyvaZakazka" + index
                );


            const tlacitko =
                document.getElementById(
                    "tlacitko" + index
                );


            const chyba =
                document.getElementById(
                    "chyba" + index
                );


            chyba.textContent =
                "";


            const pocetOdebrat =
                Number(
                    input.value
                );


            const objednavka =
                objednavkaInput
                    .value
                    .trim();


            const zbyvaZakazka =
                Number(zbyvaInput.value);

            if (
                zbyvaInput.value.trim() === "" ||
                !Number.isSafeInteger(zbyvaZakazka) ||
                zbyvaZakazka < 0
            ) {
                chyba.textContent =
                    "Zadej počet kusů zbývajících do konce zakázky (případně 0).";
                return;
            }


            /*
                KONTROLA POČTU
            */

            if (
                !Number.isInteger(
                    pocetOdebrat
                ) ||
                pocetOdebrat <= 0
            ) {

                chyba.textContent =
                    "Zadej správný počet kusů.";

                return;

            }


            /*
                Web nedovolí zadat víc,
                než je přesný aktuální stav tavby.

                Definitivní kontrolu stejně
                provede databázová FIFO funkce.
            */

            if (
                pocetOdebrat >
                Number(
                    tavba.pocet
                )
            ) {

                chyba.textContent =
                    "Nelze odebrat více kusů, než je aktuálně na skladě.";

                return;

            }


            /*
                ZABLOKUJEME OVLÁDÁNÍ,
                ABY NEŠLO KLIKNOUT 2×.
            */

            input.disabled =
                true;

            objednavkaInput.disabled =
                true;

            zbyvaInput.disabled =
                true;

            tlacitko.disabled =
                true;

            tlacitko.innerText =
                "UKLÁDÁM...";


            /*
                FIFO FUNKCE V SUPABASE
            */

            const { error } =
                await supabaseClient
                    .rpc(
                        "odebrat_material_fifo",
                        {

                            p_material:
                                String(
                                    tavba.material
                                ),

                            p_druh:
                                String(
                                    tavba.druh
                                ),

                            p_rozmer:
                                Number(
                                    tavba.rozmer
                                ),

                            p_tavba:
                                String(
                                    tavba.tavba
                                ),

                            p_delka_mm:
                                Number(
                                    tavba.delka_mm
                                ),

                            p_pocet:
                                pocetOdebrat,

                            p_objednavka:
                                objednavka || null,

                            p_obsazeno:
                                zbyvaZakazka

                        }
                    );


            if (error) {

                const zprava =
                    String(
                        error.message || ""
                    );


                input.disabled =
                    false;

                objednavkaInput.disabled =
                    false;

                zbyvaInput.disabled =
                    false;

                tlacitko.disabled =
                    false;

                tlacitko.innerText =
                    "➖ ODEBRAT";
                chyba.textContent =
                    "Odebrání se nepodařilo: " +
                    zprava;


                return;

            }


            /*
                ÚSPĚCH

                Znovu načteme aktuální sklad.
                Díky tomu se počet na obrazovce
                okamžitě přepíše.
            */

            await nactiSklad();

        }




        zkontrolujPrihlaseni();

    </script>

</body>
</html>
