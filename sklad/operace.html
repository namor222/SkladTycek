<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operace materiálu</title>
<link rel="icon" href="./favicon.ico?v=3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{display:none;margin:0;background:#f4f7fb;color:#071a38;font-family:Arial,Helvetica,sans-serif;padding:24px}
main{max-width:1450px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px;border-bottom:1px solid #dfe7f0;padding-bottom:16px}h1{margin:0;font-size:28px}
.back{border:1px solid #d6e0eb;border-radius:10px;background:#fff;padding:12px 18px;text-decoration:none;color:#071a38;font-weight:800}
.panel{background:#fff;border:1px solid #dfe7f0;border-radius:12px;margin-bottom:22px;overflow:hidden}
.panel h2{margin:0;background:#edf2f7;border-bottom:1px solid #dfe7f0;padding:14px 18px;font-size:19px}
.content{padding:18px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1060px;font-size:12px}
th{background:#edf2f7;text-align:left;color:#52667f;font-size:10px;padding:12px 8px}td{padding:12px 8px;border-bottom:1px solid #e9eef4;vertical-align:top;overflow-wrap:anywhere}
.tavba{color:#0877e8;font-weight:800}.obsazeno{color:#ff7600;font-weight:900}.pocet-malo{color:#ef3737;font-weight:900}.pocet-stred{color:#f28a00;font-weight:900}.pocet-ok{color:#08aa43;font-weight:900}
form{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:12px 0;padding:12px;border:1px solid #e0e7f0;border-radius:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800}input{min-width:160px;padding:11px;border:1px solid #becbda;border-radius:8px;font:inherit}
button{background:#1469b8;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}
.muted{color:#62748a}.status{padding:10px 0;font-weight:700}.history-table{min-width:1100px}
@media(max-width:700px){body{padding:12px}h1{font-size:21px}form{align-items:stretch}label,input,button{width:100%}}
</style></head><body><main><header><h1 id="titulek">Operace materiálu</h1><a class="back" href="stavpodrobnější.html">← ZPĚT</a></header>
<div id="zprava" class="status"></div>
<section class="panel"><h2>Podrobný stav materiálu</h2><div class="table-wrap" id="stav"></div></section>
<section class="panel"><h2>Obsazené průvodky</h2><div class="content"><div id="pruvodky"></div><h3>Přidat novou obsazenou průvodku</h3><form id="nova"><label>PRŮVODKA<input name="pruvodka" required maxlength="150"></label><label>OBSAZENO<input name="obsazeno" type="number" min="0" step="1" required></label><button type="submit">PŘIDAT PRŮVODKU</button></form></div></section>
<section class="panel"><h2>Historie materiálu</h2><div class="table-wrap" id="historie"></div></section>
</main><script>
        const SUPABASE_URL = "https://gmawlmsizglrnjmjegmx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        function otevriDatabaziProhlizece() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("kovohladil-prohlizec", 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains("klice")) {
                        db.createObjectStore("klice");
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function nactiExistujiciKlic() {
            if (!window.isSecureContext || !crypto.subtle || !window.indexedDB) {
                throw new Error("Prohlížeč nepodporuje bezpečné ověření.");
            }
            const db = await otevriDatabaziProhlizece();
            try {
                const par = await new Promise((resolve, reject) => {
                    const tx = db.transaction("klice", "readonly");
                    const request = tx.objectStore("klice").get("identita");
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                });
                if (!par?.privateKey || !par?.publicKey) {
                    throw new Error("V tomto prohlížeči není uložen schválený klíč.");
                }
                const jwk = await crypto.subtle.exportKey("jwk", par.publicKey);
                return {
                    par,
                    verejnyKlic: { kty: "EC", crv: "P-256", x: jwk.x, y: jwk.y }
                };
            } finally {
                db.close();
            }
        }

        function kodujBase64url(buffer) {
            let text = "";
            for (const byte of new Uint8Array(buffer)) text += String.fromCharCode(byte);
            return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        async function zavolejSchvalovani(body) {
            const { data, error } = await supabaseClient.functions.invoke(
                "schvalovani-prohlizecu", { body }
            );
            if (error) throw error;
            if (data?.chyba) throw new Error(data.chyba);
            return data;
        }

        async function overSchvalenyProhlizec() {
            const { par, verejnyKlic } = await nactiExistujiciKlic();
            const vyzva = await zavolejSchvalovani({
                akce: "vyzva",
                verejny_klic: verejnyKlic
            });
            if (typeof vyzva?.vyzva !== "string" || !vyzva?.vyzva_id) {
                throw new Error("Server nevrátil platnou výzvu.");
            }
            const podpis = await crypto.subtle.sign(
                { name: "ECDSA", hash: "SHA-256" },
                par.privateKey,
                new TextEncoder().encode(vyzva.vyzva)
            );
            const vysledek = await zavolejSchvalovani({
                akce: "overit",
                verejny_klic: verejnyKlic,
                vyzva_id: vyzva.vyzva_id,
                podpis: kodujBase64url(podpis)
            });
            if (vysledek?.overeno !== true) {
                throw new Error("Prohlížeč není schválený.");
            }
        }




        const sloupce = [
            ["smkh", "SMKH"],
            ["en_wnr", "EN / WNR"],
            ["material", "MATERIÁL"],
            ["druh", "DRUH"],
            ["rozmer", "ROZMĚR"],
            ["tavba", "TAVBA"],
            ["jakost", "JAKOST"],
            ["tolerance", "TOLERANCE"],
            ["pocet_zbyva", "POČET(3m)"],
            ["kg_zbyva", "VÁHA"],
            ["hodnota_skladu_kc", "CENA"],
            ["obsazeno", "OBSAZENO"],
            ["material_id", "ID MATERIÁLU"]
        ];

        // Podepsane cteni podrobneho stavu, rezervaci a delek pres sklad-bezpecny.
        async function nactiPodrobnyStavBezpecne(session) {
            const { par, verejnyKlic } = await nactiExistujiciKlic();
            const headers = {
                Authorization: `Bearer ${session.access_token}`,
                apikey: SUPABASE_KEY,
                "Content-Type": "application/json"
            };
            const base = `${SUPABASE_URL}/functions/v1/`;
            const vyzvaResponse = await fetch(base + "schvalovani-prohlizecu", {
                method: "POST", headers,
                body: JSON.stringify({ akce: "vyzva", verejny_klic: verejnyKlic })
            });
            const vyzva = await vyzvaResponse.json();
            if (!vyzvaResponse.ok || !vyzva?.vyzva || !vyzva?.vyzva_id) {
                throw new Error(vyzva?.chyba || "Nepodařilo se získat bezpečnostní výzvu.");
            }
            const prikaz = {
                akce: "cteni-stavu-podrobnejsi",
                metoda: "POST",
                cesta: "/functions/v1/sklad-bezpecny",
                parametry: null
            };
            const digest = await crypto.subtle.digest(
                "SHA-256", new TextEncoder().encode(JSON.stringify(prikaz))
            );
            const otisk = [...new Uint8Array(digest)]
                .map(b => b.toString(16).padStart(2, "0")).join("");
            const zprava = `${vyzva.vyzva}:sklad-bezpecny:v2:${otisk}`;
            const podpis = await crypto.subtle.sign(
                { name: "ECDSA", hash: "SHA-256" }, par.privateKey,
                new TextEncoder().encode(zprava)
            );
            const response = await fetch(base + "sklad-bezpecny", {
                method: "POST", headers,
                body: JSON.stringify({
                    ...prikaz, verejny_klic: verejnyKlic,
                    vyzva_id: vyzva.vyzva_id, podpis: kodujBase64url(podpis)
                })
            });
            const vysledek = await response.json();
            if (!response.ok || vysledek?.overeno !== true ||
                !Array.isArray(vysledek.data?.stav) ||
                !Array.isArray(vysledek.data?.rezervace) ||
                !Array.isArray(vysledek.data?.sklad)) {
                throw new Error(vysledek?.chyba || vysledek?.detail || "Načtení podrobnějšího stavu selhalo.");
            }
            return vysledek.data;
        }

const id=Number(new URLSearchParams(location.search).get("id"));
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sklad=[],rezervace=[],detail=null;
const stavEl=document.getElementById("stav"),pruvEl=document.getElementById("pruvodky"),histEl=document.getElementById("historie"),zprava=document.getElementById("zprava");
async function rpc(name,args){const {data,error}=await supabaseClient.rpc(name,args);if(error)throw error;return data;}
function identita(r){return [r.material,r.druh,r.rozmer,r.delka_mm,r.tavba].map(x=>String(x??"").trim().toLocaleUpperCase("cs")).join("|");}
function format(k,v){if(v===null||v===undefined||v==="")return "—";if(k==="hodnota_skladu_kc")return Number(v).toLocaleString("cs-CZ",{minimumFractionDigits:2,maximumFractionDigits:2})+" Kč";if(k==="kg_zbyva")return Number(v).toLocaleString("cs-CZ",{maximumFractionDigits:2})+" kg";return String(v);}
function zobrazStav(){
 const radky=sklad.filter(r=>Number(r.material_id)===id);
 if(!radky.length){stavEl.innerHTML='<p class="content muted">Pro toto ID není ve stavu skladu žádný řádek.</p>';return;}
 stavEl.innerHTML='<table><thead><tr>'+sloupce.map(x=>'<th>'+esc(x[1])+'</th>').join('')+'</tr></thead><tbody>'+radky.map(r=>'<tr>'+sloupce.map(([k])=>{
 let cls=k==="tavba"?"tavba":k==="obsazeno"?"obsazeno":"";
 if(k==="pocet_zbyva"){const n=Number(r[k]);cls=n<=10?"pocet-malo":n<=20?"pocet-stred":"pocet-ok";}
 if(k==="obsazeno"){const matches=rezervace.filter(o=>identita(o)===identita({...r,delka_mm:r.delka_mm??detail.prijem.delka_mm})&&Number(o.obsazeno)>0);return '<td class="obsazeno">'+(matches.length?matches.map(o=>'<div>'+esc(o.pruvodka)+': '+esc(o.obsazeno)+' ks</div>').join(''):'—')+'</td>';}
 return '<td class="'+cls+'">'+esc(format(k,r[k]))+'</td>';
 }).join('')+'</tr>').join('')+'</tbody></table>';
}
function polePruvodky(o){
 return '<form class="uprava" data-id="'+o.id+'"><label>PRŮVODKA<input name="pruvodka" required maxlength="150" value="'+esc(o.pruvodka)+'"></label><label>OBSAZENO<input name="obsazeno" type="number" min="0" step="1" required value="'+esc(o.obsazeno)+'"></label><button type="submit">ULOŽIT ZMĚNU</button></form>';
}
function zobrazPruvodky(){
 const p=detail.prijem;
 const matches=rezervace.filter(o=>identita(o)===identita(p));
 pruvEl.innerHTML=matches.length?matches.map(polePruvodky).join(''):'<p class="muted">Zatím není evidovaná žádná obsazená průvodka.</p>';
 pruvEl.querySelectorAll('form.uprava').forEach(f=>f.addEventListener('submit',uloz));
}
function zobrazHistorii(){
 const hs=detail.historie;
 const keys=['id','datum','akce','osobni_cislo','material','druh','rozmer','tavba','pocet','pruvodka','jakost','tolerance','nazev_z_dodaku','cislo_dodaciho_listu','hmotnost_kg','dodavatel','stav','cena_za_kg','cena_za_dopravu'];
 histEl.innerHTML=hs.length?'<table class="history-table"><thead><tr>'+keys.map(k=>'<th>'+esc(k.toUpperCase().replaceAll('_',' '))+'</th>').join('')+'</tr></thead><tbody>'+hs.map(h=>'<tr>'+keys.map(k=>'<td>'+esc(k==="datum"&&h[k]?new Date(h[k]).toLocaleString("cs-CZ"):format(k,h[k]))+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="content muted">Žádná historie tohoto ID.</p>';
}
async function obnov(){
 const d=await rpc("operace_detail_materialu",{p_material_id:id});
 detail=d;
 const r=await rpc("operace_seznam_obsazeni",{p_material_id:id});
 rezervace=r;
 zobrazStav();zobrazPruvodky();zobrazHistorii();
}
async function uloz(e){
 e.preventDefault();const f=e.currentTarget,btn=f.querySelector('button');
 const pr=f.elements.pruvodka.value.trim(),obs=Number(f.elements.obsazeno.value);
 if(!pr||pr.length>150||!Number.isSafeInteger(obs)||obs<0){zprava.textContent="Vyplň platnou průvodku a nezáporné celé množství.";return;}
 if(!confirm("Uložit průvodku "+pr+" s obsazením "+obs+" ks?"))return;
 btn.disabled=true;zprava.textContent="Ukládám...";
 try{await rpc("operace_ulozit_obsazeni",{p_material_id:id,p_pruvodka_id:f.classList.contains("uprava")?Number(f.dataset.id):null,p_pruvodka:pr,p_obsazeno:obs});await obnov();if(f.id==="nova")f.reset();zprava.textContent="Průvodka byla uložena.";}
 catch(err){zprava.textContent="Uložení selhalo: "+err.message;}finally{btn.disabled=false;}
}
async function spustit(){
 try{
 if(!Number.isSafeInteger(id)||id<1)throw Error("Neplatné ID materiálu.");
 const {data:s,error:e}=await supabaseClient.auth.getSession();if(e||!s.session){location.replace("../login.html");return;}
 const {data:u,error:ue}=await supabaseClient.auth.getUser();if(ue||u.user?.id!==s.session.user.id){location.replace("../login.html");return;}
 await overSchvalenyProhlizec();
 const {data:role,error:re}=await supabaseClient.from("uzivatele").select("role").eq("user_id",u.user.id).maybeSingle();
 if(re||role?.role!=="vedeni"){location.replace("material.html");return;}
 document.body.style.display="block";document.getElementById("titulek").textContent="Materiál ID "+id;
 zprava.textContent="Načítám...";
 const [stavData,detailData,obsData]=await Promise.all([nactiPodrobnyStavBezpecne(s.session),rpc("operace_detail_materialu",{p_material_id:id}),rpc("operace_seznam_obsazeni",{p_material_id:id})]);
 sklad=stavData.stav;detail=detailData;rezervace=obsData;zobrazStav();zobrazPruvodky();zobrazHistorii();zprava.textContent="";
 }catch(err){document.body.style.display="block";zprava.textContent="Načtení selhalo: "+err.message;}
}
document.getElementById("nova").addEventListener("submit",uloz);
spustit();
</script></body></html>
