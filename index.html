<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>KOVOHLADIL | Firemní systém</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================================================
           ZÁKLAD
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        body {
            display: none;

            background: #080808;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================================
           POZADÍ
        ========================================================= */

        .stage {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background-image: url("pozadi.png");
            background-repeat: no-repeat;

            /*
                Fotografie vyplní celou obrazovku.
                Nebudou vznikat prázdné pásy.
            */
            background-size: cover;
            background-position: center center;

            user-select: none;
        }


        /* =========================================================
           ZÁKLADNÍ VZHLED TLAČÍTEK

           STEJNÝ STYL JAKO LOGIN:
           šedá -> černá
        ========================================================= */

        .system-button {
            position: absolute;

            display: flex;
            align-items: center;

            border:

                2px solid
                rgba(255, 255, 255, 0.92);

            border-radius: 14px;

            background:

                linear-gradient(
                    105deg,

                    #d8d8d8 0%,
                    #c4c4c4 15%,
                    #969696 28%,
                    #555555 45%,
                    #282828 63%,
                    #111111 80%,
                    #050505 100%
                );

            box-shadow:

                0 5px 15px
                rgba(0, 0, 0, 0.38),

                inset 0 1px 0
                rgba(255, 255, 255, 0.18);

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-weight: 900;

            text-decoration: none;

            text-transform: uppercase;

            text-shadow:

                0 2px 2px
                rgba(0, 0, 0, 0.9),

                0 0 2px
                rgba(0, 0, 0, 0.8);

            cursor: pointer;

            transition:
                transform 0.15s ease,
                filter 0.15s ease,
                box-shadow 0.15s ease;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
           HOVER
        ========================================================= */

        .system-button:hover {

            filter: brightness(1.08);

            box-shadow:

                0 8px 20px
                rgba(0, 0, 0, 0.45),

                inset 0 1px 0
                rgba(255, 255, 255, 0.28);

        }


        .system-button:active {

            filter: brightness(0.92);

        }


        .system-button:focus-visible {

            outline:
                2px solid white;

            outline-offset:
                4px;

        }


        /* =========================================================
           SKLAD MATERIÁLU
           PC
        ========================================================= */

        .sklad-button {

            left: 50%;

            /*
                Pozice hlavního tlačítka.
                Tuto hodnotu můžeme následně
                přesně doladit podle screenshotu.
            */
            top: 59%;

            transform:
                translateX(-50%);

            width:
                min(820px, 52vw);

            height: 105px;

            padding:
                0 32px;

        }


        .sklad-button:hover {

            transform:
                translateX(-50%)
                translateY(-2px);

        }


        .sklad-button:active {

            transform:
                translateX(-50%)
                translateY(1px);

        }


        /* =========================================================
           LEVÁ IKONA SKLADU
        ========================================================= */

        .warehouse-section {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            flex:
                0 0 105px;

            height: 70%;

            margin-right: 30px;

            border-right:

                2px solid
                rgba(255, 255, 255, 0.72);

        }


        /*
            Jednoduchá ikona tří skladových bloků.
            Není potřeba žádný obrázek.
        */

        .warehouse-icon {

            position: relative;

            width: 58px;
            height: 58px;

        }


        .warehouse-box {

            position: absolute;

            width: 29px;
            height: 29px;

            border:
                2px solid white;

            border-radius:
                3px;

            background:

                linear-gradient(
                    135deg,
                    #f5f5f5,
                    #555555 48%,
                    #111111
                );

            box-shadow:

                inset 0 0 4px
                rgba(255,255,255,0.55),

                0 2px 4px
                rgba(0,0,0,0.45);

        }


        .warehouse-box.one {

            top: 0;
            left: 15px;

        }


        .warehouse-box.two {

            bottom: 0;
            left: 0;

        }


        .warehouse-box.three {

            bottom: 0;
            right: 0;

        }


        /* =========================================================
           TEXT SKLAD MATERIÁLU
        ========================================================= */

        .sklad-text {

            flex: 1;

            text-align: center;

            font-size:

                clamp(
                    26px,
                    2.2vw,
                    42px
                );

            font-weight: 900;

            letter-spacing:
                1px;

            white-space:
                nowrap;

        }


        /* =========================================================
           ŠIPKA
        ========================================================= */

        .arrow {

            display: flex;

            align-items: center;

            justify-content: center;

            flex:
                0 0 65px;

            margin-left: 20px;

            font-size: 65px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-weight: 300;

            color: white;

            line-height: 1;

        }


        /* =========================================================
           ODHLÁSIT
           PC
        ========================================================= */

        .logout-button {

            top: 22px;
            right: 25px;

            width: 205px;
            height: 60px;

            justify-content: center;

            padding:
                0 20px;

            font-size: 18px;

            letter-spacing:
                0.8px;

        }


        .logout-button:hover {

            transform:
                translateY(-2px);

        }


        .logout-button:active {

            transform:
                translateY(1px);

        }


        /* =========================================================
           IKONA ODHLÁŠENÍ
        ========================================================= */

        .logout-icon {

            position: relative;

            width: 26px;
            height: 30px;

            margin-right: 16px;

            border:

                3px solid
                white;

            border-right: 0;

            border-radius:
                4px 0 0 4px;

        }


        .logout-icon::before {

            content: "";

            position: absolute;

            top: 50%;
            left: 8px;

            width: 19px;
            height: 3px;

            background: white;

            transform:
                translateY(-50%);

        }


        .logout-icon::after {

            content: "";

            position: absolute;

            top: 50%;
            right: -14px;

            width: 10px;
            height: 10px;

            border-top:
                3px solid white;

            border-right:
                3px solid white;

            transform:

                translateY(-50%)
                rotate(45deg);

        }


        /* =========================================================
           MENŠÍ PC / TABLET
        ========================================================= */

        @media
        (min-width: 701px)
        and
        (max-width: 1100px) {

            .sklad-button {

                width: 62vw;

                height: 92px;

                top: 60%;

                padding:
                    0 24px;

            }


            .warehouse-section {

                flex-basis:
                    90px;

                margin-right:
                    22px;

            }


            .warehouse-icon {

                transform:
                    scale(0.85);

            }


            .sklad-text {

                font-size:

                    clamp(
                        23px,
                        3vw,
                        34px
                    );

            }


            .arrow {

                flex-basis:
                    50px;

                font-size:
                    52px;

            }


            .logout-button {

                width:
                    180px;

                height:
                    54px;

                font-size:
                    16px;

            }

        }


        /* =========================================================
           MOBIL NA VÝŠKU
        ========================================================= */

        @media
        (max-width: 700px)
        and
        (orientation: portrait) {

            html,
            body {

                width: 100%;

                height: 100%;

                min-height:
                    100dvh;

                overflow:
                    hidden;

            }


            /* =====================================================
               MOBILNÍ POZADÍ
            ===================================================== */

            .stage {

                width: 100vw;

                height: 100dvh;

                min-height:
                    100dvh;

                background-image:
                    url("pozadi-mobil.png");

                background-repeat:
                    no-repeat;

                background-size:
                    cover;

                background-position:
                    center center;

            }


            /* =====================================================
               ODHLÁSIT - MOBIL
            ===================================================== */

            .logout-button {

                top:

                    calc(
                        env(safe-area-inset-top)
                        + 12px
                    );

                right:
                    12px;

                width:
                    145px;

                height:
                    47px;

                padding:
                    0 14px;

                border-radius:
                    12px;

                font-size:
                    14px;

                letter-spacing:
                    0.4px;

            }


            .logout-icon {

                width:
                    20px;

                height:
                    24px;

                margin-right:
                    12px;

                border-width:
                    2px;

            }


            .logout-icon::before {

                width:
                    15px;

                height:
                    2px;

                left:
                    6px;

            }


            .logout-icon::after {

                width:
                    8px;

                height:
                    8px;

                right:
                    -10px;

                border-top-width:
                    2px;

                border-right-width:
                    2px;

            }


            /* =====================================================
               SKLAD - MOBIL
            ===================================================== */

            .sklad-button {

                left: 50%;

                top: 68%;

                transform:
                    translateX(-50%);

                width:

                    calc(
                        100% - 28px
                    );

                max-width:
                    520px;

                height:
                    86px;

                padding:
                    0 16px;

                border-radius:
                    14px;

            }


            .sklad-button:hover {

                transform:
                    translateX(-50%);

            }


            .sklad-button:active {

                transform:

                    translateX(-50%)
                    scale(0.98);

            }


            .warehouse-section {

                flex:
                    0 0 70px;

                height:
                    64%;

                margin-right:
                    14px;

            }


            .warehouse-icon {

                transform:
                    scale(0.78);

            }


            .sklad-text {

                font-size:

                    clamp(
                        17px,
                        5.2vw,
                        27px
                    );

                letter-spacing:
                    0.3px;

            }


            .arrow {

                flex:
                    0 0 35px;

                margin-left:
                    8px;

                font-size:
                    44px;

            }


            /*
                Na telefonu vypneme klasický
                desktopový hover.
            */

            .system-button:hover {

                filter:
                    none;

                box-shadow:

                    0 5px 15px
                    rgba(0, 0, 0, 0.38),

                    inset 0 1px 0
                    rgba(255, 255, 255, 0.18);

            }

        }


        /* =========================================================
           MALÉ MOBILY
        ========================================================= */

        @media
        (max-width: 430px)
        and
        (orientation: portrait) {

            .logout-button {

                top:

                    calc(
                        env(safe-area-inset-top)
                        + 9px
                    );

                right:
                    9px;

                width:
                    132px;

                height:
                    43px;

                font-size:
                    13px;

            }


            .sklad-button {

                top:
                    68%;

                width:

                    calc(
                        100% - 18px
                    );

                height:
                    78px;

                padding:
                    0 11px;

                border-radius:
                    12px;

            }


            .warehouse-section {

                flex-basis:
                    58px;

                margin-right:
                    9px;

            }


            .warehouse-icon {

                transform:
                    scale(0.66);

            }


            .sklad-text {

                font-size:

                    clamp(
                        16px,
                        5vw,
                        22px
                    );

            }


            .arrow {

                flex-basis:
                    27px;

                margin-left:
                    5px;

                font-size:
                    36px;

            }

        }


        /* =========================================================
           MOBIL NA ŠÍŘKU
        ========================================================= */

        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            .stage {

                width:
                    100vw;

                height:
                    100dvh;

                background-image:
                    url("pozadi.png");

                background-repeat:
                    no-repeat;

                background-size:
                    cover;

                background-position:
                    center center;

            }


            .logout-button {

                top:
                    9px;

                right:
                    10px;

                width:
                    150px;

                height:
                    44px;

                font-size:
                    14px;

                border-radius:
                    11px;

            }


            .sklad-button {

                left:
                    50%;

                top:
                    61%;

                transform:
                    translateX(-50%);

                width:
                    54%;

                min-width:
                    400px;

                height:
                    72px;

                border-radius:
                    12px;

            }


            .sklad-button:hover {

                transform:
                    translateX(-50%);

            }


            .warehouse-section {

                flex-basis:
                    70px;

                height:
                    55px;

                margin-right:
                    15px;

            }


            .warehouse-icon {

                transform:
                    scale(0.70);

            }


            .sklad-text {

                font-size:

                    clamp(
                        20px,
                        3vw,
                        30px
                    );

            }


            .arrow {

                font-size:
                    40px;

            }

        }

    </style>

</head>


<body>


    <main
        class="stage"
        aria-label="KovoHladil firemní systém"
    >


        <!-- =====================================================
             ODHLÁSIT
        ====================================================== -->

        <button
            type="button"
            class="system-button logout-button"
            onclick="odhlasit()"
            aria-label="Odhlásit"
        >

            <span
                class="logout-icon"
                aria-hidden="true"
            ></span>

            <span>
                ODHLÁSIT
            </span>

        </button>



        <!-- =====================================================
             SKLAD MATERIÁLU
        ====================================================== -->

        <a
            href="sklad/material.html"
            class="system-button sklad-button"
            aria-label="Sklad materiálu"
        >


            <!-- IKONA -->

            <span
                class="warehouse-section"
                aria-hidden="true"
            >

                <span class="warehouse-icon">

                    <span
                        class="warehouse-box one"
                    ></span>

                    <span
                        class="warehouse-box two"
                    ></span>

                    <span
                        class="warehouse-box three"
                    ></span>

                </span>

            </span>



            <!-- TEXT -->

            <span class="sklad-text">

                SKLAD MATERIÁLU

            </span>



            <!-- ŠIPKA -->

            <span
                class="arrow"
                aria-hidden="true"
            >

                ›

            </span>


        </a>


    </main>



    <script>

        /* =========================================================
           SUPABASE
        ========================================================= */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =========================================================
           KONTROLA PŘIHLÁŠENÍ
        ========================================================= */

        async function zkontrolujPrihlaseni() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            /*
                Pokud uživatel není přihlášen,
                vrátíme ho na login.
            */

            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "login.html"
                );

                return;

            }


            /*
                Stránku zobrazíme až po ověření
                přihlášení.

                Díky tomu se index krátce
                nezobrazí nepřihlášenému uživateli.
            */

            document.body.style.display =
                "block";

        }



        /* =========================================================
           ODHLÁŠENÍ
        ========================================================= */

        async function odhlasit() {

            try {

                await supabaseClient
                    .auth
                    .signOut();

            }

            finally {

                window.location.replace(
                    "login.html"
                );

            }

        }



        /* =========================================================
           SPUŠTĚNÍ
        ========================================================= */

        zkontrolujPrihlaseni();


    </script>


</body>

</html>
