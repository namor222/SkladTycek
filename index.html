<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>KOVOHLADIL | Firemní systém</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================================================
           ZÁKLAD
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        body {
            display: none;

            background: #080808;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================================================
           POZADÍ
        ========================================================= */

        .stage {
            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            overflow: hidden;

            background-image:
                url("pozadi.png");

            background-repeat:
                no-repeat;

            background-size:
                cover;

            background-position:
                center center;

            user-select: none;
        }


        /* =========================================================
           SPOLEČNÝ VZHLED TLAČÍTEK

           MODRÁ -> KOV -> ORANŽOVÁ
        ========================================================= */

        .system-button {
            position: absolute;

            display: flex;
            align-items: center;

            border:
                2px solid
                rgba(235, 245, 250, 0.82);

            border-radius:
                15px;

            background:
                linear-gradient(
                    105deg,

                    rgba(39, 151, 218, 0.94) 0%,

                    rgba(55, 126, 169, 0.92) 17%,

                    rgba(61, 83, 96, 0.94) 35%,

                    rgba(43, 45, 48, 0.97) 53%,

                    rgba(67, 49, 42, 0.96) 70%,

                    rgba(126, 65, 28, 0.96) 86%,

                    rgba(159, 75, 24, 0.97) 100%
                );

            box-shadow:
                0 7px 18px rgba(0, 0, 0, 0.45),

                inset 0 1px 0
                rgba(255, 255, 255, 0.38),

                inset 0 -1px 0
                rgba(0, 0, 0, 0.35);

            color:
                #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-weight:
                900;

            text-decoration:
                none;

            text-transform:
                uppercase;

            text-shadow:
                0 2px 3px
                rgba(0, 0, 0, 0.95),

                0 0 3px
                rgba(0, 0, 0, 0.70);

            cursor:
                pointer;

            overflow:
                hidden;

            transition:
                transform 0.18s ease,
                filter 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;

            -webkit-tap-highlight-color:
                transparent;
        }


        /* =========================================================
           KOVOVÝ ODLESK
        ========================================================= */

        .system-button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -32%;

            width: 45%;
            height: 100%;

            background:
                linear-gradient(
                    110deg,

                    transparent 0%,

                    rgba(
                        255,
                        255,
                        255,
                        0.05
                    ) 30%,

                    rgba(
                        255,
                        255,
                        255,
                        0.22
                    ) 50%,

                    rgba(
                        255,
                        255,
                        255,
                        0.05
                    ) 70%,

                    transparent 100%
                );

            transform:
                skewX(-20deg);

            pointer-events:
                none;

            transition:
                left 0.50s ease;
        }


        .system-button > * {
            position: relative;

            z-index: 2;
        }


        /* =========================================================
           HOVER
        ========================================================= */

        .system-button:hover {
            filter:
                brightness(1.12)
                saturate(1.08);

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            box-shadow:
                0 11px 27px
                rgba(0, 0, 0, 0.52),

                -5px 0 18px
                rgba(20, 155, 255, 0.25),

                5px 0 18px
                rgba(255, 120, 25, 0.22),

                inset 0 1px 0
                rgba(255, 255, 255, 0.48);
        }


        .system-button:hover::before {
            left: 100%;
        }


        .system-button:active {
            filter:
                brightness(0.94);
        }


        .system-button:focus-visible {
            outline:
                2px solid white;

            outline-offset:
                4px;
        }


        /* =========================================================
           SKLAD MATERIÁLU - PC
        ========================================================= */

        .sklad-button {
            left: 50%;
            top: 59%;

            transform:
                translateX(-50%);

            width:
                min(820px, 52vw);

            height:
                105px;

            padding:
                0 32px;

            /*
                Hlavní tlačítko je trochu výraznější.
            */

            background:
                linear-gradient(
                    105deg,

                    #2797da 0%,

                    #377ea9 17%,

                    #3d5360 35%,

                    #2b2d30 53%,

                    #43312a 70%,

                    #7e411c 86%,

                    #9f4b18 100%
                );

            box-shadow:
                0 9px 23px
                rgba(0, 0, 0, 0.48),

                -5px 0 18px
                rgba(25, 150, 255, 0.12),

                5px 0 18px
                rgba(255, 120, 25, 0.10),

                inset 0 1px 0
                rgba(255, 255, 255, 0.40),

                inset 0 -1px 0
                rgba(0, 0, 0, 0.40);
        }


        .sklad-button:hover {
            transform:
                translateX(-50%)
                translateY(-3px);
        }


        .sklad-button:active {
            transform:
                translateX(-50%)
                translateY(1px)
                scale(0.995);
        }


        /* =========================================================
           IKONA SKLADU
        ========================================================= */

        .warehouse-section {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            flex:
                0 0 105px;

            height:
                70%;

            margin-right:
                30px;

            border-right:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.70
                );
        }


        .warehouse-icon {
            position: relative;

            width:
                58px;

            height:
                58px;
        }


        .warehouse-box {
            position:
                absolute;

            width:
                29px;

            height:
                29px;

            border:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            border-radius:
                4px;

            background:
                linear-gradient(
                    135deg,

                    rgba(
                        115,
                        197,
                        244,
                        0.95
                    ) 0%,

                    rgba(
                        70,
                        94,
                        107,
                        0.95
                    ) 45%,

                    rgba(
                        35,
                        37,
                        40,
                        0.98
                    ) 70%,

                    rgba(
                        170,
                        79,
                        25,
                        0.95
                    ) 100%
                );

            box-shadow:
                inset 0 1px 2px
                rgba(
                    255,
                    255,
                    255,
                    0.35
                ),

                0 2px 5px
                rgba(
                    0,
                    0,
                    0,
                    0.50
                );
        }


        .warehouse-box.one {
            top:
                0;

            left:
                15px;
        }


        .warehouse-box.two {
            bottom:
                0;

            left:
                0;
        }


        .warehouse-box.three {
            bottom:
                0;

            right:
                0;
        }


        /* =========================================================
           TEXT SKLAD MATERIÁLU
        ========================================================= */

        .sklad-text {
            flex:
                1;

            text-align:
                center;

            font-size:
                clamp(
                    26px,
                    2.2vw,
                    42px
                );

            font-weight:
                900;

            letter-spacing:
                1px;

            white-space:
                nowrap;
        }


        /* =========================================================
           ŠIPKA
        ========================================================= */

        .arrow {
            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex:
                0 0 65px;

            margin-left:
                20px;

            font-size:
                65px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-weight:
                300;

            color:
                white;

            line-height:
                1;

            text-shadow:
                0 2px 5px
                rgba(0,0,0,.65);
        }


        /* =========================================================
           ODHLÁSIT - PC
        ========================================================= */

        .logout-button {
            top:
                22px;

            right:
                25px;

            width:
                205px;

            height:
                60px;

            justify-content:
                center;

            padding:
                0 20px;

            font-size:
                18px;

            letter-spacing:
                0.8px;

            /*
                Stejný styl, ale trochu tmavší,
                aby nekonkuroval SKLADU.
            */

            background:
                linear-gradient(
                    105deg,

                    rgba(
                        48,
                        126,
                        174,
                        0.92
                    ) 0%,

                    rgba(
                        50,
                        87,
                        108,
                        0.94
                    ) 25%,

                    rgba(
                        40,
                        43,
                        46,
                        0.97
                    ) 52%,

                    rgba(
                        76,
                        48,
                        34,
                        0.96
                    ) 76%,

                    rgba(
                        137,
                        65,
                        24,
                        0.96
                    ) 100%
                );

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            box-shadow:
                0 6px 16px
                rgba(0, 0, 0, 0.42),

                inset 0 1px 0
                rgba(255,255,255,.27);
        }


        .logout-button:hover {
            transform:
                translateY(-2px);
        }


        .logout-button:active {
            transform:
                translateY(1px);
        }


        /* =========================================================
           IKONA ODHLÁŠENÍ
        ========================================================= */

        .logout-icon {
            position:
                relative;

            width:
                26px;

            height:
                30px;

            margin-right:
                16px;

            border:
                3px solid
                white;

            border-right:
                0;

            border-radius:
                4px 0 0 4px;
        }


        .logout-icon::before {
            content:
                "";

            position:
                absolute;

            top:
                50%;

            left:
                8px;

            width:
                19px;

            height:
                3px;

            background:
                white;

            transform:
                translateY(-50%);
        }


        .logout-icon::after {
            content:
                "";

            position:
                absolute;

            top:
                50%;

            right:
                -14px;

            width:
                10px;

            height:
                10px;

            border-top:
                3px solid
                white;

            border-right:
                3px solid
                white;

            transform:
                translateY(-50%)
                rotate(45deg);
        }


        /* =========================================================
           MENŠÍ PC / TABLET
        ========================================================= */

        @media
        (min-width: 701px)
        and
        (max-width: 1100px) {

            .sklad-button {
                width:
                    62vw;

                height:
                    92px;

                top:
                    60%;

                padding:
                    0 24px;
            }


            .warehouse-section {
                flex-basis:
                    90px;

                margin-right:
                    22px;
            }


            .warehouse-icon {
                transform:
                    scale(0.85);
            }


            .sklad-text {
                font-size:
                    clamp(
                        23px,
                        3vw,
                        34px
                    );
            }


            .arrow {
                flex-basis:
                    50px;

                font-size:
                    52px;
            }


            .logout-button {
                width:
                    180px;

                height:
                    54px;

                font-size:
                    16px;
            }
        }


        /* =========================================================
           MOBIL NA VÝŠKU
        ========================================================= */

        @media
        (max-width: 700px)
        and
        (orientation: portrait) {

            html,
            body {
                width:
                    100%;

                height:
                    100%;

                min-height:
                    100dvh;

                overflow:
                    hidden;
            }


            /* =====================================================
               MOBILNÍ POZADÍ
            ===================================================== */

            .stage {
                width:
                    100vw;

                height:
                    100dvh;

                min-height:
                    100dvh;

                background-image:
                    url("pozadi-mobil.png");

                background-repeat:
                    no-repeat;

                background-size:
                    cover;

                background-position:
                    center center;
            }


            /* =====================================================
               ODHLÁSIT - MOBIL
            ===================================================== */

            .logout-button {
                top:
                    calc(
                        env(safe-area-inset-top)
                        + 12px
                    );

                right:
                    12px;

                width:
                    145px;

                height:
                    47px;

                padding:
                    0 14px;

                border-radius:
                    11px;

                border-width:
                    1.5px;

                font-size:
                    14px;

                letter-spacing:
                    0.4px;
            }


            .logout-icon {
                width:
                    20px;

                height:
                    24px;

                margin-right:
                    12px;

                border-width:
                    2px;
            }


            .logout-icon::before {
                width:
                    15px;

                height:
                    2px;

                left:
                    6px;
            }


            .logout-icon::after {
                width:
                    8px;

                height:
                    8px;

                right:
                    -10px;

                border-top-width:
                    2px;

                border-right-width:
                    2px;
            }


            /* =====================================================
               SKLAD - MOBIL
            ===================================================== */

            .sklad-button {
                left:
                    50%;

                top:
                    68%;

                transform:
                    translateX(-50%);

                width:
                    calc(
                        100% - 28px
                    );

                max-width:
                    520px;

                height:
                    86px;

                padding:
                    0 16px;

                border-radius:
                    14px;

                border-width:
                    1.5px;
            }


            .sklad-button:hover {
                transform:
                    translateX(-50%);
            }


            .sklad-button:active {
                transform:
                    translateX(-50%)
                    scale(0.98);
            }


            .warehouse-section {
                flex:
                    0 0 70px;

                height:
                    64%;

                margin-right:
                    14px;
            }


            .warehouse-icon {
                transform:
                    scale(0.78);
            }


            .sklad-text {
                font-size:
                    clamp(
                        17px,
                        5.2vw,
                        27px
                    );

                letter-spacing:
                    0.3px;
            }


            .arrow {
                flex:
                    0 0 35px;

                margin-left:
                    8px;

                font-size:
                    44px;
            }


            /*
                Na dotykových telefonech nechceme
                klasický desktopový hover.
            */

            .system-button:hover {
                filter:
                    none;
            }


            .system-button:hover::before {
                left:
                    -32%;
            }


            .logout-button:hover {
                transform:
                    none;
            }
        }


        /* =========================================================
           MALÉ MOBILY
        ========================================================= */

        @media
        (max-width: 430px)
        and
        (orientation: portrait) {

            .logout-button {
                top:
                    calc(
                        env(safe-area-inset-top)
                        + 9px
                    );

                right:
                    9px;

                width:
                    132px;

                height:
                    43px;

                font-size:
                    13px;
            }


            .sklad-button {
                top:
                    68%;

                width:
                    calc(
                        100% - 18px
                    );

                height:
                    78px;

                padding:
                    0 11px;

                border-radius:
                    12px;
            }


            .warehouse-section {
                flex-basis:
                    58px;

                margin-right:
                    9px;
            }


            .warehouse-icon {
                transform:
                    scale(0.66);
            }


            .sklad-text {
                font-size:
                    clamp(
                        16px,
                        5vw,
                        22px
                    );
            }


            .arrow {
                flex-basis:
                    27px;

                margin-left:
                    5px;

                font-size:
                    36px;
            }
        }


        /* =========================================================
           MOBIL NA ŠÍŘKU
        ========================================================= */

        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            .stage {
                width:
                    100vw;

                height:
                    100dvh;

                background-image:
                    url("pozadi.png");

                background-repeat:
                    no-repeat;

                background-size:
                    cover;

                background-position:
                    center center;
            }


            .logout-button {
                top:
                    9px;

                right:
                    10px;

                width:
                    150px;

                height:
                    44px;

                font-size:
                    14px;

                border-radius:
                    11px;
            }


            .sklad-button {
                left:
                    50%;

                top:
                    61%;

                transform:
                    translateX(-50%);

                width:
                    54%;

                min-width:
                    400px;

                height:
                    72px;

                border-radius:
                    12px;
            }


            .sklad-button:hover {
                transform:
                    translateX(-50%);
            }


            .warehouse-section {
                flex-basis:
                    70px;

                height:
                    55px;

                margin-right:
                    15px;
            }


            .warehouse-icon {
                transform:
                    scale(0.70);
            }


            .sklad-text {
                font-size:
                    clamp(
                        20px,
                        3vw,
                        30px
                    );
            }


            .arrow {
                font-size:
                    40px;
            }
        }

    </style>

</head>


<body>


    <main
        class="stage"
        aria-label="KovoHladil firemní systém"
    >


        <!-- =====================================================
             ODHLÁSIT
        ====================================================== -->

        <button
            type="button"
            class="system-button logout-button"
            onclick="odhlasit()"
            aria-label="Odhlásit"
        >

            <span
                class="logout-icon"
                aria-hidden="true"
            ></span>

            <span>
                ODHLÁSIT
            </span>

        </button>



        <!-- =====================================================
             SKLAD MATERIÁLU
        ====================================================== -->

        <a
            href="sklad/material.html"
            class="system-button sklad-button"
            aria-label="Sklad materiálu"
        >


            <!-- IKONA -->

            <span
                class="warehouse-section"
                aria-hidden="true"
            >

                <span class="warehouse-icon">

                    <span
                        class="warehouse-box one"
                    ></span>

                    <span
                        class="warehouse-box two"
                    ></span>

                    <span
                        class="warehouse-box three"
                    ></span>

                </span>

            </span>


            <!-- TEXT -->

            <span class="sklad-text">
                SKLAD MATERIÁLU
            </span>


            <!-- ŠIPKA -->

            <span
                class="arrow"
                aria-hidden="true"
            >
                ›
            </span>


        </a>


    </main>



    <script>

        /* =========================================================
           SUPABASE
        ========================================================= */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =========================================================
           KONTROLA PŘIHLÁŠENÍ
        ========================================================= */

        async function zkontrolujPrihlaseni() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "login.html"
                );

                return;
            }


            document.body.style.display =
                "block";

        }



        /* =========================================================
           ODHLÁŠENÍ
        ========================================================= */

        async function odhlasit() {

            try {

                await supabaseClient
                    .auth
                    .signOut();

            }

            finally {

                window.location.replace(
                    "login.html"
                );

            }

        }



        /* =========================================================
           SPUŠTĚNÍ
        ========================================================= */

        zkontrolujPrihlaseni();

    </script>


</body>

</html>
