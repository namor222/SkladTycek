<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>KOVOHLADIL | Firemní systém</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =====================================================
           ZÁKLAD
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        body {
            display: none;

            background: #071725;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           HLAVNÍ OBRAZOVKA - PC
           ===================================================== */

        .stage {
            position: relative;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background-image:
                url("pozadi.png");

            background-position:
                center center;

            background-repeat:
                no-repeat;

            background-size:
                100% 100%;

            user-select: none;
        }


        /* =====================================================
           OBRÁZKOVÁ TLAČÍTKA
           ===================================================== */

        .image-button {
            position: absolute;

            z-index: 10;

            display: block;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

            transition:
                transform 0.16s ease,
                filter 0.16s ease;
        }

        .image-button img {
            display: block;

            width: 100%;
            height: auto;

            margin: 0;
            padding: 0;

            border: 0;

            pointer-events: none;
        }


        /* =====================================================
           SKLAD MATERIÁLU - PC
           ===================================================== */

        .sklad-link {
            left: 50%;
            top: 58.3%;

            width: 48.5%;

            transform:
                translateX(-50%);

            text-decoration: none;
        }

        .sklad-link:hover {
            transform:
                translateX(-50%)
                translateY(-3px)
                scale(1.015);

            filter:
                brightness(1.04);
        }

        .sklad-link:active {
            transform:
                translateX(-50%)
                translateY(1px)
                scale(0.995);
        }


        /* =====================================================
           ODHLÁSIT - PC

           Posunuto více doprava a nahoru.
           ===================================================== */

        .logout-button {
            top: 0.45%;
            right: 0.45%;

            width: 12.3%;
        }

        .logout-button:hover {
            transform:
                translateY(-2px)
                scale(1.025);

            filter:
                brightness(1.08);
        }

        .logout-button:active {
            transform:
                translateY(1px)
                scale(0.98);
        }


        /* =====================================================
           FOCUS
           ===================================================== */

        .image-button:focus-visible {
            outline:
                2px solid #00b9ff;

            outline-offset:
                4px;

            border-radius:
                12px;
        }


        /* =====================================================
           TABLET / MENŠÍ NOTEBOOK
           ===================================================== */

        @media
        (min-width: 701px)
        and
        (max-width: 1000px) {

            .logout-button {
                width: 14%;

                top: 0.45%;
                right: 0.6%;
            }

            .sklad-link {
                width: 53%;
            }
        }


        /* =====================================================
           MOBIL NA VÝŠKU

           Používá:
           pozadi-mobil.png
           ===================================================== */

        @media
        (max-width: 700px)
        and
        (orientation: portrait) {

            html,
            body {
                width: 100%;
                height: 100%;
                min-height: 100dvh;

                overflow: hidden;

                background: #071725;
            }


            /* =============================================
               MOBILNÍ POZADÍ
               ============================================= */

            .stage {
                position: relative;

                width: 100vw;
                height: 100dvh;
                min-height: 100dvh;

                margin: 0;
                padding: 0;

                overflow: hidden;

                background-image:
                    url("pozadi-mobil.png");

                background-repeat:
                    no-repeat;

                background-position:
                    center center;

                background-size:
                    100% 100%;
            }


            /* =============================================
               ODHLÁSIT - MOBIL
               ============================================= */

            .logout-button {
                top:
                    calc(
                        env(safe-area-inset-top)
                        + 1.2%
                    );

                right: 2.2%;

                width: 36%;

                min-width: 125px;
                max-width: 180px;
            }

            .logout-button:hover {
                transform: none;
                filter: none;
            }

            .logout-button:active {
                transform:
                    scale(0.97);
            }


            /* =============================================
               SKLAD MATERIÁLU - MOBIL
               ============================================= */

            .sklad-link {
                left: 50%;

                top: 70%;

                width: 92%;

                max-width: 600px;

                transform:
                    translateX(-50%);
            }

            .sklad-link:hover {
                transform:
                    translateX(-50%);

                filter: none;
            }

            .sklad-link:active {
                transform:
                    translateX(-50%)
                    scale(0.98);
            }
        }


        /* =====================================================
           VELMI MALÝ MOBIL NA VÝŠKU
           ===================================================== */

        @media
        (max-width: 430px)
        and
        (orientation: portrait) {

            .logout-button {
                width: 37%;

                right: 2%;
            }

            .sklad-link {
                width: 94%;

                top: 70%;
            }
        }


        /* =====================================================
           MOBIL NA ŠÍŘKU

           Na šířku používáme PC pozadí.
           ===================================================== */

        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            .stage {
                width: 100vw;
                height: 100dvh;

                background-image:
                    url("pozadi.png");

                background-position:
                    center center;

                background-repeat:
                    no-repeat;

                background-size:
                    100% 100%;
            }


            /* ODHLÁSIT */

            .logout-button {
                top: 0.4%;
                right: 0.5%;

                width: 13%;
            }


            /* SKLAD */

            .sklad-link {
                left: 50%;

                top: 58.3%;

                width: 49%;

                transform:
                    translateX(-50%);
            }
        }

    </style>
</head>


<body>

    <main
        class="stage"
        aria-label="KovoHladil firemní systém"
    >


        <!-- ==================================================
             ODHLÁSIT
             ================================================== -->

        <button
            class="image-button logout-button"
            type="button"
            onclick="odhlasit()"
            aria-label="Odhlásit"
        >

            <img
                src="odhlasit.png"
                alt="ODHLÁSIT"
            >

        </button>


        <!-- ==================================================
             SKLAD MATERIÁLU
             ================================================== -->

        <a
            class="image-button sklad-link"
            href="sklad/material.html"
            aria-label="Sklad materiálu"
        >

            <img
                src="sklad-materialu.png"
                alt="SKLAD MATERIÁLU"
            >

        </a>


    </main>


    <script>

        /* =====================================================
           SUPABASE
           ===================================================== */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           KONTROLA PŘIHLÁŠENÍ
           ===================================================== */

        async function zkontrolujPrihlaseni() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "login.html"
                );

                return;
            }


            /*
             * Uživatel je přihlášen.
             * Teprve teď zobrazíme stránku.
             */

            document.body.style.display =
                "block";
        }


        /* =====================================================
           ODHLÁŠENÍ
           ===================================================== */

        async function odhlasit() {

            await supabaseClient
                .auth
                .signOut();


            window.location.replace(
                "login.html"
            );
        }


        /* =====================================================
           START
           ===================================================== */

        zkontrolujPrihlaseni();

    </script>

</body>
</html>
