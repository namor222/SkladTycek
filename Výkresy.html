<style>
:root{--bg:#f4f7fb;--line:#dfe7f0;--text:#071a38;--blue:#1688f5;--muted:#6f8097}

body{display:none;margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding:24px 28px 38px}
header{width:min(1450px,100%);min-height:74px;margin:0 auto 18px;padding:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
header h1{font-size:32px;font-weight:800;margin:0}
.back{min-height:48px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #d6e0eb;border-radius:10px;background:white;color:var(--text);font-weight:800;font-size:15px;text-decoration:none}

main{width:min(1450px,100%);margin:auto}
.intro{margin:0 0 23px;color:var(--muted);font-size:15px;line-height:1.6}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{--accent:#1688ef;position:relative;display:grid;grid-template-columns:75px 1fr 34px;align-items:center;min-height:112px;padding:19px 22px 19px 27px;background:rgba(255,255,255,.94);border:1px solid #dce4ec;border-radius:9px;box-shadow:0 7px 22px rgba(24,45,72,.09);overflow:hidden;gap:0}

.tile p{font-size:14px;color:var(--muted);line-height:1.45;margin:0}
.tile .arrow{font-size:30px;color:#b7c5d4;justify-self:end}
.status{display:inline-block;margin-top:9px;font-weight:800;font-size:11px;letter-spacing:.04em;color:#6f8097}
@media(max-width:900px){body{padding:12px 10px 28px}header{min-height:58px;margin-bottom:12px}header h1{font-size:21px}.back{min-height:40px;padding:0 12px;font-size:13px}}
@media(max-width:680px){.menu{grid-template-columns:1fr}.tile{grid-template-columns:62px 1fr 22px;padding:16px 15px 16px 20px}.tile .symbol{width:48px;height:48px}.tile svg{width:40px;height:40px}.tile h2{font-size:18px}}
.tile{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}.tile:hover{background:#edf5ff}form{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}input{padding:12px;border:1px solid var(--line);border-radius:8px;max-width:100%}#preview img{max-width:100%;max-height:75vh;object-fit:contain}#preview a{display:inline-flex}button{cursor:pointer}.pdf-preview{display:block;width:100%;height:80vh;min-height:400px;border:1px solid var(--line);border-radius:9px;background:white;margin-bottom:14px}#preview a{margin-right:10px;margin-bottom:8px}</style>

<header><h1>Výkresy</h1><a class="back" href="technologie.html">← ZPĚT</a></header><main><p class="intro">Archiv výrobních výkresů – pouze vedení.</p><p id="info" role="status"></p><section id="list"><section class="menu" id="folders"></section></section><section id="detail" hidden><button class="back" id="backfolder">← Složky</button><h2 id="foldertitle"></h2><div id="preview"></div><form id="upload"><input type="file" id="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><button class="back">Uložit výkres</button></form><p class="intro">Jeden soubor na složku, maximálně 5 MB.</p></section></main>
<script>
const SUPABASE_URL="https://gmawlmsizglrnjmjegmx.supabase.co";
const SUPABASE_KEY="sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
        function otevriDatabaziProhlizece() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("kovohladil-prohlizec", 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains("klice")) {
                        db.createObjectStore("klice");
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function nactiExistujiciKlic() {
            if (!window.isSecureContext || !crypto.subtle || !window.indexedDB) {
                throw new Error("Prohlížeč nepodporuje bezpečné ověření.");
            }
            const db = await otevriDatabaziProhlizece();
            try {
                const par = await new Promise((resolve, reject) => {
                    const tx = db.transaction("klice", "readonly");
                    const request = tx.objectStore("klice").get("identita");
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                });
                if (!par?.privateKey || !par?.publicKey) {
                    throw new Error("V tomto prohlížeči není uložen schválený klíč.");
                }
                const jwk = await crypto.subtle.exportKey("jwk", par.publicKey);
                return {
                    par,
                    verejnyKlic: { kty: "EC", crv: "P-256", x: jwk.x, y: jwk.y }
                };
            } finally {
                db.close();
            }
        }

        function kodujBase64url(buffer) {
            let text = "";
            for (const byte of new Uint8Array(buffer)) text += String.fromCharCode(byte);
            return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        async function zavolejSchvalovani(body) {
            const { data, error } = await supabaseClient.functions.invoke(
                "schvalovani-prohlizecu", { body }
            );
            if (error) throw error;
            if (data?.chyba) throw new Error(data.chyba);
            return data;
        }

        async function overSchvalenyProhlizec() {
            const { par, verejnyKlic } = await nactiExistujiciKlic();
            const vyzva = await zavolejSchvalovani({
                akce: "vyzva",
                verejny_klic: verejnyKlic
            });
            if (typeof vyzva?.vyzva !== "string" || !vyzva?.vyzva_id) {
                throw new Error("Server nevrátil platnou výzvu.");
            }
            const podpis = await crypto.subtle.sign(
                { name: "ECDSA", hash: "SHA-256" },
                par.privateKey,
                new TextEncoder().encode(vyzva.vyzva)
            );
            const vysledek = await zavolejSchvalovani({
                akce: "overit",
                verejny_klic: verejnyKlic,
                vyzva_id: vyzva.vyzva_id,
                podpis: kodujBase64url(podpis)
            });
            if (vysledek?.overeno !== true) {
                throw new Error("Prohlížeč není schválený.");
            }
        }







let current=null,exists=false,blobUrl=null,busy=false;
const el=id=>document.getElementById(id);
async function call(akce,parametry=null){
 const {par,verejnyKlic}=await nactiExistujiciKlic();
 const vyzva=await zavolejSchvalovani({akce:"vyzva",verejny_klic:verejnyKlic});
 const prikaz={akce,metoda:"POST",cesta:"/functions/v1/vykresy-bezpecne",parametry};
 const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(JSON.stringify(prikaz)));
 const otisk=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");
 const podpis=await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},par.privateKey,new TextEncoder().encode(vyzva.vyzva+":vykresy-bezpecne:v2:"+otisk));
 const {data,error}=await supabaseClient.functions.invoke("vykresy-bezpecne",{body:{...prikaz,verejny_klic:verejnyKlic,vyzva_id:vyzva.vyzva_id,podpis:kodujBase64url(podpis)}});
 if(error||data?.overeno!==true)throw new Error("Operace se nezdařila. Zkontrolujte přístup a připojení.");
 return data.data;
}
function clearPreview(){if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=null;el("preview").replaceChildren();}
async function run(fn){if(busy)return;busy=true;el("info").textContent="Načítám…";try{await fn();el("info").textContent="";}catch(e){el("info").textContent=e.message;}finally{busy=false;}}
async function list(){clearPreview();current=null;el("detail").hidden=true;el("list").hidden=false;el("folders").replaceChildren();const rows=await call("seznam");for(const row of rows){const b=document.createElement("button");b.className="tile";b.innerHTML='<div class="symbol"><svg viewBox="0 0 64 64"><path d="M7 17h20l6 7h24v29H7z"/></svg></div><div><h2></h2><p>Výrobní výkres</p></div><span class="arrow">›</span>';b.querySelector("h2").textContent=row.cislo;b.onclick=()=>run(()=>openFolder(row.cislo));el("folders").append(b);}}
async function openFolder(cislo){clearPreview();current=cislo;exists=false;el("upload").hidden=true;el("list").hidden=true;el("detail").hidden=false;el("foldertitle").textContent="Složka "+cislo;el("file").value="";const d=await call("slozka",{cislo});exists=!!d;if(!d)el("preview").textContent="Složka je prázdná.";else{if(!["image/jpeg","image/png","image/webp","application/pdf"].includes(d.mime))throw new Error("Nepodporovaný formát.");blobUrl=URL.createObjectURL(new Blob([Uint8Array.from(atob(d.base64),c=>c.charCodeAt(0))],{type:d.mime}));const a=document.createElement("a");a.href=blobUrl;a.download=cislo+({"image/jpeg":".jpg","image/png":".png","image/webp":".webp","application/pdf":".pdf"}[d.mime]);a.className="back";a.textContent="Stáhnout výkres";if(d.mime.startsWith("image/")){const img=document.createElement("img");img.src=blobUrl;img.alt="Výkres "+cislo;el("preview").append(img,document.createElement("br"));}else{const view=document.createElement("a");view.href=blobUrl;view.target="_blank";view.rel="noopener";view.className="back";view.textContent="Otevřít PDF";const frame=document.createElement("iframe");frame.src=blobUrl;frame.title="Náhled PDF výkresu "+cislo;frame.className="pdf-preview";el("preview").append(frame,view);}el("preview").append(a);}el("upload").hidden=false;el("upload").querySelector("button").textContent=exists?"Nahradit výkres":"Uložit výkres";}
el("backfolder").onclick=()=>run(list);
el("upload").onsubmit=e=>{e.preventDefault();run(async()=>{const file=el("file").files[0];if(!file||file.size>5242880)throw new Error("Maximální velikost je 5 MB.");if(exists&&!confirm("Nahradit stávající výkres ve složce "+current+"?"))return;const bytes=new Uint8Array(await file.arrayBuffer());let binary="";for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));await call("nahrat",{cislo:current,mime:file.type,base64:btoa(binary),nahradit:exists});await openFolder(current);});};
window.addEventListener("pagehide",clearPreview);
supabaseClient.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT"){clearPreview();location.replace("login.html");}});

async function spustit(){
try{
const {data:prihlaseni,error:chybaPrihlaseni}=await supabaseClient.auth.getSession();
if(chybaPrihlaseni||!prihlaseni.session){location.replace("login.html");return;}
const {data:overeny,error:chybaOvereni}=await supabaseClient.auth.getUser();
if(chybaOvereni||!overeny?.user||overeny.user.id!==prihlaseni.session.user.id){location.replace("login.html");return;}
await overSchvalenyProhlizec();
const {data:uzivatel,error:chybaRole}=await supabaseClient.from("uzivatele").select("role").eq("user_id",prihlaseni.session.user.id).maybeSingle();
if(chybaRole||uzivatel?.role!=="vedeni"){location.replace("index.html");return;}
document.body.style.display="block";
await run(list);
}catch(chyba){console.warn("Přístup do technologie zamítnut:",chyba);location.replace("login.html");}
}
spustit();
