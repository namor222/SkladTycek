<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Přidat do skladu</title>

<style>

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f2f2f2;
        margin: 0;
        padding: 20px 15px 30px 15px;
        display: none;
    }

    .hlavicka {
        max-width: 500px;
        margin: 0 auto 25px auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
    }

    .hlavicka h1 {
        margin: 0;
        font-size: 28px;
        text-align: left;
    }

    .zpet {
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        color: #1976d2;
        white-space: nowrap;
    }

    .zpet:hover {
        text-decoration: underline;
    }

    .obsah {
        max-width: 500px;
        margin: auto;
    }

    .skryte {
        display: none;
    }

    button {
        width: 100%;
        padding: 20px;
        margin-bottom: 15px;
        font-size: 22px;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        cursor: pointer;
    }

    input {
        width: 90%;
        padding: 14px;
        margin: 8px 0 15px 0;
        font-size: 20px;
        text-align: center;
        box-sizing: border-box;
    }

    label {
        display: block;
        font-weight: bold;
        font-size: 18px;
        margin-top: 10px;
    }

    .polozka {
        background: white;
        padding: 20px;
        border-radius: 12px;
    }

    .zpusob {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 15px 0 20px 0;
    }

    .zpusob button {
        font-size: 17px;
        padding: 14px 8px;
        background: #e4e4e4;
        margin: 0;
    }

    .zpusob button.aktivni {
        background: #1976d2;
        color: white;
    }

    .vypocet {
        background: #eef6ff;
        border: 2px solid #1976d2;
        border-radius: 12px;
        padding: 15px;
        margin: 10px 0 20px 0;
        text-align: left;
        line-height: 1.6;
    }

    .vypocet strong {
        color: #1976d2;
    }

    .vysledek {
        font-size: 22px;
        font-weight: bold;
        color: #1b8f3a;
    }

    .poznamka {
        font-size: 14px;
        color: #666;
        margin-top: 8px;
    }

    #zprava {
        font-size: 18px;
        font-weight: bold;
        margin-top: 15px;
    }

    @media (max-width: 500px) {

        .hlavicka h1 {
            font-size: 22px;
        }

        .zpet {
            font-size: 16px;
        }

        .zpusob {
            grid-template-columns: 1fr;
        }
    }

</style>

</head>

<body>

<div class="hlavicka">

    <h1>➕ Přidat do skladu</h1>

    <a class="zpet" href="material.html">
        ← ZPĚT
    </a>

</div>


<div class="obsah">

    <!-- MATERIÁL -->

    <div id="materialBox">

        <h2>1. Materiál</h2>

        <button onclick="vyberMaterial('Ocel')">
            Ocel
        </button>

        <button onclick="vyberMaterial('Nerez')">
            Nerez
        </button>

        <button onclick="vyberMaterial('Hliník')">
            Hliník
        </button>

        <button onclick="vyberMaterial('Mosaz')">
            Mosaz
        </button>

    </div>


    <!-- DRUH -->

    <div id="druhBox" class="skryte">

        <h2>2. Druh</h2>

        <button onclick="vyberDruh('Kulatina')">
            Kulatina
        </button>

        <button onclick="vyberDruh('Šestihran')">
            Šestihran
        </button>

    </div>


    <!-- ÚDAJE -->

    <div id="udajeBox" class="skryte">

        <div class="polozka">

            <h2>3. Údaje o materiálu</h2>


            <label>Rozměr h9 (mm)</label>

            <input
                type="number"
                id="rozmer"
                placeholder="např. 20"
                min="0"
                step="0.01"
                oninput="prepocitejKg()"
            >


            <label>Délka jedné tyče (mm)</label>

            <input
                type="number"
                id="delka"
                placeholder="např. 3000"
                min="1"
                oninput="prepocitejKg()"
            >


            <label>Tavba</label>

            <input
                type="number"
                id="atest"
                placeholder="např. 11112"
                min="0"
            >


            <label>Způsob zadání množství</label>

            <div class="zpusob">

                <button
                    type="button"
                    id="tlacitkoKusy"
                    class="aktivni"
                    onclick="nastavZpusob('kusy')"
                >
                    🔢 POČET KUSŮ
                </button>

                <button
                    type="button"
                    id="tlacitkoKg"
                    onclick="nastavZpusob('kg')"
                >
                    ⚖️ HMOTNOST KG
                </button>

            </div>


            <!-- PŘÍMÉ ZADÁNÍ KUSŮ -->

            <div id="kusyBox">

                <label>Počet kusů</label>

                <input
                    type="number"
                    id="pocet"
                    placeholder="např. 50"
                    min="1"
                >

            </div>


            <!-- ZADÁNÍ PODLE KG -->

            <div
                id="kgBox"
                class="skryte"
            >

                <label>Celková hmotnost (kg)</label>

                <input
                    type="number"
                    id="hmotnostKg"
                    placeholder="např. 250"
                    min="0"
                    step="0.01"
                    oninput="prepocitejKg()"
                >


                <div
                    id="vypocetBox"
                    class="vypocet skryte"
                >

                    <div>
                        Materiál:
                        <strong id="vypocetMaterial"></strong>
                    </div>

                    <div>
                        Tvar:
                        <strong id="vypocetDruh"></strong>
                    </div>

                    <div>
                        Hustota:
                        <strong id="vypocetHustota"></strong>
                    </div>

                    <div>
                        Tolerance h9:
                        <strong id="vypocetTolerance"></strong>
                    </div>

                    <div>
                        Hmotnost jedné tyče:
                        <strong id="vahaJedneTyce"></strong>
                    </div>

                    <hr>

                    <div>
                        Doporučený počet:
                    </div>

                    <div
                        id="dopocitanyPocet"
                        class="vysledek"
                    ></div>

                    <div
                        id="rozsahPoctu"
                        class="poznamka"
                    ></div>

                </div>


                <label>
                    Výsledný počet kusů
                </label>

                <input
                    type="number"
                    id="pocetKg"
                    placeholder="spočítá se automaticky"
                    min="1"
                >

                <div class="poznamka">
                    Výsledek je odhad podle rozměru,
                    tolerance h9 a hustoty materiálu.
                    Před uložením můžeš počet ručně opravit.
                </div>

            </div>


            <br>

            <button onclick="pridatDoSkladu()">
                ➕ PŘIDAT DO SKLADU
            </button>

            <p id="zprava"></p>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    const SUPABASE_URL =
        "https://gmawlmsizglrnjmjegmx.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let vybranyMaterial = "";
    let vybranyDruh = "";
    let zpusobMnozstvi = "kusy";

    let osobniCisloPrihlaseneho = null;


    /*
        VÝCHOZÍ HUSTOTY kg/m3

        Později můžeme podle potřeby
        přidat konkrétní slitiny.
    */

    const hustoty = {

        "Ocel": 7850,
        "Nerez": 8000,
        "Hliník": 2700,
        "Mosaz": 8500

    };


    /*
        TABULKA h9

        tolerance je v mm

        h = horní odchylka 0
        spodní odchylka = -IT9
    */

    const toleranceH9 = [

        { max: 3, tolerance: 0.025 },
        { max: 6, tolerance: 0.030 },
        { max: 10, tolerance: 0.036 },
        { max: 18, tolerance: 0.043 },
        { max: 30, tolerance: 0.052 },
        { max: 50, tolerance: 0.062 },
        { max: 80, tolerance: 0.074 },
        { max: 120, tolerance: 0.087 },
        { max: 180, tolerance: 0.100 },
        { max: 250, tolerance: 0.115 },
        { max: 315, tolerance: 0.130 },
        { max: 400, tolerance: 0.140 },
        { max: 500, tolerance: 0.155 }

    ];


    /*
        PŘIHLÁŠENÍ
    */

    async function zkontrolujPrihlaseni() {

        const { data, error } =
            await supabaseClient
                .auth
                .getSession();


        if (
            error ||
            !data.session
        ) {

            window.location.href =
                "login.html";

            return;
        }


        const email =
            data.session.user.email || "";


        osobniCisloPrihlaseneho =
            email.split("@")[0];


        if (!osobniCisloPrihlaseneho) {

            await supabaseClient
                .auth
                .signOut();

            window.location.href =
                "login.html";

            return;
        }


        document.body.style.display =
            "block";

    }


    /*
        VÝBĚR MATERIÁLU
    */

    function vyberMaterial(material) {

        vybranyMaterial =
            material;

        document
            .getElementById("materialBox")
            .classList.add("skryte");

        document
            .getElementById("druhBox")
            .classList.remove("skryte");

    }


    /*
        VÝBĚR TVARU
    */

    function vyberDruh(druh) {

        vybranyDruh =
            druh;

        document
            .getElementById("druhBox")
            .classList.add("skryte");

        document
            .getElementById("udajeBox")
            .classList.remove("skryte");


        prepocitejKg();

    }


    /*
        KUSY / KG
    */

    function nastavZpusob(zpusob) {

        zpusobMnozstvi =
            zpusob;


        const kusyBox =
            document.getElementById(
                "kusyBox"
            );

        const kgBox =
            document.getElementById(
                "kgBox"
            );

        const tlacitkoKusy =
            document.getElementById(
                "tlacitkoKusy"
            );

        const tlacitkoKg =
            document.getElementById(
                "tlacitkoKg"
            );


        if (zpusob === "kusy") {

            kusyBox.classList
                .remove("skryte");

            kgBox.classList
                .add("skryte");

            tlacitkoKusy.classList
                .add("aktivni");

            tlacitkoKg.classList
                .remove("aktivni");

        } else {

            kusyBox.classList
                .add("skryte");

            kgBox.classList
                .remove("skryte");

            tlacitkoKg.classList
                .add("aktivni");

            tlacitkoKusy.classList
                .remove("aktivni");


            prepocitejKg();

        }

    }


    /*
        VRÁTÍ TOLERANCI h9
    */

    function zjistiH9(rozmer) {

        const cislo =
            Number(rozmer);


        if (
            !cislo ||
            cislo <= 0 ||
            cislo > 500
        ) {

            return null;
        }


        for (
            const radek
            of toleranceH9
        ) {

            if (
                cislo <= radek.max
            ) {

                return radek.tolerance;

            }

        }


        return null;

    }


    /*
        PLOCHA PRŮŘEZU mm2
    */

    function plochaPrurezu(
        druh,
        rozmer
    ) {

        const r =
            Number(rozmer);


        /*
            KULATINA

            A = PI * d2 / 4
        */

        if (
            druh === "Kulatina"
        ) {

            return (
                Math.PI *
                r *
                r /
                4
            );

        }


        /*
            ŠESTIHRAN

            rozměr = přes plochy

            A = sqrt(3)/2 * s2
        */

        if (
            druh === "Šestihran"
        ) {

            return (
                Math.sqrt(3) /
                2 *
                r *
                r
            );

        }


        return 0;

    }


    /*
        HMOTNOST JEDNÉ TYČE
    */

    function hmotnostTyce(
        druh,
        rozmerMm,
        delkaMm,
        hustota
    ) {

        const plochaMm2 =
            plochaPrurezu(
                druh,
                rozmerMm
            );


        /*
            mm2 -> m2
        */

        const plochaM2 =
            plochaMm2 /
            1000000;


        /*
            mm -> m
        */

        const delkaM =
            delkaMm /
            1000;


        /*
            kg
        */

        return (
            plochaM2 *
            delkaM *
            hustota
        );

    }


    /*
        AUTOMATICKÝ PŘEPOČET
    */

    function prepocitejKg() {

        if (
            zpusobMnozstvi !== "kg"
        ) {

            return;
        }


        const rozmer =
            Number(
                document
                    .getElementById("rozmer")
                    .value
            );


        const delka =
            Number(
                document
                    .getElementById("delka")
                    .value
            );


        const celkovaHmotnost =
            Number(
                document
                    .getElementById("hmotnostKg")
                    .value
            );


        const vypocetBox =
            document.getElementById(
                "vypocetBox"
            );


        if (
            !rozmer ||
            !delka ||
            !celkovaHmotnost ||
            !vybranyMaterial ||
            !vybranyDruh
        ) {

            vypocetBox.classList
                .add("skryte");

            return;

        }


        const tolerance =
            zjistiH9(rozmer);


        if (
            tolerance === null
        ) {

            vypocetBox.classList
                .add("skryte");

            return;

        }


        const hustota =
            hustoty[
                vybranyMaterial
            ];


        /*
            h9:

            maximum = jmenovitý rozměr
            minimum = jmenovitý - tolerance
        */

        const rozmerMax =
            rozmer;

        const rozmerMin =
            rozmer -
            tolerance;


        /*
            PRO STŘEDNÍ ODHAD
            POUŽIJEME STŘED TOLERANCE
        */

        const rozmerStred =
            (
                rozmerMax +
                rozmerMin
            ) /
            2;


        const vahaMax =
            hmotnostTyce(
                vybranyDruh,
                rozmerMax,
                delka,
                hustota
            );


        const vahaMin =
            hmotnostTyce(
                vybranyDruh,
                rozmerMin,
                delka,
                hustota
            );


        const vahaStred =
            hmotnostTyce(
                vybranyDruh,
                rozmerStred,
                delka,
                hustota
            );


        /*
            NEJLEPŠÍ ODHAD
        */

        const presnyOdhad =
            celkovaHmotnost /
            vahaStred;


        const pocet =
            Math.round(
                presnyOdhad
            );


        /*
            TEORETICKÝ ROZSAH

            těžší tyč = méně kusů
            lehčí tyč = více kusů
        */

        const minimumKusu =
            Math.floor(
                celkovaHmotnost /
                vahaMax
            );


        const maximumKusu =
            Math.ceil(
                celkovaHmotnost /
                vahaMin
            );


        document
            .getElementById(
                "vypocetMaterial"
            )
            .innerText =
            vybranyMaterial;


        document
            .getElementById(
                "vypocetDruh"
            )
            .innerText =
            vybranyDruh;


        document
            .getElementById(
                "vypocetHustota"
            )
            .innerText =
            hustota +
            " kg/m³";


        document
            .getElementById(
                "vypocetTolerance"
            )
            .innerText =
            "0 / -" +
            tolerance.toFixed(3) +
            " mm";


        document
            .getElementById(
                "vahaJedneTyce"
            )
            .innerText =
            vahaStred.toFixed(3) +
            " kg";


        document
            .getElementById(
                "dopocitanyPocet"
            )
            .innerText =
            pocet +
            " ks";


        document
            .getElementById(
                "rozsahPoctu"
            )
            .innerText =
            "Teoretické rozmezí podle h9: " +
            minimumKusu +
            " až " +
            maximumKusu +
            " ks";


        /*
            VÝSLEDEK ROVNOU
            PŘEDVYPLNÍME
        */

        document
            .getElementById(
                "pocetKg"
            )
            .value =
            pocet;


        vypocetBox.classList
            .remove("skryte");

    }


    /*
        PŘIDÁNÍ DO SKLADU
    */

    async function pridatDoSkladu() {

        const rozmer =
            document
                .getElementById("rozmer")
                .value;

        const delka =
            document
                .getElementById("delka")
                .value;

        const atest =
            document
                .getElementById("atest")
                .value;


        let pocet = 0;


        /*
            PODLE ZVOLENÉHO
            ZPŮSOBU ZADÁNÍ
        */

        if (
            zpusobMnozstvi === "kusy"
        ) {

            pocet =
                Number(
                    document
                        .getElementById(
                            "pocet"
                        )
                        .value
                );

        } else {

            pocet =
                Number(
                    document
                        .getElementById(
                            "pocetKg"
                        )
                        .value
                );

        }


        const osobniCislo =
            osobniCisloPrihlaseneho;


        if (
            rozmer === "" ||
            delka === "" ||
            atest === "" ||
            !pocet ||
            pocet <= 0
        ) {

            alert(
                "Vyplň všechna pole."
            );

            return;

        }


        if (
            zpusobMnozstvi === "kg"
        ) {

            const kg =
                Number(
                    document
                        .getElementById(
                            "hmotnostKg"
                        )
                        .value
                );


            if (
                !kg ||
                kg <= 0
            ) {

                alert(
                    "Zadej celkovou hmotnost v kg."
                );

                return;

            }

        }


        if (!osobniCislo) {

            alert(
                "Nepodařilo se zjistit přihlášeného pracovníka."
            );

            return;
        }


        const rozmerText =
            rozmer +
            " mm";

        const delkaText =
            delka +
            " mm";


        const datum =
            new Date()
                .toLocaleDateString(
                    "sv-SE"
                );


        /*
            EXISTUJÍCÍ TAVBA
        */

        const {
            data: existujici,
            error: chybaNacteni
        } =
            await supabaseClient
                .from("sklad")
                .select("*")
                .eq(
                    "material",
                    vybranyMaterial
                )
                .eq(
                    "druh",
                    vybranyDruh
                )
                .eq(
                    "rozmer",
                    rozmerText
                )
                .eq(
                    "delka",
                    delkaText
                )
                .eq(
                    "atest",
                    atest
                );


        if (chybaNacteni) {

            document
                .getElementById(
                    "zprava"
                )
                .innerText =
                "Chyba při kontrole skladu: " +
                chybaNacteni.message;

            return;

        }


        if (
            existujici &&
            existujici.length > 0
        ) {

            const staraPolozka =
                existujici[0];


            const novyPocet =
                Number(
                    staraPolozka.pocet
                ) +
                pocet;


            const {
                error: chybaUpdate
            } =
                await supabaseClient
                    .from("sklad")
                    .update({
                        pocet:
                            novyPocet
                    })
                    .eq(
                        "material",
                        vybranyMaterial
                    )
                    .eq(
                        "druh",
                        vybranyDruh
                    )
                    .eq(
                        "rozmer",
                        rozmerText
                    )
                    .eq(
                        "delka",
                        delkaText
                    )
                    .eq(
                        "atest",
                        atest
                    );


            if (chybaUpdate) {

                document
                    .getElementById(
                        "zprava"
                    )
                    .innerText =
                    "Chyba při navyšování počtu: " +
                    chybaUpdate.message;

                return;

            }

        }

        /*
            NOVÁ TAVBA
        */

        else {

            const novaPolozka = {

                material:
                    vybranyMaterial,

                druh:
                    vybranyDruh,

                rozmer:
                    rozmerText,

                delka:
                    delkaText,

                atest:
                    atest,

                pocet:
                    pocet

            };


            const {
                error: chybaInsert
            } =
                await supabaseClient
                    .from("sklad")
                    .insert([
                        novaPolozka
                    ]);


            if (chybaInsert) {

                document
                    .getElementById(
                        "zprava"
                    )
                    .innerText =
                    "Chyba při ukládání do skladu: " +
                    chybaInsert.message;

                return;

            }

        }


        /*
            HISTORIE
        */

        const zaznamHistorie = {

            datum:
                datum,

            osobni_cislo:
                osobniCislo,

            akce:
                "PŘIDÁNO",

            material:
                vybranyMaterial,

            druh:
                vybranyDruh,

            rozmer:
                rozmerText,

            delka:
                delkaText,

            atest:
                atest,

            pocet:
                pocet

        };


        const {
            error: chybaHistorie
        } =
            await supabaseClient
                .from("historie")
                .insert([
                    zaznamHistorie
                ]);


        if (chybaHistorie) {

            document
                .getElementById(
                    "zprava"
                )
                .innerText =
                "Materiál byl přidán, ale nepodařilo se zapsat historii: " +
                chybaHistorie.message;

            return;

        }


        document
            .getElementById(
                "zprava"
            )
            .innerText =
            "✅ Materiál přidán a pohyb zapsán do historie.";


        /*
            VYČIŠTĚNÍ
        */

        document
            .getElementById("rozmer")
            .value = "";

        document
            .getElementById("delka")
            .value = "";

        document
