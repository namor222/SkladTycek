<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Přidat do skladu</title>

<style>

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f2f2f2;
        margin: 0;
        padding: 20px 15px 30px 15px;
        display: none;
    }

    .hlavicka {
        max-width: 500px;
        margin: 0 auto 25px auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
    }

    .hlavicka h1 {
        margin: 0;
        font-size: 28px;
        text-align: left;
    }

    .zpet {
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        color: #1976d2;
        white-space: nowrap;
    }

    .zpet:hover {
        text-decoration: underline;
    }

    .obsah {
        max-width: 500px;
        margin: auto;
    }

    .skryte {
        display: none;
    }

    button {
        width: 100%;
        padding: 20px;
        margin-bottom: 15px;
        font-size: 22px;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        cursor: pointer;
    }

    input {
        width: 90%;
        padding: 14px;
        margin: 8px 0 15px 0;
        font-size: 20px;
        text-align: center;
        box-sizing: border-box;
    }

    label {
        display: block;
        font-weight: bold;
        font-size: 18px;
        margin-top: 10px;
    }

    .polozka {
        background: white;
        padding: 20px;
        border-radius: 12px;
    }

    #zprava {
        font-size: 18px;
        font-weight: bold;
        margin-top: 15px;
    }

    @media (max-width: 500px) {

        .hlavicka h1 {
            font-size: 22px;
        }

        .zpet {
            font-size: 16px;
        }
    }

</style>

</head>

<body>

<div class="hlavicka">

    <h1>➕ Přidat do skladu</h1>

    <a class="zpet" href="material.html">
        ← ZPĚT
    </a>

</div>


<div class="obsah">

    <div id="materialBox">

        <h2>1. Materiál</h2>

        <button onclick="vyberMaterial('Ocel')">
            Ocel
        </button>

        <button onclick="vyberMaterial('Nerez')">
            Nerez
        </button>

        <button onclick="vyberMaterial('Hliník')">
            Hliník
        </button>

        <button onclick="vyberMaterial('Mosaz')">
            Mosaz
        </button>

    </div>


    <div id="druhBox" class="skryte">

        <h2>2. Druh</h2>

        <button onclick="vyberDruh('Kulatina')">
            Kulatina
        </button>

        <button onclick="vyberDruh('Šestihran')">
            Šestihran
        </button>

    </div>


    <div id="udajeBox" class="skryte">

        <div class="polozka">

            <h2>3. Údaje o materiálu</h2>

            <label>Rozměr</label>

            <input
                type="number"
                id="rozmer"
                placeholder="např. 20"
                min="0"
            >


            <label>Délka (mm)</label>

            <input
                type="number"
                id="delka"
                placeholder="např. 3000"
                min="0"
            >


            <label>Tavba</label>

            <input
                type="number"
                id="atest"
                placeholder="např. 11112"
                min="0"
            >


            <label>Počet kusů</label>

            <input
                type="number"
                id="pocet"
                placeholder="např. 50"
                min="1"
            >


            <button onclick="pridatDoSkladu()">
                ➕ PŘIDAT DO SKLADU
            </button>

            <p id="zprava"></p>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    const SUPABASE_URL =
        "https://gmawlmsizglrnjmjegmx.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let vybranyMaterial = "";
    let vybranyDruh = "";
    let osobniCisloPrihlaseneho = null;


    async function zkontrolujPrihlaseni() {

        const { data, error } =
            await supabaseClient
                .auth
                .getSession();


        if (
            error ||
            !data.session
        ) {

            window.location.href =
                "login.html";

            return;
        }


        const email =
            data.session.user.email || "";


        osobniCisloPrihlaseneho =
            email.split("@")[0];


        if (!osobniCisloPrihlaseneho) {

            await supabaseClient
                .auth
                .signOut();

            window.location.href =
                "login.html";

            return;
        }


        document.body.style.display =
            "block";

    }


    function vyberMaterial(material) {

        vybranyMaterial = material;

        document.getElementById("materialBox")
            .classList.add("skryte");

        document.getElementById("druhBox")
            .classList.remove("skryte");

    }


    function vyberDruh(druh) {

        vybranyDruh = druh;

        document.getElementById("druhBox")
            .classList.add("skryte");

        document.getElementById("udajeBox")
            .classList.remove("skryte");

    }


    async function pridatDoSkladu() {

        const rozmer =
            document.getElementById("rozmer").value;

        const delka =
            document.getElementById("delka").value;

        const atest =
            document.getElementById("atest").value;

        const pocet =
            Number(
                document.getElementById("pocet").value
            );


        const osobniCislo =
            osobniCisloPrihlaseneho;


        if (
            rozmer === "" ||
            delka === "" ||
            atest === "" ||
            !pocet
        ) {

            alert(
                "Vyplň všechna pole."
            );

            return;
        }


        if (!osobniCislo) {

            alert(
                "Nepodařilo se zjistit přihlášeného pracovníka."
            );

            return;
        }


        const rozmerText =
            rozmer + " mm";

        const delkaText =
            delka + " mm";


        const datum =
            new Date().toLocaleDateString(
                "sv-SE"
            );


        const {
            data: existujici,
            error: chybaNacteni
        } =
            await supabaseClient
                .from("sklad")
                .select("*")
                .eq("material", vybranyMaterial)
                .eq("druh", vybranyDruh)
                .eq("rozmer", rozmerText)
                .eq("delka", delkaText)
                .eq("atest", atest);


        if (chybaNacteni) {

            document.getElementById("zprava")
                .innerText =
                "Chyba při kontrole skladu: " +
                chybaNacteni.message;

            return;
        }


        if (
            existujici &&
            existujici.length > 0
        ) {

            const staraPolozka =
                existujici[0];

            const novyPocet =
                Number(staraPolozka.pocet) +
                pocet;


            const {
                error: chybaUpdate
            } =
                await supabaseClient
                    .from("sklad")
                    .update({
                        pocet: novyPocet
                    })
                    .eq(
                        "material",
                        vybranyMaterial
                    )
                    .eq(
                        "druh",
                        vybranyDruh
                    )
                    .eq(
                        "rozmer",
                        rozmerText
                    )
                    .eq(
                        "delka",
                        delkaText
                    )
                    .eq(
                        "atest",
                        atest
                    );


            if (chybaUpdate) {

                document.getElementById("zprava")
                    .innerText =
                    "Chyba při navyšování počtu: " +
                    chybaUpdate.message;

                return;
            }

        } else {

            const novaPolozka = {

                material:
                    vybranyMaterial,

                druh:
                    vybranyDruh,

                rozmer:
                    rozmerText,

                delka:
                    delkaText,

                atest:
                    atest,

                pocet:
                    pocet

            };


            const {
                error: chybaInsert
            } =
                await supabaseClient
                    .from("sklad")
                    .insert([
                        novaPolozka
                    ]);


            if (chybaInsert) {

                document.getElementById("zprava")
                    .innerText =
                    "Chyba při ukládání do skladu: " +
                    chybaInsert.message;

                return;
            }

        }


        const zaznamHistorie = {

            datum:
                datum,

            osobni_cislo:
                osobniCislo,

            akce:
                "PŘIDÁNO",

            material:
                vybranyMaterial,

            druh:
                vybranyDruh,

            rozmer:
                rozmerText,

            delka:
                delkaText,

            atest:
                atest,

            pocet:
                pocet

        };


        const {
            error: chybaHistorie
        } =
            await supabaseClient
                .from("historie")
                .insert([
                    zaznamHistorie
                ]);


        if (chybaHistorie) {

            document.getElementById("zprava")
                .innerText =
                "Materiál byl přidán, ale nepodařilo se zapsat historii: " +
                chybaHistorie.message;

            return;
        }


        document.getElementById("zprava")
            .innerText =
            "✅ Materiál přidán a pohyb zapsán do historie.";


        document.getElementById("rozmer")
            .value = "";

        document.getElementById("delka")
            .value = "";

        document.getElementById("atest")
            .value = "";

        document.getElementById("pocet")
            .value = "";

    }


    zkontrolujPrihlaseni();

</script>

</body>
</html>
