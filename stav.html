<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stav skladu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px 15px 30px 15px;
            text-align: center;
            display: none;
        }

        .hlavicka {
            max-width: 600px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .hlavicka h1 {
            margin: 0;
            font-size: 28px;
            text-align: left;
        }

        .zpet {
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: #1976d2;
            white-space: nowrap;
        }

        .zpet:hover {
            text-decoration: underline;
        }

        .hledani {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .hledani input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 18px;
            text-align: center;
            border: 1px solid #aaa;
            border-radius: 10px;
            background: white;
        }

        .polozka {
            background: white;
            padding: 20px;
            margin: 15px auto;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .cislo-tavby {
            color: #1976d2;
            font-weight: bold;
        }

        .pocet-malo {
            color: #d32f2f;
            font-weight: bold;
        }

        .pocet-stred {
            color: #f57c00;
            font-weight: bold;
        }

        .pocet-ok {
            color: #1b8f3a;
            font-weight: bold;
        }

        .celkem {
            font-size: 22px;
            font-weight: bold;
            margin-top: 30px;
        }

        @media (max-width: 500px) {

            .hlavicka h1 {
                font-size: 22px;
            }

            .zpet {
                font-size: 16px;
            }

            .hledani input {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="hlavicka">

        <h1>📊 Stav skladu</h1>

        <a class="zpet" href="material.html">
            ← ZPĚT
        </a>

    </div>

    <div class="hledani">

        <input
            type="text"
            id="hledatTavbu"
            placeholder="🔎 Hledat podle tavby..."
            oninput="zobrazSklad()"
        >

    </div>

    <div id="seznam">
        Načítám sklad...
    </div>

    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        let skladData = [];


        async function zkontrolujPrihlaseni() {

            const { data, error } =
                await supabaseClient
                    .auth
                    .getSession();

            if (
                error ||
                !data.session
            ) {

                window.location.href =
                    "login.html";

                return;
            }

            document.body.style.display =
                "block";

            nactiSklad();
        }


        async function nactiSklad() {

            const seznam =
                document.getElementById("seznam");

            const { data, error } =
                await supabaseClient
                    .from("sklad")
                    .select("*")
                    .order("material")
                    .order("druh")
                    .order("rozmer")
                    .order("delka")
                    .order("atest");

            if (error) {

                seznam.innerHTML =
                    "<p>Chyba při načítání skladu:<br>" +
                    error.message +
                    "</p>";

                return;
            }

            skladData =
                (data || []).filter(
                    polozka => Number(polozka.pocet) > 0
                );

            zobrazSklad();
        }


        function tridaPoctu(pocet) {

            const cislo =
                Number(pocet);

            if (cislo < 10) {
                return "pocet-malo";
            }

            if (cislo <= 20) {
                return "pocet-stred";
            }

            return "pocet-ok";
        }


        function zobrazSklad() {

            const seznam =
                document.getElementById("seznam");

            const hledanaTavba =
                document
                    .getElementById("hledatTavbu")
                    .value
                    .trim()
                    .toLowerCase();

            let filtrovanaData =
                skladData;

            if (hledanaTavba !== "") {

                filtrovanaData =
                    skladData.filter(polozka =>

                        String(polozka.atest)
                            .toLowerCase()
                            .includes(hledanaTavba)

                    );
            }

            if (filtrovanaData.length === 0) {

                seznam.innerHTML =
                    "<p>Žádná tavba nebyla nalezena.</p>";

                return;
            }

            seznam.innerHTML = "";

            const skupiny = {};

            filtrovanaData.forEach(polozka => {

                const klic =
                    polozka.material + "|" +
                    polozka.druh + "|" +
                    polozka.rozmer + "|" +
                    polozka.delka;

                if (!skupiny[klic]) {

                    skupiny[klic] = {
                        material: polozka.material,
                        druh: polozka.druh,
                        rozmer: polozka.rozmer,
                        delka: polozka.delka,
                        atesty: [],
                        celkem: 0
                    };

                }

                skupiny[klic].atesty.push({
                    atest: polozka.atest,
                    pocet: Number(polozka.pocet)
                });

                skupiny[klic].celkem +=
                    Number(polozka.pocet);

            });

            let celkemVsechno = 0;

            Object.values(skupiny).forEach(skupina => {

                celkemVsechno +=
                    skupina.celkem;

                let atestyHTML = "";

                skupina.atesty.sort(
                    (a, b) => a.pocet - b.pocet
                );

                skupina.atesty.forEach(atest => {

                    const trida =
                        tridaPoctu(atest.pocet);

                    atestyHTML += `

                        <p>
                            Tavba:
                            <span class="cislo-tavby">
                                ${atest.atest}
                            </span>
                            —
                            <span class="${trida}">
                                ${atest.pocet} ks
                            </span>
                        </p>

                    `;

                });

                const tridaCelkem =
                    tridaPoctu(skupina.celkem);

                seznam.innerHTML += `

                    <div class="polozka">

                        <h2>
                            ${skupina.material}
                        </h2>

                        <h3>
                            ${skupina.druh}
                            |
                            ${skupina.rozmer}
                            |
                            ${skupina.delka}
                        </h3>

                        ${atestyHTML}

                        <hr>

                        <p>
                            Celkem:
                            <span class="${tridaCelkem}">
                                ${skupina.celkem} ks
                            </span>
                        </p>

                    </div>

                `;

            });

            seznam.innerHTML += `

                <div class="celkem">

                    Celkem zobrazených tyček:
                    ${celkemVsechno} ks

                </div>

            `;

        }


        zkontrolujPrihlaseni();

    </script>

</body>
</html>
