<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>KOVOHLADIL | Firemní systém</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           ZÁKLAD
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #101828;
        }

        body {
            display: none;
            background: #eef2f6;
        }

        button,
        a {
            font: inherit;
        }


        /* =========================================================
           CELÁ STRÁNKA
        ========================================================= */

        .page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(245, 248, 251, 0.20),
                    rgba(245, 248, 251, 0.20)
                ),
                url("index-pozadi.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================================================
           HORNÍ LIŠTA
        ========================================================= */

        .topbar {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 88px;

            display: flex;
            align-items: center;

            padding:
                0
                clamp(25px, 4vw, 70px);

            background:
                rgba(255, 255, 255, 0.94);

            border-bottom:
                1px solid rgba(18, 41, 65, 0.12);

            box-shadow:
                0 4px 18px rgba(20, 40, 60, 0.08);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .brand {
            display: flex;
            align-items: center;

            min-width: 0;
        }

        .brand img {
            display: block;

            width: auto;
            height: 56px;

            max-width: min(410px, 42vw);

            object-fit: contain;
            object-position: left center;
        }


        /* =========================================================
           PRAVÁ ČÁST HLAVIČKY
        ========================================================= */

        .topbar-right {
            margin-left: auto;

            display: flex;
            align-items: center;

            gap: 22px;
        }


        /* =========================================================
           UŽIVATEL
        ========================================================= */

        .user-info {
            display: flex;
            align-items: center;

            gap: 9px;

            color: #344054;

            font-size: 15px;
            font-weight: 600;

            white-space: nowrap;
        }

        .user-icon {
            position: relative;

            width: 22px;
            height: 22px;

            flex: 0 0 22px;
        }

        .user-icon::before {
            content: "";

            position: absolute;

            top: 1px;
            left: 7px;

            width: 8px;
            height: 8px;

            border:
                2px solid #15263b;

            border-radius: 50%;
        }

        .user-icon::after {
            content: "";

            position: absolute;

            left: 3px;
            bottom: 1px;

            width: 16px;
            height: 8px;

            border:
                2px solid #15263b;

            border-bottom: 0;

            border-radius:
                10px 10px 0 0;
        }


        /* =========================================================
           ODHLÁSIT
        ========================================================= */

        .logout-button {
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 0 18px;

            border:
                1px solid #d6dde5;

            border-radius: 8px;

            background:
                rgba(248, 250, 252, 0.95);

            color: #172033;

            font-size: 13px;
            font-weight: 800;

            text-transform: uppercase;

            cursor: pointer;

            box-shadow:
                0 2px 7px rgba(16, 24, 40, 0.06);

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .logout-button:hover {
            background: #ffffff;

            border-color: #b7c3cf;

            transform:
                translateY(-1px);

            box-shadow:
                0 5px 12px rgba(16, 24, 40, 0.10);
        }

        .logout-button:active {
            transform:
                translateY(0);
        }

        .logout-symbol {
            font-size: 18px;
            font-weight: 700;

            color: #344054;
        }


        /* =========================================================
           HLAVNÍ OBSAH
        ========================================================= */

        .content {
            position: relative;
            z-index: 2;

            min-height:
                calc(100vh - 88px);

            min-height:
                calc(100dvh - 88px);

            display: flex;
            flex-direction: column;
            align-items: center;

            padding:
                clamp(55px, 8vh, 105px)
                24px
                60px;
        }


        /* =========================================================
           NADPIS
        ========================================================= */

        .intro {
            width:
                min(780px, 90vw);

            margin-bottom:
                clamp(32px, 5vh, 58px);

            padding:
                30px 40px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.92);

            border:
                1px solid rgba(255, 255, 255, 0.90);

            border-radius: 14px;

            box-shadow:
                0 12px 35px rgba(20, 40, 60, 0.12);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .intro h1 {
            margin:
                0 0 8px;

            font-size:
                clamp(28px, 3vw, 42px);

            line-height: 1.1;

            font-weight: 800;

            color: #101828;

            letter-spacing: -0.5px;
        }

        .intro p {
            margin: 0;

            color: #667085;

            font-size:
                clamp(15px, 1.4vw, 18px);

            line-height: 1.5;
        }


        /* =========================================================
           ROZCESTNÍK
        ========================================================= */

        .menu {
            width:
                min(980px, 92vw);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }


        /* =========================================================
           KARTA
        ========================================================= */

        .menu-card {
            position: relative;

            min-height: 190px;

            display: flex;
            flex-direction: column;

            padding:
                28px 25px 23px;

            text-decoration: none;

            color: #101828;

            background:
                rgba(255, 255, 255, 0.95);

            border:
                1px solid rgba(208, 216, 226, 0.92);

            border-radius: 11px;

            box-shadow:
                0 8px 24px rgba(16, 24, 40, 0.10);

            overflow: hidden;

            transition:
                transform 0.20s ease,
                box-shadow 0.20s ease,
                border-color 0.20s ease;
        }

        .menu-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 5px;

            background:
                #1688ed;
        }

        .menu-card:hover {
            transform:
                translateY(-4px);

            border-color:
                #b8c6d5;

            box-shadow:
                0 14px 35px rgba(16, 24, 40, 0.16);
        }


        /* =========================================================
           IKONA SKLADU
        ========================================================= */

        .warehouse-icon {
            height: 58px;

            display: flex;
            align-items: flex-end;

            gap: 5px;

            margin-bottom: 20px;
        }

        .warehouse-icon span {
            display: block;

            width: 12px;

            border-radius:
                2px 2px 0 0;

            background:
                linear-gradient(
                    180deg,
                    #29a7ff 0%,
                    #0879e8 100%
                );
        }

        .warehouse-icon .bar-1 {
            height: 27px;
        }

        .warehouse-icon .bar-2 {
            height: 42px;
        }

        .warehouse-icon .bar-3 {
            height: 54px;
        }


        /* =========================================================
           TEXT KARTY
        ========================================================= */

        .menu-title {
            margin:
                0 0 7px;

            font-size: 21px;
            font-weight: 800;

            line-height: 1.2;
        }

        .menu-description {
            margin: 0;

            color: #667085;

            font-size: 15px;

            line-height: 1.4;
        }

        .menu-arrow {
            margin-top: auto;

            padding-top: 18px;

            display: flex;
            justify-content: flex-end;

            color: #172033;

            font-size: 27px;
            font-weight: 700;
        }


        /* =========================================================
           BUDOUCÍ KARTY
           Zatím se nezobrazují.
        ========================================================= */

        .future-card {
            display: none;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 1000px) {

            .topbar {
                height: 78px;

                padding:
                    0 25px;
            }

            .brand img {
                height: 48px;
            }

            .content {
                min-height:
                    calc(100dvh - 78px);

                padding-top:
                    60px;
            }

            .menu {
                grid-template-columns:
                    repeat(2, 1fr);

                max-width: 720px;
            }

            .menu-card {
                min-height: 175px;
            }
        }


        /* =========================================================
           MOBIL
        ========================================================= */

        @media (max-width: 700px) {

            body {
                background: #eef2f6;
            }

            .page {
                min-height: 100dvh;

                background-image:
                    linear-gradient(
                        rgba(245, 248, 251, 0.16),
                        rgba(245, 248, 251, 0.16)
                    ),
                    url("index-pozadi-mobil.png");

                background-position:
                    center center;

                background-size:
                    cover;
            }


            /* HEADER */

            .topbar {
                height:
                    calc(
                        72px +
                        env(safe-area-inset-top)
                    );

                padding:
                    env(safe-area-inset-top)
                    15px
                    0;

                background:
                    rgba(255, 255, 255, 0.96);
            }

            .brand img {
                height: 39px;

                max-width: 190px;
            }

            .topbar-right {
                gap: 8px;
            }

            .user-info {
                font-size: 12px;

                gap: 5px;
            }

            .user-icon {
                transform:
                    scale(0.82);
            }

            .logout-button {
                width: 43px;
                height: 43px;

                padding: 0;

                border-radius: 8px;
            }

            .logout-button .logout-text {
                display: none;
            }

            .logout-symbol {
                font-size: 20px;
            }


            /* OBSAH */

            .content {
                min-height:
                    calc(
                        100dvh -
                        72px -
                        env(safe-area-inset-top)
                    );

                justify-content: center;

                padding:
                    35px
                    17px
                    calc(
                        35px +
                        env(safe-area-inset-bottom)
                    );
            }


            /* NADPIS */

            .intro {
                width: 100%;

                margin-bottom: 22px;

                padding:
                    22px 18px;

                border-radius: 12px;
            }

            .intro h1 {
                font-size:
                    clamp(24px, 7vw, 31px);

                margin-bottom: 7px;
            }

            .intro p {
                font-size: 14px;
            }


            /* MENU */

            .menu {
                width: 100%;

                display: block;
            }

            .menu-card {
                width: 100%;

                min-height: 128px;

                display: grid;

                grid-template-columns:
                    70px 1fr 35px;

                grid-template-rows:
                    auto auto;

                align-items: center;

                padding:
                    20px 17px;

                border-radius: 11px;
            }

            .warehouse-icon {
                grid-column: 1;
                grid-row: 1 / 3;

                height: 50px;

                margin: 0;

                align-self: center;
            }

            .warehouse-icon span {
                width: 10px;
            }

            .warehouse-icon .bar-1 {
                height: 24px;
            }

            .warehouse-icon .bar-2 {
                height: 35px;
            }

            .warehouse-icon .bar-3 {
                height: 46px;
            }

            .menu-title {
                grid-column: 2;
                grid-row: 1;

                align-self: end;

                margin:
                    0 0 5px;

                font-size: 20px;
            }

            .menu-description {
                grid-column: 2;
                grid-row: 2;

                align-self: start;

                font-size: 13px;
            }

            .menu-arrow {
                grid-column: 3;
                grid-row: 1 / 3;

                align-self: center;
                justify-self: end;

                margin: 0;
                padding: 0;

                font-size: 30px;
            }
        }


        /* =========================================================
           MALÉ MOBILY
        ========================================================= */

        @media (max-width: 390px) {

            .topbar {
                padding-left: 11px;
                padding-right: 11px;
            }

            .brand img {
                max-width: 160px;
                height: 34px;
            }

            .user-info {
                display: none;
            }

            .content {
                padding-left: 12px;
                padding-right: 12px;
            }

            .intro {
                padding:
                    18px 14px;
            }

            .intro h1 {
                font-size: 23px;
            }

            .menu-card {
                grid-template-columns:
                    59px 1fr 28px;

                padding:
                    18px 14px;
            }

            .menu-title {
                font-size: 18px;
            }
        }


        /* =========================================================
           MOBIL NA ŠÍŘKU
        ========================================================= */

        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            .page {
                background-image:
                    linear-gradient(
                        rgba(245, 248, 251, 0.15),
                        rgba(245, 248, 251, 0.15)
                    ),
                    url("index-pozadi.png");
            }

            .topbar {
                height: 64px;

                padding:
                    0 20px;
            }

            .brand img {
                height: 39px;
            }

            .content {
                min-height:
                    calc(100dvh - 64px);

                padding:
                    25px 20px;
            }

            .intro {
                margin-bottom: 18px;

                padding:
                    15px 25px;
            }

            .intro h1 {
                font-size: 25px;
            }

            .intro p {
                font-size: 13px;
            }

            .menu-card {
                min-height: 120px;
            }
        }
    </style>
</head>


<body>

    <main class="page">

        <!-- =====================================================
             HORNÍ LIŠTA
        ====================================================== -->

        <header class="topbar">

            <!-- LOGO -->
            <div class="brand">
                <img
                    src="logo.png"
                    alt="KovoHladil"
                >
            </div>


            <!-- PRAVÁ ČÁST -->
            <div class="topbar-right">

                <div class="user-info">

                    <span
                        class="user-icon"
                        aria-hidden="true"
                    ></span>

                    <span>
                        Os. č. 3
                    </span>

                </div>


                <button
                    type="button"
                    class="logout-button"
                    onclick="odhlasit()"
                    aria-label="Odhlásit"
                >

                    <span
                        class="logout-symbol"
                        aria-hidden="true"
                    >
                        ↪
                    </span>

                    <span class="logout-text">
                        Odhlásit
                    </span>

                </button>

            </div>

        </header>


        <!-- =====================================================
             OBSAH
        ====================================================== -->

        <section class="content">


            <!-- NADPIS -->

            <div class="intro">

                <h1>
                    Firemní systém
                </h1>

                <p>
                    Vyberte oblast, se kterou chcete pracovat.
                </p>

            </div>


            <!-- =================================================
                 ROZCESTNÍK
            ================================================== -->

            <nav
                class="menu"
                aria-label="Hlavní nabídka"
            >


                <!-- =============================================
                     SKLAD MATERIÁLU
                ============================================== -->

                <a
                    href="sklad/material.html"
                    class="menu-card"
                >

                    <div
                        class="warehouse-icon"
                        aria-hidden="true"
                    >
                        <span class="bar-1"></span>
                        <span class="bar-2"></span>
                        <span class="bar-3"></span>
                    </div>


                    <h2 class="menu-title">
                        Sklad materiálu
                    </h2>


                    <p class="menu-description">
                        Evidence a správa skladového materiálu
                    </p>


                    <span
                        class="menu-arrow"
                        aria-hidden="true"
                    >
                        →
                    </span>

                </a>


                <!--
                    =================================================
                    SEM POZDĚJI PŘIDÁME DALŠÍ MODULY.

                    Například:

                    <a href="#" class="menu-card">
                        ...
                    </a>

                    Zatím je index pouze rozcestník do skladu materiálu.
                    =================================================
                -->


            </nav>

        </section>

    </main>


    <!-- =========================================================
         SUPABASE + PŮVODNÍ FUNKCE
    ========================================================== -->

    <script>

        /* =========================================================
           SUPABASE
        ========================================================= */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================================
           KONTROLA PŘIHLÁŠENÍ
        ========================================================= */

        async function zkontrolujPrihlaseni() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "login.html"
                );

                return;
            }


            document.body.style.display =
                "block";
        }


        /* =========================================================
           ODHLÁŠENÍ
        ========================================================= */

        async function odhlasit() {

            try {

                await supabaseClient
                    .auth
                    .signOut();

            }

            finally {

                window.location.replace(
                    "login.html"
                );

            }

        }


        /* =========================================================
           SPUŠTĚNÍ
        ========================================================= */

        zkontrolujPrihlaseni();

    </script>

</body>

</html>
