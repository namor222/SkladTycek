<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>KOVOHLADIL | Přihlášení</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            background: #050505;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* =========================================================
           HLAVNÍ PLOCHA - PC
           ========================================================= */

        .stage {
            position: relative;

            width: 100vw;
            height: 100vh;

            margin: 0;

            /*
                Nové černo-bílo-stříbrné PC pozadí.
                Obrázek vyplní CELÝ monitor.
                Tím zmizí prázdné pásy vlevo a vpravo.
            */
            background-image: url("login-pc.png");
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;

            overflow: hidden;
        }


        /* =========================================================
           FORMULÁŘ - PC
           ========================================================= */

        .login-box {
            position: absolute;

            left: 50%;

            /*
                Formulář je lehce nad přesným středem obrazovky,
                aby seděl do středu prázdného panelu na pozadí.
            */
            top: 58%;

            transform: translate(-50%, -50%);

            width: min(32vw, 590px);

            z-index: 10;

            text-align: center;
        }


        /* =========================================================
           POPISKY
           ========================================================= */

        label {
            display: block;

            width: 100%;

            margin: 0 0 8px 0;

            text-align: left;

            color: #ffffff;

            font-size: clamp(
                12px,
                0.9vw,
                16px
            );

            font-weight: 700;

            text-shadow:
                0 1px 4px
                rgba(0, 0, 0, 0.95);
        }

        label:not(:first-of-type) {
            margin-top: 22px;
        }


        /* =========================================================
           INPUTY
           ========================================================= */

        input {
            display: block;

            width: 100%;

            min-height: 56px;

            padding:
                clamp(12px, 1vw, 17px)
                clamp(14px, 1.2vw, 20px);

            border:
                1px solid
                rgba(220, 220, 220, 0.72);

            border-radius: 8px;

            outline: none;

            /*
                Černo-šedý kovový vzhled.
            */
            background:
                linear-gradient(
                    180deg,
                    rgba(38, 38, 38, 0.94) 0%,
                    rgba(17, 17, 17, 0.94) 100%
                );

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size:
                clamp(
                    14px,
                    1.05vw,
                    18px
                );

            text-align: center;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 0 12px rgba(255, 255, 255, 0.025),
                0 2px 8px rgba(0, 0, 0, 0.35);

            transition:
                border-color .18s ease,
                box-shadow .18s ease,
                background .18s ease;
        }


        input::placeholder {
            color: rgba(215, 215, 215, 0.58);
        }


        input:focus {
            border-color: #ffffff;

            background:
                linear-gradient(
                    180deg,
                    rgba(48, 48, 48, 0.98) 0%,
                    rgba(18, 18, 18, 0.98) 100%
                );

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 0 0 2px rgba(255, 255, 255, 0.10),
                0 0 18px rgba(255, 255, 255, 0.15);
        }


        /* =========================================================
           TLAČÍTKO PŘIHLÁSIT
           ========================================================= */

        #prihlasitButton {
            width: 100%;

            min-height: 60px;

            margin-top: 32px;

            padding:
                clamp(12px, 1.1vw, 18px)
                10px;

            border:
                1px solid
                rgba(255, 255, 255, 0.80);

            border-radius: 8px;

            /*
                Stříbrný / černý vzhled.
            */
            background:
                linear-gradient(
                    110deg,
                    #eeeeee 0%,
                    #a8a8a8 20%,
                    #4b4b4b 42%,
                    #161616 62%,
                    #050505 100%
                );

            color: #ffffff;

            font-size:
                clamp(
                    14px,
                    1.15vw,
                    20px
                );

            font-weight: 800;

            letter-spacing: 0.06em;

            cursor: pointer;

            text-shadow:
                0 2px 4px
                rgba(0, 0, 0, 0.85);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.45),
                0 3px 10px rgba(0, 0, 0, 0.45);

            transition:
                transform .15s ease,
                filter .15s ease,
                box-shadow .15s ease;
        }


        #prihlasitButton:hover {
            transform: translateY(-2px);

            filter: brightness(1.12);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.55),
                0 5px 16px rgba(0, 0, 0, 0.55),
                0 0 12px rgba(255, 255, 255, 0.12);
        }


        #prihlasitButton:active {
            transform: translateY(1px);
        }


        #prihlasitButton:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
            filter: none;
        }


        /* =========================================================
           CHYBOVÁ HLÁŠKA
           ========================================================= */

        .chyba {
            min-height: 1.4em;

            margin-top: 15px;

            color: #ffb7b7;

            font-size:
                clamp(
                    11px,
                    0.82vw,
                    14px
                );

            font-weight: 700;

            text-align: center;

            text-shadow:
                0 1px 4px
                rgba(0, 0, 0, 0.95);
        }


        /* =========================================================
           MOBILNÍ VERZE
           ========================================================= */
@media
(max-width: 700px)
and
(orientation: portrait) {

    .stage {
        width: 100vw;
        height: 100dvh;

        background-image: url("login-mobil.png");

        /*
           Větší přiblížení pozadí = zároveň bude
           větší logo KovoHladil v obrázku.
        */
        background-size: auto 135%;

        /*
           Posun obrázku tak, aby logo zůstalo dobře viditelné.
        */
        background-position: center center;

        background-repeat: no-repeat;
        background-color: #050505;
    }


    .login-box {
        position: absolute;

        left: 50%;
        top: 54%;

        transform: translate(-50%, -50%);

        /*
           PŮVODNĚ 76 %
           Teď formulář využije skoro celou šířku mobilu.
        */
        width: 96%;

        max-width: 480px;

        padding: 0;

        text-align: center;
    }


    label {
        margin-bottom: 8px;

        color: #ffffff;

        font-size: 15px;
        font-weight: 700;

        text-shadow:
            0 1px 4px rgba(0,0,0,.95);
    }


    label:not(:first-of-type) {
        margin-top: 20px;
    }


    input {
        width: 100%;

        /* větší pole */
        min-height: 62px;

        padding: 15px 16px;

        border:
            1px solid rgba(220,220,220,.72);

        border-radius: 9px;

        font-size: 17px;

        background:
            linear-gradient(
                180deg,
                rgba(42,42,42,.95) 0%,
                rgba(14,14,14,.95) 100%
            );

        color: #ffffff;

        text-align: center;

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.12),
            0 2px 8px rgba(0,0,0,.45);
    }


    input::placeholder {
        color: rgba(220,220,220,.60);
    }


    input:focus {
        border-color: #ffffff;

        background:
            linear-gradient(
                180deg,
                rgba(50,50,50,.98) 0%,
                rgba(16,16,16,.98) 100%
            );

        box-shadow:
            0 0 0 2px rgba(255,255,255,.10);
    }


    #prihlasitButton {
        width: 100%;

        /* větší tlačítko */
        min-height: 64px;

        margin-top: 28px;

        padding: 14px 8px;

        border:
            1px solid rgba(255,255,255,.85);

        border-radius: 9px;

        background:
            linear-gradient(
                110deg,
                #eeeeee 0%,
                #9d9d9d 22%,
                #404040 45%,
                #151515 65%,
                #050505 100%
            );

        color: #ffffff;

        font-size: 18px;
        font-weight: 800;

        letter-spacing: .06em;

        text-shadow:
            0 2px 4px rgba(0,0,0,.9);

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.45),
            0 3px 10px rgba(0,0,0,.45);
    }


    .chyba {
        margin-top: 12px;
        font-size: 12px;
    }
}

        /* =========================================================
           MENŠÍ MOBILY
           ========================================================= */

        @media
        (max-width: 390px)
        and
        (orientation: portrait) {

            .stage {
                /*
                    Na malých telefonech ještě lehce větší zoom.
                */
                background-size:
                    auto 120%;
            }


            .login-box {
                top: 52%;

                width: 80%;
            }


            input {
                min-height: 48px;
            }


            #prihlasitButton {
                min-height: 50px;

                margin-top: 22px;
            }
        }


        /* =========================================================
           MOBIL NA ŠÍŘKU
           ========================================================= */

        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            .stage {
                width: 100vw;
                height: 100dvh;

                background-image:
                    url("login-pc.png");

                background-size: cover;

                background-position:
                    center center;
            }


            .login-box {
                left: 50%;

                top: 54%;

                transform:
                    translate(-50%, -50%);

                width: 31%;

                max-width: 470px;
            }


            label {
                font-size: 11px;

                margin-bottom: 4px;
            }


            label:not(:first-of-type) {
                margin-top: 8px;
            }


            input {
                min-height: 36px;

                padding: 7px 10px;

                font-size: 13px;
            }


            #prihlasitButton {
                min-height: 38px;

                margin-top: 12px;

                padding: 7px;

                font-size: 13px;
            }


            .chyba {
                margin-top: 5px;

                font-size: 10px;
            }
        }


        /* =========================================================
           VELMI ŠIROKÉ PC MONITORY
           ========================================================= */

        @media
        (min-aspect-ratio: 19/9)
        and
        (min-width: 701px) {

            .stage {
                /*
                    Na ultra-wide monitoru se pozadí dál roztáhne
                    přes celý monitor bez bočních prázdných pásů.
                */
                background-size: cover;

                background-position:
                    center center;
            }


            .login-box {
                width: min(29vw, 590px);
            }
        }

    </style>
</head>


<body>

    <main
        class="stage"
        aria-label="KovoHladil přihlášení"
    >

        <form
            class="login-box"
            id="loginForm"
            autocomplete="on"
        >

            <label for="osobniCislo">
                Osobní číslo
            </label>


            <input
                type="text"
                id="osobniCislo"
                inputmode="numeric"
                autocomplete="username"
                placeholder="např. 1"
                enterkeyhint="next"
            >


            <label for="heslo">
                Heslo
            </label>


            <input
                type="password"
                id="heslo"
                autocomplete="current-password"
                placeholder="Zadej heslo"
                enterkeyhint="go"
            >


            <button
                type="submit"
                id="prihlasitButton"
            >
                PŘIHLÁSIT
            </button>


            <div
                id="chyba"
                class="chyba"
                role="alert"
                aria-live="polite"
            ></div>

        </form>

    </main>


    <script>

        /* =========================================================
           SUPABASE
           ========================================================= */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================================
           PŘIHLÁŠENÍ
           ========================================================= */

        async function prihlasit() {

            const osobniCislo =
                document
                    .getElementById("osobniCislo")
                    .value
                    .trim();


            const heslo =
                document
                    .getElementById("heslo")
                    .value;


            const chyba =
                document
                    .getElementById("chyba");


            const button =
                document
                    .getElementById("prihlasitButton");


            chyba.textContent = "";


            if (
                osobniCislo === "" ||
                heslo === ""
            ) {

                chyba.textContent =
                    "Vyplň osobní číslo a heslo.";

                return;
            }


            const email =
                osobniCislo +
                "@kovohladil.local";


            button.disabled = true;

            button.textContent =
                "PŘIHLAŠUJI...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: heslo

                        });


                if (error) {

                    chyba.textContent =
                        "Nesprávné osobní číslo nebo heslo.";


                    button.disabled = false;

                    button.textContent =
                        "PŘIHLÁSIT";

                    return;
                }


                if (data.session) {

                    window.location.replace(
                        "index.html"
                    );

                    return;
                }


                chyba.textContent =
                    "Přihlášení se nepodařilo.";


                button.disabled = false;

                button.textContent =
                    "PŘIHLÁSIT";


            } catch (error) {

                console.error(error);


                chyba.textContent =
                    "Nepodařilo se připojit k serveru.";


                button.disabled = false;

                button.textContent =
                    "PŘIHLÁSIT";

            }

        }


        /* =========================================================
           ENTER / ODESLÁNÍ FORMULÁŘE
           ========================================================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    prihlasit();

                }
            );


        /* =========================================================
           KONTROLA PŘIHLÁŠENÍ
           ========================================================= */

        async function zkontrolujPrihlaseni() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (
                    !error &&
                    data.session
                ) {

                    window.location.replace(
                        "index.html"
                    );

                }


            } catch (error) {

                console.error(
                    "Kontrola přihlášení:",
                    error
                );

            }

        }


        /* =========================================================
           START
           ========================================================= */

        zkontrolujPrihlaseni();

    </script>

</body>
</html>
