<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>KOVOHLADIL | Přihlášení</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================================================
           ZÁKLAD
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;

            background: #05080c;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        /* =========================================================
           HLAVNÍ PLOCHA - PC
           ========================================================= */

        .stage {
            position: relative;

            width: 100vw;
            height: 100vh;

            background-image:
                url("login-pc.png");

            background-size: cover;

            background-position:
                center center;

            background-repeat:
                no-repeat;

            overflow: hidden;
        }


        /* lehké ztmavení pozadí pro lepší čitelnost */

        .stage::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 0, 0, 0.00) 25%,
                    rgba(0, 0, 0, 0.12) 100%
                );

            pointer-events: none;
        }


        /* =========================================================
           LOGIN BOX
           ========================================================= */

        .login-box {
            position: absolute;

            left: 50%;
            top: 58%;

            transform:
                translate(-50%, -50%);

            width:
                min(36vw, 650px);

            padding:
                32px 34px 30px;

            border:
                1px solid
                rgba(255, 255, 255, 0.35);

            border-radius:
                22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(16, 42, 61, 0.58) 0%,
                    rgba(25, 31, 38, 0.64) 48%,
                    rgba(62, 32, 17, 0.58) 100%
                );

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.15),
                0 0 18px rgba(39,157,255,.14),
                0 0 26px rgba(255,126,27,.08),
                0 12px 35px rgba(0,0,0,.42);

            z-index: 10;
        }


        /* =========================================================
           POPISKY
           ========================================================= */

        label {
            display: block;

            width: 100%;

            margin:
                0 0 8px 4px;

            text-align: left;

            color: #ffffff;

            font-size:
                clamp(
                    13px,
                    0.95vw,
                    17px
                );

            font-weight: 800;

            letter-spacing:
                0.03em;

            text-shadow:
                0 2px 5px
                rgba(0,0,0,.9);
        }


        label:not(:first-of-type) {
            margin-top: 22px;
        }


        /* =========================================================
           INPUTY
           ========================================================= */

        input {
            display: block;

            width: 100%;

            min-height: 64px;

            padding:
                15px 20px;

            border:
                1.5px solid
                rgba(230, 240, 248, 0.78);

            border-radius:
                14px;

            outline: none;


            /* modrá -> kov -> tmavá -> oranžová */

            background:
                linear-gradient(
                    105deg,

                    rgba(38, 139, 203, 0.82) 0%,

                    rgba(63, 119, 151, 0.78) 22%,

                    rgba(53, 64, 72, 0.88) 45%,

                    rgba(42, 38, 37, 0.92) 68%,

                    rgba(132, 67, 29, 0.86) 100%
                );

            color:
                #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size:
                clamp(
                    15px,
                    1.05vw,
                    19px
                );

            font-weight: 700;

            text-align: center;

            text-shadow:
                0 2px 4px
                rgba(0,0,0,.8);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.28),
                inset 0 -1px 0 rgba(0,0,0,.30),
                0 5px 14px rgba(0,0,0,.30);

            transition:
                transform .18s ease,
                border-color .18s ease,
                box-shadow .18s ease,
                filter .18s ease;
        }


        input::placeholder {
            color:
                rgba(255,255,255,.62);

            font-weight: 500;

            text-shadow:
                0 1px 3px
                rgba(0,0,0,.75);
        }


        input:hover {
            border-color:
                rgba(255,255,255,.95);

            filter:
                brightness(1.06);
        }


        input:focus {
            border-color:
                rgba(255,255,255,1);

            filter:
                brightness(1.10);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.35),

                0 0 0 2px rgba(255,255,255,.12),

                -4px 0 18px rgba(0,150,255,.30),

                4px 0 18px rgba(255,120,25,.22),

                0 6px 18px rgba(0,0,0,.38);
        }


        /* =========================================================
           TLAČÍTKO PŘIHLÁSIT
           ========================================================= */

        #prihlasitButton {
            position: relative;

            width: 100%;

            min-height: 72px;

            margin-top: 30px;

            padding:
                15px 15px;

            border:
                1.5px solid
                rgba(235,245,250,.90);

            border-radius:
                15px;


            /* stejný styl jako tlačítka skladu */

            background:
                linear-gradient(
                    105deg,

                    #278dcc 0%,

                    #3d7799 20%,

                    #39434a 42%,

                    #302d2c 65%,

                    #8c451e 100%
                );

            color:
                #ffffff;

            font-size:
                clamp(
                    18px,
                    1.35vw,
                    24px
                );

            font-weight:
                900;

            letter-spacing:
                .045em;

            cursor:
                pointer;

            text-shadow:
                0 3px 5px
                rgba(0,0,0,.9);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.38),
                inset 0 -1px 0 rgba(0,0,0,.35),

                -5px 0 15px rgba(0,145,255,.13),

                5px 0 15px rgba(255,115,20,.10),

                0 7px 18px rgba(0,0,0,.38);

            transition:
                transform .16s ease,
                filter .16s ease,
                box-shadow .16s ease;
        }


        #prihlasitButton:hover {
            transform:
                translateY(-2px);

            filter:
                brightness(1.13);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.48),

                -7px 0 20px rgba(0,150,255,.24),

                7px 0 20px rgba(255,115,20,.20),

                0 9px 22px rgba(0,0,0,.46);
        }


        #prihlasitButton:active {
            transform:
                translateY(1px);

            filter:
                brightness(.96);
        }


        #prihlasitButton:disabled {
            opacity: .65;

            cursor: wait;

            transform: none;

            filter: none;
        }


        /* =========================================================
           CHYBOVÁ HLÁŠKA
           ========================================================= */

        .chyba {
            min-height: 1.4em;

            margin-top: 14px;

            color:
                #ffd1c5;

            font-size:
                clamp(
                    11px,
                    .82vw,
                    14px
                );

            font-weight:
                800;

            text-align:
                center;

            text-shadow:
                0 2px 5px
                rgba(0,0,0,.95);
        }



        /* =========================================================
           MOBIL
           ========================================================= */

        @media
        (max-width: 700px)
        and
        (orientation: portrait) {

            .stage {
                width: 100vw;
                height: 100dvh;

                background-image:
                    url("login-mobil.png");

                background-size:
                    cover;

                background-position:
                    center center;

                background-repeat:
                    no-repeat;
            }


            .login-box {
                left: 50%;
                top: 56%;

                transform:
                    translate(-50%, -50%);

                width: 88%;

                max-width:
                    480px;

                padding:
                    24px 18px 22px;

                border-radius:
                    20px;

                background:
                    linear-gradient(
                        135deg,
                        rgba(14,45,67,.61) 0%,
                        rgba(25,31,37,.68) 50%,
                        rgba(70,35,17,.60) 100%
                    );

                backdrop-filter:
                    blur(6px);

                -webkit-backdrop-filter:
                    blur(6px);
            }


            label {
                margin-left: 3px;

                margin-bottom:
                    7px;

                font-size:
                    14px;
            }


            label:not(:first-of-type) {
                margin-top:
                    18px;
            }


            input {
                min-height:
                    60px;

                padding:
                    14px 14px;

                border-radius:
                    13px;

                font-size:
                    16px;
            }


            #prihlasitButton {
                min-height:
                    66px;

                margin-top:
                    26px;

                border-radius:
                    14px;

                font-size:
                    19px;
            }


            .chyba {
                margin-top:
                    11px;

                font-size:
                    12px;
            }
        }



        /* =========================================================
           MENŠÍ MOBILY
           ========================================================= */

        @media
        (max-width: 390px)
        and
        (orientation: portrait) {

            .login-box {
                top: 56%;

                width: 91%;

                padding:
                    20px 15px;
            }


            label {
                font-size:
                    13px;
            }


            label:not(:first-of-type) {
                margin-top:
                    15px;
            }


            input {
                min-height:
                    54px;

                font-size:
                    15px;
            }


            #prihlasitButton {
                min-height:
                    58px;

                margin-top:
                    21px;

                font-size:
                    17px;
            }
        }



        /* =========================================================
           MOBIL NA ŠÍŘKU
           ========================================================= */

        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            .stage {
                width: 100vw;
                height: 100dvh;

                background-image:
                    url("login-pc.png");

                background-size:
                    cover;

                background-position:
                    center center;
            }


            .login-box {
                left: 50%;
                top: 55%;

                width:
                    min(42%, 500px);

                padding:
                    14px 18px;

                border-radius:
                    15px;
            }


            label {
                font-size:
                    11px;

                margin-bottom:
                    4px;
            }


            label:not(:first-of-type) {
                margin-top:
                    7px;
            }


            input {
                min-height:
                    38px;

                padding:
                    7px 10px;

                border-radius:
                    8px;

                font-size:
                    13px;
            }


            #prihlasitButton {
                min-height:
                    42px;

                margin-top:
                    11px;

                padding:
                    7px;

                border-radius:
                    8px;

                font-size:
                    14px;
            }


            .chyba {
                margin-top:
                    4px;

                font-size:
                    10px;
            }
        }



        /* =========================================================
           ULTRAWIDE PC
           ========================================================= */

        @media
        (min-aspect-ratio: 19/9)
        and
        (min-width: 701px) {

            .stage {
                background-size:
                    cover;

                background-position:
                    center center;
            }


            .login-box {
                width:
                    min(33vw, 650px);
            }
        }

    </style>
</head>


<body>


    <main
        class="stage"
        aria-label="KovoHladil přihlášení"
    >


        <form
            class="login-box"
            id="loginForm"
            autocomplete="on"
        >


            <label for="osobniCislo">
                Osobní číslo
            </label>


            <input
                type="text"
                id="osobniCislo"
                inputmode="numeric"
                autocomplete="username"
                placeholder="např. 1"
                enterkeyhint="next"
            >


            <label for="heslo">
                Heslo
            </label>


            <input
                type="password"
                id="heslo"
                autocomplete="current-password"
                placeholder="Zadej heslo"
                enterkeyhint="go"
            >


            <button
                type="submit"
                id="prihlasitButton"
            >
                PŘIHLÁSIT
            </button>


            <div
                id="chyba"
                class="chyba"
                role="alert"
                aria-live="polite"
            ></div>


        </form>


    </main>



    <script>

        /* =========================================================
           SUPABASE
           ========================================================= */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =========================================================
           PŘIHLÁŠENÍ
           ========================================================= */

        async function prihlasit() {


            const osobniCislo =
                document
                    .getElementById("osobniCislo")
                    .value
                    .trim();


            const heslo =
                document
                    .getElementById("heslo")
                    .value;


            const chyba =
                document
                    .getElementById("chyba");


            const button =
                document
                    .getElementById("prihlasitButton");


            chyba.textContent = "";


            if (
                osobniCislo === "" ||
                heslo === ""
            ) {

                chyba.textContent =
                    "Vyplň osobní číslo a heslo.";

                return;
            }


            const email =
                osobniCislo +
                "@kovohladil.local";


            button.disabled = true;

            button.textContent =
                "PŘIHLAŠUJI...";


            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: heslo

                        });


                if (error) {

                    chyba.textContent =
                        "Nesprávné osobní číslo nebo heslo.";

                    button.disabled = false;

                    button.textContent =
                        "PŘIHLÁSIT";

                    return;
                }


                if (data.session) {

                    window.location.replace(
                        "index.html"
                    );

                    return;
                }


                chyba.textContent =
                    "Přihlášení se nepodařilo.";


                button.disabled = false;

                button.textContent =
                    "PŘIHLÁSIT";


            } catch (error) {


                console.error(error);


                chyba.textContent =
                    "Nepodařilo se připojit k serveru.";


                button.disabled = false;

                button.textContent =
                    "PŘIHLÁSIT";

            }

        }



        /* =========================================================
           ENTER / ODESLÁNÍ FORMULÁŘE
           ========================================================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    prihlasit();

                }
            );



        /* =========================================================
           KONTROLA PŘIHLÁŠENÍ
           ========================================================= */

        async function zkontrolujPrihlaseni() {


            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (
                    !error &&
                    data.session
                ) {

                    window.location.replace(
                        "index.html"
                    );

                }


            } catch (error) {


                console.error(
                    "Kontrola přihlášení:",
                    error
                );

            }

        }



        /* =========================================================
           START
           ========================================================= */

        zkontrolujPrihlaseni();


    </script>


</body>
</html>
