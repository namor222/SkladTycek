<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>KOVOHLADIL | Přihlášení</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: #04182a;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* =========================================================
           PC VERZE
        ========================================================= */

        .stage {
            position: relative;

            width: min(
                100vw,
                calc(100vh * 16 / 9)
            );

            height: min(
                100vh,
                calc(100vw * 9 / 16)
            );

            margin: auto;

            background:
                url("login-pc.png")
                center center /
                100% 100%
                no-repeat;

            overflow: hidden;
        }


        /* =========================================================
           PŘIHLAŠOVACÍ FORMULÁŘ - PC
        ========================================================= */

        .login-box {
            position: absolute;

            left: 50%;
            top: 56%;

            transform: translate(-50%, -50%);

            width: 29%;

            z-index: 10;

            text-align: center;
        }


        /* =========================================================
           INTERNÍ SYSTÉM
           POSUNUTO JEŠTĚ VÍCE DOLŮ
        ========================================================= */

        .login-subtitle {
            position: relative;

            /* NOVĚ 36px DOLŮ */
            top: 36px;

            margin-bottom: calc(7% + 36px);

            color: #a9dfff;

            font-size: clamp(
                10px,
                0.85vw,
                15px
            );

            letter-spacing: 0.12em;
        }


        /* =========================================================
           POPISKY
        ========================================================= */

        label {
            display: block;

            width: 100%;

            margin:
                0
                0
                2%
                0;

            text-align: left;

            color: #ffffff;

            font-size: clamp(
                11px,
                0.9vw,
                16px
            );

            font-weight: 700;

            text-shadow:
                0 1px 3px
                rgba(0,0,0,.7);
        }


        label:not(:first-of-type) {
            margin-top: 5%;
        }


        /* =========================================================
           INPUTY
        ========================================================= */

        input {
            display: block;

            width: 100%;

            padding:
                clamp(10px, 1vw, 16px)
                clamp(12px, 1.2vw, 20px);

            border:
                1px solid
                rgba(66, 190, 255, 0.75);

            border-radius:
                clamp(8px, 0.7vw, 13px);

            outline: none;

            background:
                rgba(2, 23, 46, 0.78);

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size:
                clamp(
                    13px,
                    1.05vw,
                    18px
                );

            text-align: center;

            box-shadow:
                inset 0 0 12px
                rgba(0, 132, 255, 0.10),

                0 0 8px
                rgba(0, 174, 255, 0.10);

            transition:
                border-color .18s ease,
                box-shadow .18s ease,
                background .18s ease;
        }


        input::placeholder {
            color:
                rgba(210, 231, 245, 0.58);
        }


        input:focus {
            border-color: #00c8ff;

            background:
                rgba(2, 28, 54, 0.92);

            box-shadow:
                0 0 0 2px
                rgba(0, 196, 255, 0.15),

                0 0 18px
                rgba(0, 196, 255, 0.28);
        }


        /* =========================================================
           TLAČÍTKO PŘIHLÁSIT
        ========================================================= */

        #prihlasitButton {
            width: 100%;

            margin-top: 8%;

            padding:
                clamp(11px, 1.1vw, 17px)
                10px;

            border:
                1px solid
                rgba(76, 211, 255, 0.95);

            border-radius:
                clamp(8px, 0.7vw, 13px);

            background:
                linear-gradient(
                    180deg,
                    #159cf0 0%,
                    #0875ce 48%,
                    #04539d 100%
                );

            color: #ffffff;

            font-size:
                clamp(
                    13px,
                    1.15vw,
                    20px
                );

            font-weight: 800;

            letter-spacing: 0.06em;

            cursor: pointer;

            text-shadow:
                0 1px 3px
                rgba(0,0,0,.55);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,.35),

                0 0 15px
                rgba(0,170,255,.25);

            transition:
                transform .15s ease,
                filter .15s ease,
                box-shadow .15s ease;
        }


        #prihlasitButton:hover {
            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,.4),

                0 0 22px
                rgba(0,190,255,.42);
        }


        #prihlasitButton:active {
            transform: translateY(1px);
        }


        #prihlasitButton:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
            filter: none;
        }


        /* =========================================================
           CHYBA
        ========================================================= */

        .chyba {
            min-height: 1.4em;

            margin-top: 5%;

            color: #ffb4b4;

            font-size:
                clamp(
                    10px,
                    0.82vw,
                    14px
                );

            font-weight: 700;

            text-align: center;

            text-shadow:
                0 1px 3px
                rgba(0,0,0,.8);
        }


        /* =========================================================
           SPODNÍ INFORMACE
        ========================================================= */

        .info {
            margin-top: 3%;

            color:
                rgba(220, 238, 250, 0.72);

            font-size:
                clamp(
                    9px,
                    0.72vw,
                    13px
                );

            text-align: center;
        }


        /* =========================================================
           MOBIL NA VÝŠKU
        ========================================================= */

        @media
        (max-width: 700px)
        and
        (orientation: portrait) {

            body {
                min-height: 100dvh;
                overflow: hidden;
                background: #03182c;
            }


            .stage {
                position: relative;

                width: 100vw;
                height: 100dvh;

                margin: 0;

                background-image:
                    url("login-mobil.png");

                background-position:
                    center center;

                background-size:
                    cover;

                background-repeat:
                    no-repeat;
            }


            .login-box {
                left: 50%;
                top: 53%;

                transform:
                    translate(-50%, -50%);

                width: 68%;

                max-width: none;

                padding: 0;
            }


            /* INTERNÍ SYSTÉM - TAKÉ 36px DOLŮ */

            .login-subtitle {
                position: relative;

                top: 36px;

                margin-bottom:
                    calc(7% + 36px);

                font-size:
                    clamp(
                        10px,
                        3vw,
                        14px
                    );
            }


            label {
                margin-bottom: 2.2%;

                font-size:
                    clamp(
                        12px,
                        3.5vw,
                        16px
                    );
            }


            label:not(:first-of-type) {
                margin-top: 5%;
            }


            input {
                min-height: 48px;

                padding:
                    12px
                    14px;

                border-radius: 10px;

                font-size: 16px;

                background:
                    rgba(
                        0,
                        18,
                        38,
                        .78
                    );
            }


            #prihlasitButton {
                min-height: 50px;

                margin-top: 8%;

                padding:
                    12px
                    8px;

                border-radius: 10px;

                font-size: 16px;
            }


            .chyba {
                margin-top: 5%;

                font-size: 12px;
            }


            .info {
                margin-top: 3%;

                font-size: 10px;
            }

        }


        /* =========================================================
           MENŠÍ MOBILY
        ========================================================= */

        @media
        (max-width: 390px)
        and
        (orientation: portrait) {

            .login-box {
                top: 53%;
                width: 70%;
            }

            input {
                min-height: 44px;
            }

            #prihlasitButton {
                min-height: 46px;
            }

        }


        /* =========================================================
           MOBIL NA ŠÍŘKU
        ========================================================= */

        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            .login-box {
                top: 55%;
                width: 27%;
            }

            .login-subtitle {
                top: 36px;

                margin-bottom:
                    calc(3% + 36px);
            }

            label:not(:first-of-type) {
                margin-top: 3%;
            }

            #prihlasitButton {
                margin-top: 4%;
            }

            .chyba {
                margin-top: 2%;
            }

            .info {
                margin-top: 1%;
            }

        }

    </style>
</head>


<body>

    <main
        class="stage"
        aria-label="KovoHladil přihlášení"
    >

        <form
            class="login-box"
            id="loginForm"
            autocomplete="on"
        >

            <div class="login-subtitle">
                INTERNÍ SYSTÉM
            </div>


            <label for="osobniCislo">
                Osobní číslo
            </label>

            <input
                type="text"
                id="osobniCislo"
                inputmode="numeric"
                autocomplete="username"
                placeholder="např. 1"
                enterkeyhint="next"
            >


            <label for="heslo">
                Heslo
            </label>

            <input
                type="password"
                id="heslo"
                autocomplete="current-password"
                placeholder="Zadej heslo"
                enterkeyhint="go"
            >


            <button
                type="submit"
                id="prihlasitButton"
            >
                PŘIHLÁSIT
            </button>


            <div
                id="chyba"
                class="chyba"
                role="alert"
                aria-live="polite"
            ></div>


            <div class="info">
                Přístup pouze pro oprávněné pracovníky.
            </div>

        </form>

    </main>


    <script>

        /* =========================================================
           SUPABASE
        ========================================================= */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================================
           PŘIHLÁŠENÍ
        ========================================================= */

        async function prihlasit() {

            const osobniCislo =
                document
                    .getElementById("osobniCislo")
                    .value
                    .trim();


            const heslo =
                document
                    .getElementById("heslo")
                    .value;


            const chyba =
                document
                    .getElementById("chyba");


            const button =
                document
                    .getElementById("prihlasitButton");


            chyba.textContent = "";


            if (
                osobniCislo === "" ||
                heslo === ""
            ) {

                chyba.textContent =
                    "Vyplň osobní číslo a heslo.";

                return;
            }


            const email =
                osobniCislo +
                "@kovohladil.local";


            button.disabled = true;

            button.textContent =
                "PŘIHLAŠUJI...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: heslo

                        });


                if (error) {

                    chyba.textContent =
                        "Nesprávné osobní číslo nebo heslo.";

                    button.disabled = false;

                    button.textContent =
                        "PŘIHLÁSIT";

                    return;
                }


                if (data.session) {

                    window.location.replace(
                        "index.html"
                    );

                    return;
                }


                chyba.textContent =
                    "Přihlášení se nepodařilo.";


                button.disabled = false;

                button.textContent =
                    "PŘIHLÁSIT";


            } catch (error) {

                console.error(error);


                chyba.textContent =
                    "Nepodařilo se připojit k serveru.";


                button.disabled = false;

                button.textContent =
                    "PŘIHLÁSIT";

            }

        }


        /* =========================================================
           ENTER / ODESLÁNÍ FORMULÁŘE
        ========================================================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    prihlasit();

                }
            );


        /* =========================================================
           KONTROLA PŘIHLÁŠENÍ
        ========================================================= */

        async function zkontrolujPrihlaseni() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (
                    !error &&
                    data.session
                ) {

                    window.location.replace(
                        "index.html"
                    );

                }

            } catch (error) {

                console.error(
                    "Kontrola přihlášení:",
                    error
                );

            }

        }


        /* =========================================================
           START
        ========================================================= */

        zkontrolujPrihlaseni();

    </script>

</body>
</html>
