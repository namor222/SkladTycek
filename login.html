<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>KOVOHLADIL | Přihlášení</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================================================
           ZÁKLAD
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #101c2c;
        }

        body {
            min-height: 100vh;
            background: #e9eef3;
        }

        button,
        input {
            font: inherit;
        }


        /* =========================================================
           HLAVNÍ POZADÍ
           ========================================================= */

        .stage {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(32px, env(safe-area-inset-top))
                24px
                max(32px, env(safe-area-inset-bottom));

            background-image:
                url("login-pc.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            overflow: hidden;
        }


        /* jemná světlá vrstva přes fotografii */

        .stage::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(235, 242, 248, 0.16),
                    rgba(255, 255, 255, 0.05) 45%,
                    rgba(225, 234, 242, 0.13)
                );

            pointer-events: none;
        }


        /* =========================================================
           LOGIN PANEL
           ========================================================= */

        .login-card {
            position: relative;
            z-index: 2;

            width: min(430px, 92vw);

            padding:
                38px
                36px
                34px;

            background:
                rgba(255, 255, 255, 0.95);

            border:
                1px solid
                rgba(208, 217, 227, 0.95);

            border-radius: 15px;

            box-shadow:
                0 18px 55px rgba(20, 40, 60, 0.16),
                0 3px 10px rgba(20, 40, 60, 0.08);

            backdrop-filter:
                blur(4px);

            -webkit-backdrop-filter:
                blur(4px);
        }


        /* =========================================================
           LOGO
           ========================================================= */

        .logo-wrap {
            width: 100%;

            display: flex;
            justify-content: center;

            margin-bottom: 27px;
        }

        .logo {
            display: block;

            width: 100%;
            max-width: 305px;
            height: auto;

            object-fit: contain;
        }


        /* =========================================================
           NADPIS
           ========================================================= */

        .login-header {
            text-align: center;

            margin-bottom: 29px;
        }

        .login-header h1 {
            margin:
                0
                0
                6px;

            font-size: 25px;
            line-height: 1.15;

            font-weight: 800;

            color: #101b2c;
        }

        .login-header p {
            margin: 0;

            color: #64748b;

            font-size: 14px;
            line-height: 1.4;

            font-weight: 500;
        }


        /* =========================================================
           FORMULÁŘ
           ========================================================= */

        .field {
            position: relative;

            width: 100%;

            margin-bottom: 15px;
        }


        /* =========================================================
           IKONY V INPUTECH
           ========================================================= */

        .field-icon {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            width: 20px;
            height: 20px;

            color: #71849b;

            pointer-events: none;

            z-index: 2;
        }

        .field-icon svg {
            display: block;

            width: 100%;
            height: 100%;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =========================================================
           INPUT
           ========================================================= */

        .field input {
            display: block;

            width: 100%;
            height: 54px;

            padding:
                0
                48px
                0
                48px;

            border:
                1px solid
                #ccd5df;

            border-radius: 8px;

            outline: none;

            background:
                rgba(255, 255, 255, 0.98);

            color: #152235;

            font-size: 15px;
            font-weight: 600;

            transition:
                border-color .18s ease,
                box-shadow .18s ease,
                background .18s ease;
        }

        .field input::placeholder {
            color: #8998aa;
            font-weight: 500;
        }

        .field input:hover {
            border-color: #aab9c8;
        }

        .field input:focus {
            border-color: #1676e8;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(22, 118, 232, 0.10);
        }

        .field:focus-within .field-icon {
            color: #1676e8;
        }


        /* =========================================================
           ZOBRAZENÍ HESLA
           ========================================================= */

        .password-toggle {
            position: absolute;

            right: 13px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 34px;
            height: 34px;

            padding: 7px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 6px;

            background: transparent;

            color: #71849b;

            cursor: pointer;
        }

        .password-toggle:hover {
            color: #1676e8;

            background:
                rgba(22, 118, 232, 0.07);
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =========================================================
           PŘIHLÁSIT
           ========================================================= */

        #prihlasitButton {
            width: 100%;
            height: 56px;

            margin-top: 7px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            border: 0;
            border-radius: 8px;

            background:
                linear-gradient(
                    180deg,
                    #1182f2 0%,
                    #0868d8 100%
                );

            color: #ffffff;

            font-size: 16px;
            font-weight: 800;

            letter-spacing:
                0.025em;

            cursor: pointer;

            box-shadow:
                0 7px 16px
                rgba(0, 105, 220, 0.20);

            transition:
                transform .16s ease,
                box-shadow .16s ease,
                filter .16s ease;
        }

        #prihlasitButton:hover {
            transform:
                translateY(-1px);

            filter:
                brightness(1.04);

            box-shadow:
                0 9px 20px
                rgba(0, 105, 220, 0.25);
        }

        #prihlasitButton:active {
            transform:
                translateY(1px);
        }

        #prihlasitButton:disabled {
            opacity: .65;

            cursor: wait;

            transform: none;
        }

        .login-arrow {
            font-size: 22px;
            line-height: 1;
        }


        /* =========================================================
           CHYBA
           ========================================================= */

        .chyba {
            min-height: 18px;

            margin-top: 13px;

            color: #d93434;

            font-size: 13px;
            line-height: 1.4;

            font-weight: 700;

            text-align: center;
        }


        /* =========================================================
           MOBIL
           ========================================================= */

        @media
        (max-width: 700px)
        and
        (orientation: portrait) {

            body {
                background: #e8edf2;
            }

            .stage {
                min-height: 100dvh;

                padding:
                    max(20px, env(safe-area-inset-top))
                    18px
                    max(20px, env(safe-area-inset-bottom));

                background-image:
                    url("login-mobil.png");

                background-size: cover;

                background-position:
                    center center;
            }


            /*
               Na mobilu lehce zvýšíme kontrast pozadí,
               ale necháme ho pořád světlé.
            */

            .stage::before {
                background:
                    rgba(238, 244, 248, 0.08);
            }

            .login-card {
                width: min(88vw, 410px);

                padding:
                    30px
                    24px
                    27px;

                border-radius: 14px;

                background:
                    rgba(255, 255, 255, 0.96);

                box-shadow:
                    0 16px 42px
                    rgba(20, 40, 60, 0.17);
            }

            .logo-wrap {
                margin-bottom: 23px;
            }

            .logo {
                max-width: 280px;
            }

            .login-header {
                margin-bottom: 25px;
            }

            .login-header h1 {
                font-size: 23px;
            }

            .login-header p {
                font-size: 13px;
            }

            .field {
                margin-bottom: 14px;
            }

            .field input {
                height: 54px;

                font-size: 16px;
            }

            #prihlasitButton {
                height: 56px;

                font-size: 16px;
            }
        }


        /* =========================================================
           MALÉ MOBILY
           ========================================================= */

        @media
        (max-width: 390px)
        and
        (orientation: portrait) {

            .stage {
                padding-left: 14px;
                padding-right: 14px;
            }

            .login-card {
                width: 92vw;

                padding:
                    25px
                    20px
                    23px;
            }

            .logo {
                max-width: 250px;
            }

            .login-header h1 {
                font-size: 21px;
            }

            .login-header p {
                font-size: 12px;
            }

            .field input {
                height: 51px;
            }

            #prihlasitButton {
                height: 53px;
            }
        }


        /* =========================================================
           MOBIL NA ŠÍŘKU
           ========================================================= */

        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            .stage {
                min-height: 100dvh;

                padding:
                    15px
                    20px;

                background-image:
                    url("login-pc.png");
            }

            .login-card {
                width: min(390px, 46vw);

                padding:
                    18px
                    24px
                    15px;
            }

            .logo-wrap {
                margin-bottom: 10px;
            }

            .logo {
                max-width: 230px;
            }

            .login-header {
                margin-bottom: 13px;
            }

            .login-header h1 {
                font-size: 18px;

                margin-bottom: 2px;
            }

            .login-header p {
                font-size: 10px;
            }

            .field {
                margin-bottom: 8px;
            }

            .field input {
                height: 42px;

                font-size: 13px;
            }

            #prihlasitButton {
                height: 43px;

                margin-top: 3px;

                font-size: 13px;
            }

            .chyba {
                margin-top: 5px;

                min-height: 12px;

                font-size: 10px;
            }
        }


        /* =========================================================
           VĚTŠÍ MONITORY
           ========================================================= */

        @media
        (min-width: 1600px) {

            .login-card {
                width: 445px;

                padding:
                    42px
                    40px
                    36px;
            }

            .logo {
                max-width: 320px;
            }
        }

    </style>
</head>


<body>


    <main
        class="stage"
        aria-label="KovoHladil přihlášení"
    >


        <form
            class="login-card"
            id="loginForm"
            autocomplete="on"
        >


            <!-- ================================
                 LOGO
                 ================================ -->

            <div class="logo-wrap">

                <img
                    src="logo.png"
                    alt="KovoHladil"
                    class="logo"
                >

            </div>


            <!-- ================================
                 NADPIS
                 ================================ -->

            <div class="login-header">

                <h1>
                    Přihlášení
                </h1>

                <p>
                    Přístup do interního skladu
                </p>

            </div>


            <!-- ================================
                 OSOBNÍ ČÍSLO
                 ================================ -->

            <div class="field">


                <span
                    class="field-icon"
                    aria-hidden="true"
                >

                    <svg
                        viewBox="0 0 24 24"
                    >

                        <circle
                            cx="12"
                            cy="8"
                            r="4"
                        ></circle>

                        <path
                            d="M4.5 20c.7-4.1 3.2-6 7.5-6s6.8 1.9 7.5 6"
                        ></path>

                    </svg>

                </span>


                <input
                    type="text"
                    id="osobniCislo"
                    inputmode="numeric"
                    autocomplete="username"
                    placeholder="Osobní číslo"
                    enterkeyhint="next"
                    aria-label="Osobní číslo"
                >


            </div>


            <!-- ================================
                 HESLO
                 ================================ -->

            <div class="field">


                <span
                    class="field-icon"
                    aria-hidden="true"
                >

                    <svg
                        viewBox="0 0 24 24"
                    >

                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                        ></rect>

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        ></path>

                    </svg>

                </span>


                <input
                    type="password"
                    id="heslo"
                    autocomplete="current-password"
                    placeholder="Heslo"
                    enterkeyhint="go"
                    aria-label="Heslo"
                >


                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    aria-label="Zobrazit heslo"
                >

                    <svg
                        viewBox="0 0 24 24"
                    >

                        <path
                            d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="2.5"
                        ></circle>

                    </svg>

                </button>


            </div>


            <!-- ================================
                 PŘIHLÁSIT
                 ================================ -->

            <button
                type="submit"
                id="prihlasitButton"
            >

                <span>
                    PŘIHLÁSIT
                </span>

                <span
                    class="login-arrow"
                    aria-hidden="true"
                >
                    →
                </span>

            </button>


            <div
                id="chyba"
                class="chyba"
                role="alert"
                aria-live="polite"
            ></div>


        </form>


    </main>



    <script>


        /* =========================================================
           SUPABASE
           ========================================================= */

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =========================================================
           ZOBRAZIT / SKRÝT HESLO
           ========================================================= */

        const passwordInput =
            document.getElementById("heslo");

        const passwordToggle =
            document.getElementById("passwordToggle");


        passwordToggle.addEventListener(
            "click",
            function() {

                const jeHeslo =
                    passwordInput.type === "password";


                passwordInput.type =
                    jeHeslo
                        ? "text"
                        : "password";


                passwordToggle.setAttribute(
                    "aria-label",
                    jeHeslo
                        ? "Skrýt heslo"
                        : "Zobrazit heslo"
                );

            }
        );



        /* =========================================================
           PŘIHLÁŠENÍ
           ========================================================= */

        async function prihlasit() {


            const osobniCislo =
                document
                    .getElementById("osobniCislo")
                    .value
                    .trim();


            const heslo =
                document
                    .getElementById("heslo")
                    .value;


            const chyba =
                document
                    .getElementById("chyba");


            const button =
                document
                    .getElementById("prihlasitButton");


            chyba.textContent = "";


            if (
                osobniCislo === "" ||
                heslo === ""
            ) {

                chyba.textContent =
                    "Vyplň osobní číslo a heslo.";

                return;
            }


            const email =
                osobniCislo +
                "@kovohladil.local";


            button.disabled = true;

            button.innerHTML =
                "<span>PŘIHLAŠUJI...</span>";


            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: heslo

                        });


                if (error) {

                    chyba.textContent =
                        "Nesprávné osobní číslo nebo heslo.";

                    obnovTlacitko();

                    return;
                }


                if (data.session) {

                    window.location.replace(
                        "index.html"
                    );

                    return;
                }


                chyba.textContent =
                    "Přihlášení se nepodařilo.";

                obnovTlacitko();


            } catch (error) {


                console.error(error);


                chyba.textContent =
                    "Nepodařilo se připojit k serveru.";


                obnovTlacitko();

            }

        }



        /* =========================================================
           OBNOVENÍ TLAČÍTKA
           ========================================================= */

        function obnovTlacitko() {

            const button =
                document
                    .getElementById("prihlasitButton");


            button.disabled = false;


            button.innerHTML = `
                <span>PŘIHLÁSIT</span>
                <span
                    class="login-arrow"
                    aria-hidden="true"
                >
                    →
                </span>
            `;

        }



        /* =========================================================
           ODESLÁNÍ FORMULÁŘE
           ========================================================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    prihlasit();

                }
            );



        /* =========================================================
           KONTROLA EXISTUJÍCÍHO PŘIHLÁŠENÍ
           ========================================================= */

        async function zkontrolujPrihlaseni() {


            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (
                    !error &&
                    data.session
                ) {

                    window.location.replace(
                        "index.html"
                    );

                }


            } catch (error) {


                console.error(
                    "Kontrola přihlášení:",
                    error
                );

            }

        }



        /* =========================================================
           START
           ========================================================= */

        zkontrolujPrihlaseni();


    </script>


</body>
</html>
