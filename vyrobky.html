<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sklad výrobků</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
            display: none;
        }

        .hlavicka {
            max-width: 600px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zpet {
            color: #1976d2;
            font-weight: bold;
            text-decoration: none;
        }

        .box {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="hlavicka">

        <h1>🏭 Sklad výrobků</h1>

        <a class="zpet" href="index.html">
            ← ZPĚT
        </a>

    </div>

    <div class="box">
        Tato sekce se připravuje.
    </div>


    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function zkontrolujPrihlaseni() {

            const { data, error } =
                await supabaseClient
                    .auth
                    .getSession();

            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "login.html"
                );

                return;
            }

            document.body.style.display =
                "block";
        }


        zkontrolujPrihlaseni();

    </script>

</body>
</html>
