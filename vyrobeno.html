<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vyrobeno</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px 15px;
            text-align: center;
            display: none;
        }

        .hlavicka {
            max-width: 600px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zpet {
            text-decoration: none;
            font-weight: bold;
            color: #1976d2;
        }

        .box {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="hlavicka">

        <h1>🟢 Vyrobeno</h1>

        <a
            class="zpet"
            href="hala.html"
        >
            ← ZPĚT
        </a>

    </div>


    <div class="box">

        Tady později budou zakázky
        čekající na odstředění, praní,
        povrchovou úpravu a řazení.

    </div>


    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function zkontrolujPrihlaseni() {

            const { data, error } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "login.html"
                );

                return;
            }


            document.body.style.display =
                "block";
        }


        zkontrolujPrihlaseni();

    </script>

</body>
</html>
