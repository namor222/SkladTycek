<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rozpracované</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px 15px 40px 15px;
            text-align: center;
            display: none;
        }


        .hlavicka {
            max-width: 800px;
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }


        .hlavicka h1 {
            margin: 0;
            font-size: 28px;
            text-align: left;
        }


        .zpet {
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            color: #1976d2;
            white-space: nowrap;
        }


        .zpet:hover {
            text-decoration: underline;
        }


        /*
            NOVÁ ZAKÁZKA
        */

        .nova-zakazka-box {
            max-width: 800px;
            margin: 0 auto 20px auto;
        }


        .nova-zakazka-box a {
            text-decoration: none;
        }


        .nova-zakazka {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 11px;
            background: #1976d2;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }


        .nova-zakazka:hover {
            background: #1565c0;
        }


        /*
            HLEDÁNÍ
        */

        .hledani {
            max-width: 800px;
            margin: 0 auto 28px auto;
        }


        .hledani input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 17px;
            border: 1px solid #aaa;
            border-radius: 10px;
            text-align: center;
            background: white;
        }


        .obsah {
            max-width: 800px;
            margin: auto;
        }


        /*
            SEKCE
        */

        .sekce {
            margin-bottom: 42px;
        }


        .sekce-nadpis {
            text-align: left;
            font-size: 20px;
            margin-bottom: 15px;
        }


        .pocitadlo {
            display: inline-block;
            background: #ddd;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            margin-left: 6px;
        }


        /*
            KARTY
        */

        .karta {
            background: white;
            margin-bottom: 18px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            text-align: left;
        }


        /*
            NOVÁ ZAKÁZKA
            JEŠTĚ BEZ MATERIÁLU
        */

        .karta-nova {
            border-left: 8px solid #1976d2;
        }


        /*
            MATERIÁL ODEBRÁN
            ČEKÁ NA PRŮVODKU
        */

        .karta-ceka {
            border-left: 8px solid #f57c00;
        }


        /*
            PRŮVODKA HOTOVÁ
        */

        .karta-hotova {
            border-left: 8px solid #28a745;
        }


        .zakazka {
            font-size: 22px;
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 10px;
        }


        .objednavka {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }


        .cislo-objednavky {
            color: #f57c00;
        }


        .material {
            font-size: 19px;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 7px;
        }


        .detail {
            line-height: 1.7;
            font-size: 16px;
        }


        .tavba {
            color: #1976d2;
            font-weight: bold;
        }


        .pocet {
            color: #d32f2f;
            font-weight: bold;
        }


        .termin {
            font-weight: bold;
        }


        .stroj {
            font-weight: bold;
        }


        .stav-bez-materialu {
            display: inline-block;
            margin-top: 14px;
            padding: 7px 11px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }


        .spodni {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
            font-size: 14px;
            color: #555;
        }


        /*
            TLAČÍTKA
        */

        .tlacitko {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }


        .vydat-material {
            background: #1976d2;
            color: white;
        }


        .vydat-material:hover {
            background: #1565c0;
        }


        .vytvorit {
            background: #f57c00;
            color: white;
        }


        .vytvorit:hover {
            background: #e66f00;
        }


        .upravit {
            background: #eeeeee;
            color: #222;
        }


        .upravit:hover {
            background: #dddddd;
        }


        .do-vyroby {
            background: #28a745;
            color: white;
        }


        .do-vyroby:hover {
            background: #218838;
        }


        .tlacitko:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /*
            PRÁZDNÁ SEKCE
        */

        .prazdne {
            background: white;
            padding: 22px;
            border-radius: 12px;
            color: #777;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }


        @media (max-width: 600px) {

            .hlavicka h1 {
                font-size: 22px;
            }

            .zpet {
                font-size: 15px;
            }

            .zakazka {
                font-size: 19px;
            }

            .sekce-nadpis {
                font-size: 17px;
            }

            .nova-zakazka {
                font-size: 17px;
            }
        }

    </style>
</head>


<body>


    <!-- HLAVIČKA -->

    <div class="hlavicka">

        <h1>🛠️ Rozpracované</h1>

        <a
            class="zpet"
            href="hala.html"
        >
            ← ZPĚT
        </a>

    </div>



    <!-- NOVÁ ZAKÁZKA -->

    <div class="nova-zakazka-box">

        <a href="nova-zakazka.html">

            <button class="nova-zakazka">

                ➕ NOVÁ ZAKÁZKA

            </button>

        </a>

    </div>



    <!-- HLEDÁNÍ -->

    <div class="hledani">

        <input
            type="text"
            id="hledat"
            placeholder="🔎 Hledat zakázku, objednávku, tavbu nebo stroj..."
            oninput="zobrazRozpracovane()"
        >

    </div>



    <div class="obsah">


        <!--
            ====================================
            ZAKÁZKY BEZ MATERIÁLU
            ====================================
        -->

        <div class="sekce">

            <h2 class="sekce-nadpis">

                🔵 ZAKÁZKA ČEKÁ NA MATERIÁL

                <span
                    id="pocetNove"
                    class="pocitadlo"
                >
                    0
                </span>

            </h2>


            <div id="seznamNove"></div>

        </div>



        <!--
            ====================================
            ČEKÁ NA PRŮVODKU
            ====================================
        -->

        <div class="sekce">

            <h2 class="sekce-nadpis">

                🟠 ČEKÁ NA PRŮVODKU

                <span
                    id="pocetCeka"
                    class="pocitadlo"
                >
                    0
                </span>

            </h2>


            <div id="seznamCeka"></div>

        </div>



        <!--
            ====================================
            PRŮVODKA VYTVOŘENA
            ====================================
        -->

        <div class="sekce">

            <h2 class="sekce-nadpis">

                🟢 PRŮVODKA VYTVOŘENA

                <span
                    id="pocetHotove"
                    class="pocitadlo"
                >
                    0
                </span>

            </h2>


            <div id="seznamHotove"></div>

        </div>


    </div>



    <script>

        const SUPABASE_URL =
            "https://gmawlmsizglrnjmjegmx.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_vR83XyBMZWGM5r7pf8GizA_AWRmgM9i";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let rozpracovaneData =
            [];


        /*
            ======================================
            OCHRANA PŘIHLÁŠENÍ
            ======================================
        */

        async function zkontrolujPrihlaseni() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {

                window.location.replace(
                    "login.html"
                );

                return;
            }


            /*
                STRÁNKU ZOBRAZÍME
                AŽ PŘIHLÁŠENÉMU UŽIVATELI
            */

            document.body.style.display =
                "block";


            await nactiRozpracovane();
        }



        /*
            ======================================
            NAČTENÍ DAT
            ======================================
        */

        async function nactiRozpracovane() {

            const seznamNove =
                document.getElementById(
                    "seznamNove"
                );


            const seznamCeka =
                document.getElementById(
                    "seznamCeka"
                );


            const seznamHotove =
                document.getElementById(
                    "seznamHotove"
                );


            seznamNove.innerHTML =
                "Načítám...";


            seznamCeka.innerHTML =
                "Načítám...";


            seznamHotove.innerHTML =
                "Načítám...";


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("rozpracovane")
                    .select("*")
                    .in(
                        "stav",
                        [
                            "nova_zakazka",
                            "ceka_na_pruvodku",
                            "pruvodka_vytvorena"
                        ]
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                seznamNove.innerHTML = `

                    <div class="prazdne">

                        Chyba při načítání:<br>
                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;


                seznamCeka.innerHTML =
                    "";


                seznamHotove.innerHTML =
                    "";


                return;
            }


            rozpracovaneData =
                data || [];


            zobrazRozpracovane();
        }



        /*
            ======================================
            FILTR + ROZDĚLENÍ
            ======================================
        */

        function zobrazRozpracovane() {

            const hledat =
                document
                    .getElementById(
                        "hledat"
                    )
                    .value
                    .trim()
                    .toLowerCase();


            let data =
                rozpracovaneData;


            if (
                hledat !== ""
            ) {

                data =
                    rozpracovaneData.filter(
                        polozka => {

                            const zakazka =
                                String(
                                    polozka.cislo_zakazky ||
                                    ""
                                )
                                .toLowerCase();


                            const objednavka =
                                String(
                                    polozka.objednavka ||
                                    ""
                                )
                                .toLowerCase();


                            const atest =
                                String(
                                    polozka.atest ||
                                    ""
                                )
                                .toLowerCase();


                            const stroj =
                                String(
                                    polozka.stroj ||
                                    ""
                                )
                                .toLowerCase();


                            const material =
                                String(
                                    polozka.material ||
                                    ""
                                )
                                .toLowerCase();


                            const polozkaText =
                                String(
                                    polozka.polozka ||
                                    ""
                                )
                                .toLowerCase();


                            return (

                                zakazka.includes(
                                    hledat
                                )

                                ||

                                objednavka.includes(
                                    hledat
                                )

                                ||

                                atest.includes(
                                    hledat
                                )

                                ||

                                stroj.includes(
                                    hledat
                                )

                                ||

                                material.includes(
                                    hledat
                                )

                                ||

                                polozkaText.includes(
                                    hledat
                                )

                            );

                        }
                    );
            }



            /*
                NOVÁ ZAKÁZKA
            */

            const nove =
                data.filter(
                    polozka =>
                        polozka.stav ===
                        "nova_zakazka"
                );


            /*
                ČEKÁ NA PRŮVODKU
            */

            const ceka =
                data.filter(
                    polozka =>
                        polozka.stav ===
                        "ceka_na_pruvodku"
                );


            /*
                PRŮVODKA HOTOVÁ
            */

            const hotove =
                data.filter(
                    polozka =>
                        polozka.stav ===
                        "pruvodka_vytvorena"
                );



            document.getElementById(
                "pocetNove"
            ).innerText =
                nove.length;


            document.getElementById(
                "pocetCeka"
            ).innerText =
                ceka.length;


            document.getElementById(
                "pocetHotove"
            ).innerText =
                hotove.length;



            vykresliNove(
                nove
            );


            vykresliCekajici(
                ceka
            );


            vykresliHotove(
                hotove
            );

        }



        /*
            ======================================
            NOVÉ ZAKÁZKY BEZ MATERIÁLU
            ======================================
        */

        function vykresliNove(
            data
        ) {

            const seznam =
                document.getElementById(
                    "seznamNove"
                );


            if (
                data.length === 0
            ) {

                seznam.innerHTML = `

                    <div class="prazdne">

                        Žádná zakázka momentálně
                        nečeká na vydání materiálu.

                    </div>

                `;

                return;
            }


            seznam.innerHTML =
                "";


            data.forEach(
                polozka => {

                    seznam.innerHTML += `

                        <div class="karta karta-nova">


                            <div class="zakazka">

                                Zakázka:
                                ${escapeHtml(
                                    polozka.cislo_zakazky ||
                                    "neuvedena"
                                )}

                            </div>


                            <div class="objednavka">

                                Objednávka:

                                <span class="cislo-objednavky">

                                    ${escapeHtml(
                                        polozka.objednavka ||
                                        "neuvedena"
                                    )}

                                </span>

                            </div>


                            <div class="detail">

                                Výkres zákazníka:

                                <strong>

                                    ${escapeHtml(
                                        polozka.vykres_zakaznika ||
                                        "neuveden"
                                    )}

                                </strong>

                                <br>


                                Výkres dodavatele:

                                <strong>

                                    ${escapeHtml(
                                        polozka.vykres_dodavatele ||
                                        "neuveden"
                                    )}

                                </strong>

                                <br>


                                Počet kusů:

                                <strong>

                                    ${formatCeleCislo(
                                        polozka.pozadovany_pocet_kusu
                                    )} ks

                                </strong>

                                <br>


                                Termín:

                                <span class="termin">

                                    ${formatDatum(
                                        polozka.termin
                                    )}

                                </span>

                                <br>


                                Stroj:

                                <span class="stroj">

                                    ${escapeHtml(
                                        polozka.stroj ||
                                        "neuveden"
                                    )}

                                </span>

                                <br>


                                Položka:

                                <strong>

                                    ${escapeHtml(
                                        polozka.polozka ||
                                        "neuvedena"
                                    )}

                                </strong>

                                <br>


                                Ks / 7,5 h:

                                <strong>

                                    ${formatCeleCislo(
                                        polozka.ks_za_7_5_hod
                                    )}

                                </strong>


                                <br>


                                <span class="stav-bez-materialu">

                                    📦 Materiál ještě nebyl vydán

                                </span>

                            </div>


                            <div class="spodni">

                                Zakázku založil Os. č.

                                ${escapeHtml(
                                    polozka.osobni_cislo ||
                                    ""
                                )}

                                |

                                ${formatDatum(
                                    polozka.datum
                                )}

                            </div>


                            <button
                                class="tlacitko vydat-material"
                                onclick="vydatMaterial(${Number(
                                    polozka.id
                                )})"
                            >

                                📦 VYDAT MATERIÁL

                            </button>


                        </div>

                    `;

                }
            );
        }



        /*
            ======================================
            ČEKÁ NA PRŮVODKU
            ======================================
        */

        function vykresliCekajici(
            data
        ) {

            const seznam =
                document.getElementById(
                    "seznamCeka"
                );


            if (
                data.length === 0
            ) {

                seznam.innerHTML = `

                    <div class="prazdne">

                        Nic nečeká na vytvoření průvodky.

                    </div>

                `;

                return;
            }


            seznam.innerHTML =
                "";


            data.forEach(
                polozka => {

                    seznam.innerHTML += `

                        <div class="karta karta-ceka">

                            ${obsahMaterialoveKarty(
                                polozka
                            )}


                            <button
                                class="tlacitko vytvorit"
                                onclick="otevritPruvodku(${Number(
                                    polozka.id
                                )})"
                            >

                                📋 VYTVOŘIT PRŮVODKU

                            </button>

                        </div>

                    `;

                }
            );
        }



        /*
            ======================================
            PRŮVODKA HOTOVÁ
            ======================================
        */

        function vykresliHotove(
            data
        ) {

            const seznam =
                document.getElementById(
                    "seznamHotove"
                );


            if (
                data.length === 0
            ) {

                seznam.innerHTML = `

                    <div class="prazdne">

                        Zatím není žádná hotová průvodka.

                    </div>

                `;

                return;
            }


            seznam.innerHTML =
                "";


            data.forEach(
                polozka => {

                    seznam.innerHTML += `

                        <div class="karta karta-hotova">

                            ${obsahMaterialoveKarty(
                                polozka
                            )}


                            <button
                                class="tlacitko upravit"
                                onclick="otevritPruvodku(${Number(
                                    polozka.id
                                )})"
                            >

                                ✏️ OTEVŘÍT / UPRAVIT PRŮVODKU

                            </button>


                            <button
                                id="vyroba${Number(
                                    polozka.id
                                )}"
                                class="tlacitko do-vyroby"
                                onclick="presunoutDoVyroby(${Number(
                                    polozka.id
                                )})"
                            >

                                ▶ PŘESUNOUT DO VÝROBY

                            </button>


                        </div>

                    `;

                }
            );
        }



        /*
            ======================================
            KARTA S MATERIÁLEM
            ======================================
        */

        function obsahMaterialoveKarty(
            polozka
        ) {

            const zakazkaHTML =
                polozka.cislo_zakazky
                ? `

                    <div class="zakazka">

                        Zakázka:
                        ${escapeHtml(
                            polozka.cislo_zakazky
                        )}

                    </div>

                `
                : "";


            return `

                ${zakazkaHTML}


                <div class="objednavka">

                    Objednávka:

                    <span class="cislo-objednavky">

                        ${escapeHtml(
                            polozka.objednavka ||
                            "neuvedena"
                        )}

                    </span>

                </div>


                <div class="material">

                    ${escapeHtml(
                        polozka.material ||
                        "Materiál neuveden"
                    )}

                </div>


                <div class="detail">

                    ${escapeHtml(
                        polozka.druh ||
                        ""
                    )}

                    ${polozka.rozmer ? " | " : ""}

                    ${escapeHtml(
                        polozka.rozmer ||
                        ""
                    )}

                    ${polozka.delka ? " | " : ""}

                    ${escapeHtml(
                        polozka.delka ||
                        ""
                    )}

                    <br>


                    Tavba:

                    <span class="tavba">

                        ${escapeHtml(
                            polozka.atest ||
                            "neuvedena"
                        )}

                    </span>

                    <br>


                    Počet tyčí:

                    <span class="pocet">

                        ${formatCeleCislo(
                            polozka.pocet_tyci
                        )} ks

                    </span>


                    ${
                        polozka.pozadovany_pocet_kusu
                        ? `

                            <br>

                            Požadováno:

                            <strong>

                                ${formatCeleCislo(
                                    polozka.pozadovany_pocet_kusu
                                )} ks

                            </strong>

                        `
                        : ""
                    }


                    ${
                        polozka.stroj
                        ? `

                            <br>

                            Stroj:

                            <strong>

                                ${escapeHtml(
                                    polozka.stroj
                                )}

                            </strong>

                        `
                        : ""
                    }

                </div>


                <div class="spodni">

                    Datum:
                    ${formatDatum(
                        polozka.datum
                    )}

                    |

                    Os. č.
                    ${escapeHtml(
                        polozka.osobni_cislo ||
                        ""
                    )}

                </div>

            `;

        }



        /*
            ======================================
            VYDAT MATERIÁL
            ======================================

            V DALŠÍM KROKU VYTVOŘÍME
            vydat-material.html
        */

        function vydatMaterial(
            id
        ) {

            window.location.href =
                "vydat-material.html?id=" +
                encodeURIComponent(
                    id
                );
        }



        /*
            ======================================
            OTEVŘÍT PRŮVODKU
            ======================================
        */

        function otevritPruvodku(
            id
        ) {

            window.location.href =
                "pruvodka.html?id=" +
                encodeURIComponent(
                    id
                );
        }



        /*
            ======================================
            PŘESUN DO VÝROBY
            ======================================
        */

        async function presunoutDoVyroby(
            id
        ) {

            const button =
                document.getElementById(
                    "vyroba" + id
                );


            button.disabled =
                true;


            button.innerText =
                "PŘESOUVÁM...";


            const {
                error
            } =
                await supabaseClient
                    .rpc(
                        "presunout_do_vyroby",
                        {
                            p_rozpracovane_id:
                                id
                        }
                    );


            if (error) {

                alert(
                    "Přesun do výroby se nepodařil:\n" +
                    error.message
                );


                button.disabled =
                    false;


                button.innerText =
                    "▶ PŘESUNOUT DO VÝROBY";


                return;
            }


            /*
                BEZ POTVRZOVACÍHO OKNA

                POLOŽKA JEN ZMIZÍ
                Z ROZPRACOVANÝCH
            */

            await nactiRozpracovane();
        }



        /*
            ======================================
            FORMÁT DATA
            ======================================
        */

        function formatDatum(
            datum
        ) {

            if (!datum) {

                return "neuvedeno";
            }


            const pouzeDatum =
                String(
                    datum
                )
                .split("T")[0];


            const casti =
                pouzeDatum
                    .split("-");


            if (
                casti.length !== 3
            ) {

                return escapeHtml(
                    datum
                );
            }


            return (
                Number(
                    casti[2]
                ) +
                ". " +
                Number(
                    casti[1]
                ) +
                ". " +
                casti[0]
            );
        }



        /*
            ======================================
            FORMÁT CELÉHO ČÍSLA
            ======================================
        */

        function formatCeleCislo(
            cislo
        ) {

            const hodnota =
                Number(
                    cislo
                );


            if (
                !Number.isFinite(
                    hodnota
                )
            ) {

                return "0";
            }


            return hodnota
                .toLocaleString(
                    "cs-CZ",
                    {
                        maximumFractionDigits:
                            0
                    }
                );
        }



        /*
            ======================================
            OCHRANA TEXTŮ
            ======================================
        */

        function escapeHtml(
            hodnota
        ) {

            return String(
                hodnota ?? ""
            )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
        }



        /*
            ======================================
            START
            ======================================
        */

        zkontrolujPrihlaseni();

    </script>
